<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>P52 采集总览 · C 风格待审核</title>
    <link rel="stylesheet" href="overview.css" />
    <script defer src="data.js"></script>
    <script defer src="source-logic.js"></script>
    <script defer src="overview.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">跳到研判工作区</a>
    <header class="appbar">
      <strong>SCOUTOPS <span>平台管理</span></strong
      ><span>P52 / C 风格 · 待审核</span>
    </header>
    <div class="workspace">
      <aside class="scope-side">
        <h1>采集总览</h1>
        <p>先核对异常事实，再确认恢复范围。</p>
        <nav class="surface-links" aria-label="采集管理">
          <a href="/platform-admin/collection/overview" aria-current="page">采集总览</a
          ><a href="/platform-admin/collection">任务队列</a
          ><a href="/platform-admin/collection/browser-runtime">浏览器运行</a>
        </nav>
        <button id="open-scope" aria-haspopup="dialog">观测范围与时间</button>
        <div id="scope-home">
          <form id="scope-form">
            <h2>观测范围</h2>
            <label>组织内部编号<input id="org" autocomplete="off" /></label>
            <label>工作区内部编号<input id="workspace" autocomplete="off" /></label>
            <label
              >采集来源<select id="provider">
                <option value="">全部来源</option>
              </select></label
            >
            <label
              >观测时间<select id="window">
                <option value="24h">最近24小时</option>
                <option value="7d">最近7天</option>
                <option value="30d">最近30天</option>
                <option value="all">全部时间</option>
              </select></label
            >
            <p id="scope-error" role="alert"></p>
            <div class="actions">
              <button id="reset" type="button">重置</button
              ><button id="apply" type="submit">应用范围</button>
            </div>
            <small>输入不会直接发请求。来源健康仅按来源筛选；各统计使用各自时间字段。</small>
          </form>
        </div>
        <nav class="section-links" aria-label="本页分区">
          <a href="#roots">死信根因</a><a href="#attempts">最近尝试</a><a href="#dead">死信与重放</a
          ><a href="#sources">来源健康</a>
        </nav>
        <small class="side-note"
          >仅使用仓库测试夹具与标注的合成场景，不访问真实任务、凭证或服务。</small
        >
      </aside>
      <main id="main" tabindex="-1">
        <p class="provenance" id="provenance"></p>
        <header class="page-heading">
          <div>
            <h2>异常研判工作台</h2>
            <p id="observed"></p>
          </div>
          <button id="refresh">刷新数据</button>
        </header>
        <div id="read-notice" role="status"></div>
        <div id="content"></div>
        <p class="disclaimer">
          C 风格审核提案。重放创建新任务，不代表采集已成功；模拟请求不证明生产结果。
        </p>
      </main>
    </div>
    <dialog id="scope-dialog" aria-labelledby="scope-title" aria-describedby="scope-description">
      <header class="dialog-header">
        <div>
          <h2 id="scope-title">观测范围与时间</h2>
          <p id="scope-description">填写后应用；无效范围保留在此修正。</p>
        </div>
        <button data-close>关闭</button>
      </header>
      <div id="scope-slot" class="dialog-body"></div>
    </dialog>
    <dialog
      id="record-dialog"
      aria-labelledby="record-title"
      aria-describedby="record-description"
    ></dialog>
    <dialog
      id="confirm-dialog"
      role="alertdialog"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-description"
    ></dialog>
    <details id="review-tools">
      <summary>审核工具（非业务界面）</summary>
      <label>图稿场景<select id="scene-picker"></select></label>
      <div class="actions">
        <button data-result="success">模拟成功</button
        ><button data-result="error">模拟明确失败</button
        ><button data-result="unknown">模拟结果未知</button
        ><button data-result="timeout">模拟读取超时</button>
      </div>
      <p id="simulation-note" role="status"></p>
      <details>
        <summary>本轮模拟请求意图</summary>
        <pre id="intents"></pre>
      </details>
    </details>
  </body>
</html>
