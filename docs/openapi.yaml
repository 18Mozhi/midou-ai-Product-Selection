                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/ResourceGrantEnvelope" },
                  },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /org/admin/summary:
    get:
      summary: Read the current organization administration dashboard
      description: Requires organization:manage and the active selected organization; all counters are database facts.
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          {
            description: Organization-scoped factual summary,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        $ref: "#/components/schemas/OrganizationAdminEnvelope",
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /org/admin/profile:
    get:
      summary: Read the current organization profile
      security: [{ HttpOnlySession: [] }]
      responses:
        {
          "200": { description: Current organization profile },
          "401": { $ref: "#/components/responses/Error" },
          "403": { $ref: "#/components/responses/Error" },
        }
    patch:
      summary: Update the current organization profile with optimistic locking
      description: Requires organization:manage, same-origin request, Idempotency-Key, reason and expected_version.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required:
                        [
                          name,
                          timezone,
                          data_retention_days,
                          default_workspace_id,
                          expected_version,
                          reason,
                        ],
                      properties:
                        {
                          name: { type: string, maxLength: 120 },
                          logo_url:
                            { type: string, format: uri, nullable: true },
                          timezone: { type: string, maxLength: 64 },
                          data_retention_days:
                            { type: integer, minimum: 30, maximum: 3650 },
                          default_workspace_id: { type: string, format: uuid },
                          expected_version: { type: integer, minimum: 1 },
                          reason:
                            { type: string, minLength: 1, maxLength: 500 },
                        },
                    },
                },
            },
        }
      responses:
        {
          "200": { description: Audited profile update },
          "400": { $ref: "#/components/responses/Error" },
          "401": { $ref: "#/components/responses/Error" },
          "403": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /org/admin/members:
    get:
      summary: List current organization members and pending invitations
      description: Requires membership:read and never returns another organization.
      security: [{ HttpOnlySession: [] }]
      responses:
        {
          "200": { description: Scoped members and invitations },
          "401": { $ref: "#/components/responses/Error" },
          "403": { $ref: "#/components/responses/Error" },
        }
  /org/admin/invitations:
    post:
      summary: Create an auditable pending organization invitation
      description: Requires membership:manage. Email delivery remains provider_pending until a provider contract is configured.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [email, role_code, reason],
                      properties:
                        {
                          email: { type: string, format: email },
                          role_code:
                            {
                              type: string,
                              enum:
                                [
                                  member,
                                  selection_manager,
                                  procurement_member,
                                  organization_admin,
                                  auditor,
                                ],
                            },
                          reason:
                            { type: string, minLength: 1, maxLength: 500 },
                        },
                    },
                },
            },
        }
      responses:
        {
          "202":
            { description: Invitation persisted in pending delivery state },
          "400": { $ref: "#/components/responses/Error" },
          "401": { $ref: "#/components/responses/Error" },
          "403": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
