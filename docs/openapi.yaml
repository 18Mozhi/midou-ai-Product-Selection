                items: { type: string, enum: [selection_manager, organization_admin] },
              }
            published_at: { type: string, format: date-time, nullable: true }
            updated_at: { type: string, format: date-time }
    ExchangeRateInput:
      type: object
      required:
        [
          provider_id,
          base_currency,
          quote_currency,
          rate_value,
          quote_date,
          observed_at,
          source_ref_id,
          evidence_id,
        ]
      properties:
        provider_id: { type: string, format: uuid }
        base_currency: { type: string, minLength: 3, maxLength: 3 }
        quote_currency: { type: string, minLength: 3, maxLength: 3 }
        rate_value: { type: number, exclusiveMinimum: 0 }
        quote_date: { type: string, format: date }
        observed_at: { type: string, format: date-time }
        source_ref_id: { type: string, minLength: 1, maxLength: 255 }
        evidence_id: { type: string, format: uuid }
    OpportunityCostInput:
      type: object
      required:
        [
          platform,
          input_type,
          amount_value,
          currency,
          source_type,
          source_ref_id,
          evidence_id,
          observed_at,
          expected_version,
          reviewer_id,
        ]
      properties:
        platform: { type: string, minLength: 1, maxLength: 80 }
        input_type: { type: string, enum: [sale_price, purchase_price, logistics] }
        amount_value: { type: number, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        source_type: { type: string, minLength: 1, maxLength: 80 }
        source_ref_id: { type: string, minLength: 1, maxLength: 255 }
        evidence_id: { type: string, format: uuid }
        observed_at: { type: string, format: date-time }
        expected_version: { type: integer, minimum: 1 }
        reviewer_id:
          {
            type: string,
            format: uuid,
            description: Must be a different active member with cost:confirm.,
          }
    ProfitAnalysisEnvelope:
      type: object
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          required: [latest_run, current_inputs, cost_input_reviews]
          properties:
            latest_run: { type: object, nullable: true, additionalProperties: true }
            current_inputs: { type: array, items: { type: object, additionalProperties: true } }
            cost_input_reviews:
              type: array
              items:
                type: object
                required:
                  [id, status, submitter_id, reviewer_id, due_at, overdue, can_review, version]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [pending, approved, rejected] }
                  submitter_id: { type: string, format: uuid }
                  reviewer_id: { type: string, format: uuid }
                  due_at: { type: string, format: date-time }
                  overdue: { type: boolean }
                  can_review: { type: boolean }
                  decision_reason: { type: string, nullable: true }
                  reviewed_at: { type: string, format: date-time, nullable: true }
                  version: { type: integer, minimum: 1 }
        request_id: { type: string }
        trace_id: { type: string }
    OpportunitySummary:
      type: object
      required:
        [
          id,
          name,
          market,
          source_type,
          lifecycle_status,
          lifecycle_entered_at,
          lifecycle_dwell_seconds,
          recommendation_status,
          overall_score,
          trend_score,
          competition_score,
          profit_status,
          risk_level,
          confidence,
          evidence_count,
          source_count,
          competitor_count,
          supplier_candidate_count,
          coverage_status,
          blocking_reasons,
          decision_status,
          version,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        market: { type: string }
        category: { type: string, nullable: true }
        source_type: { type: string, enum: [manual, trend_topic] }
        source_ref_id: { type: string, format: uuid, nullable: true }
        owner_id: { type: string, format: uuid, nullable: true }
        lifecycle_status:
          {
            type: string,
            enum: [candidate, validating, ready, adopted, observing, rejected, archived],
          }
        lifecycle_entered_at: { type: string, format: date-time }
        lifecycle_dwell_seconds:
          {
            type: integer,
            minimum: 0,
            description: Persisted current-stage age calculated by the server at read time,
          }
        recommendation_status:
          { type: string, enum: [insufficient_data, recommend, observe, not_recommend] }
        overall_score: { type: number, minimum: 0, maximum: 100, nullable: true }
        trend_score: { type: number, minimum: 0, maximum: 100, nullable: true }
        competition_score: { type: number, minimum: 0, maximum: 100, nullable: true }
        profit_status: { type: string, enum: [insufficient_data, calculated] }
        risk_level: { type: string, enum: [unknown, low, medium, high] }
        confidence:
          {
            type: object,
            required: [status, score],
            properties:
              {
                status: { type: string, enum: [insufficient_data, measured] },
                score: { type: number, minimum: 0, maximum: 100, nullable: true },
              },
          }
        evidence_count: { type: integer, minimum: 0 }
        source_count: { type: integer, minimum: 0 }
        coverage_status: { type: string, enum: [insufficient, partial, complete] }
        blocking_reasons:
          type: array
          items: { type: string, enum: [evidence_insufficient, recommendation_insufficient] }
        decision_status: { type: string, enum: [pending, adopted, observing, rejected] }
        version: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
    OpportunityEnvelope:
      type: object
      required: [data, request_id, trace_id]
      properties:
        {
          data: { $ref: "#/components/schemas/OpportunitySummary" },
          request_id: { type: string },
          trace_id: { type: string },
        }
    OpportunityPageEnvelope:
      type: object
      required: [data, meta, request_id, trace_id]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/OpportunitySummary" } }
        meta:
          {
            type: object,
            required: [page, page_size, total],
            properties:
              {
                page: { type: integer, minimum: 1 },
                page_size: { type: integer, minimum: 1, maximum: 100 },
                total: { type: integer, minimum: 0 },
              },
          }
        request_id: { type: string }
        trace_id: { type: string }
    OpportunityOperatingFeedbackInput:
      type: object
      additionalProperties: false
      required:
        [
          period_start,
          period_end,
          sales_units,
          revenue_amount,
          ad_spend_amount,
          returned_units,
          purchase_lead_time_days,
          actual_profit_amount,
          currency,
          source_ref,
          observed_at,
          expected_version,
        ]
      properties:
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        sales_units: { type: integer, minimum: 0 }
        revenue_amount: { type: number, minimum: 0 }
        ad_spend_amount: { type: number, minimum: 0 }
        returned_units: { type: integer, minimum: 0 }
        purchase_lead_time_days: { type: integer, minimum: 0, maximum: 3650 }
        actual_profit_amount: { type: number }
        currency: { type: string, pattern: "^[A-Za-z]{3}$" }
        source_ref: { type: string, minLength: 1, maxLength: 255 }
        notes: { type: string, maxLength: 1000, nullable: true }
        observed_at: { type: string, format: date-time }
        expected_version: { type: integer, minimum: 1 }
    OpportunityOperatingFact:
      type: object
      required:
        [
          id,
          period_start,
          period_end,
          sales_units,
          revenue_amount,
          ad_spend_amount,
          returned_units,
          purchase_lead_time_days,
          actual_profit_amount,
          currency,
          source_ref,
          notes,
          score_rule_version_snapshot,
          profit_rule_version_snapshot,
          decision_status_snapshot,
          predicted_profit_amount,
          predicted_currency,
          quoted_lead_time_days,
          observed_at,
          request_id,
          trace_id,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        sales_units: { type: integer, minimum: 0 }
        revenue_amount: { type: number, minimum: 0 }
        ad_spend_amount: { type: number, minimum: 0 }
        returned_units: { type: integer, minimum: 0 }
        purchase_lead_time_days: { type: integer, minimum: 0 }
        actual_profit_amount: { type: number }
        currency: { type: string }
        source_ref: { type: string }
        notes: { type: string, nullable: true }
        score_rule_version_snapshot: { type: string, nullable: true }
        profit_rule_version_snapshot: { type: string, nullable: true }
        decision_status_snapshot: { type: string, enum: [pending, adopted, observing, rejected] }
        predicted_profit_amount: { type: number, nullable: true }
        predicted_currency: { type: string, nullable: true }
        quoted_lead_time_days: { type: integer, nullable: true }
        observed_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
        created_at: { type: string, format: date-time }
    OpportunityOperatingFeedback:
      type: object
      required: [facts, calibration]
      properties:
        facts:
          {
            type: array,
            maxItems: 20,
            items: { $ref: "#/components/schemas/OpportunityOperatingFact" },
          }
        calibration:
          type: object
          nullable: true
          required:
            [
              fact_id,
              return_rate_percent,
              ad_spend_ratio_percent,
              profit_variance_amount,
              profit_variance_currency,
              lead_time_variance_days,
              score_rule_version,
              profit_rule_version,
              decision_status_snapshot,
              human_review_required,
              automatic_rule_update,
              automatic_decision,
            ]
          properties:
            fact_id: { type: string, format: uuid }
            return_rate_percent: { type: number, nullable: true }
            ad_spend_ratio_percent: { type: number, nullable: true }
            profit_variance_amount: { type: number, nullable: true }
            profit_variance_currency: { type: string, nullable: true }
            lead_time_variance_days: { type: integer, nullable: true }
            score_rule_version: { type: string, nullable: true }
            profit_rule_version: { type: string, nullable: true }
            decision_status_snapshot:
              { type: string, enum: [pending, adopted, observing, rejected] }
            human_review_required: { type: boolean, enum: [true] }
            automatic_rule_update: { type: boolean, enum: [false] }
            automatic_decision: { type: boolean, enum: [false] }
    OpportunityOperatingFeedbackEnvelope:
      type: object
      required: [data, request_id, trace_id]
      properties:
        data: { $ref: "#/components/schemas/OpportunityOperatingFeedback" }
        request_id: { type: string }
        trace_id: { type: string }
    OpportunityDetailEnvelope:
      type: object
      required: [data, request_id, trace_id]
      properties:
        data:
          allOf:
            - { $ref: "#/components/schemas/OpportunitySummary" }
            - type: object
              required:
                [
                  score_rule_version,
                  scored_at,
                  latest_score_run,
                  score_components,
                  adoption_blockers,
                  redecision_ready,
                  lineage,
                  operating_feedback,
                  evidence,
                  decisions,
                  section_status,
                ]
              properties:
                operating_feedback: { $ref: "#/components/schemas/OpportunityOperatingFeedback" }
                lineage:
                  type: object
                  required: [freshness, failure_impact, request_ids, trace_ids, nodes]
                  properties:
                    freshness:
                      type: object
                      required: [observed_at, age_seconds]
                      properties:
                        observed_at: { type: string, format: date-time, nullable: true }
                        age_seconds: { type: integer, minimum: 0, nullable: true }
                    failure_impact:
                      type: object
                      required: [level, codes, affected_stages]
                      properties:
                        level: { type: string, enum: [none, degraded, blocked] }
                        codes: { type: array, items: { type: string } }
                        affected_stages: { type: array, items: { type: string } }
                    request_ids: { type: array, items: { type: string } }
                    trace_ids: { type: array, items: { type: string } }
                    nodes:
                      type: array
                      items:
                        type: object
                        required:
                          [kind, id, label, status, occurred_at, request_id, trace_id, route]
                        properties:
                          kind:
                            {
                              type: string,
                              enum:
                                [
                                  source,
                                  collection_task,
                                  collection_attempt,
                                  evidence,
                                  quality_issue,
                                  trend,
                                  opportunity,
                                  score,
                                  profit,
                                  task,
                                  notification,
                                ],
                            }
                          id: { type: string }
                          label: { type: string }
                          status: { type: string }
                          occurred_at: { type: string, format: date-time }
                          request_id: { type: string, nullable: true }
                          trace_id: { type: string, nullable: true }
                          route: { type: string }
                score_rule_version: { type: string, nullable: true }
                scored_at: { type: string, format: date-time, nullable: true }
                latest_score_run:
                  {
                    type: object,
                    nullable: true,
                    required:
                      [
                        id,
                        status,
                        coverage_percent,
                        confidence_score,
                        recommendation_status,
                        missing_fields,
                        scored_at,
                      ],
                    properties:
                      {
                        id: { type: string, format: uuid },
                        status: { type: string, enum: [calculated, insufficient_data] },
                        coverage_percent: { type: number, minimum: 0, maximum: 100 },
                        confidence_score:
                          { type: number, minimum: 0, maximum: 100, nullable: true },
                        recommendation_status:
                          {
                            type: string,
                            enum: [insufficient_data, recommend, observe, not_recommend],
                          },
                        missing_fields: { type: array, items: { type: string } },
                        scored_at: { type: string, format: date-time },
                      },
                  }
                score_components:
                  {
                    type: array,
                    items:
                      {
                        type: object,
                        required:
                          [
                            dimension_code,
                            weight_percent,
                            input_score,
                            weighted_score,
                            evidence_ids,
                            missing_fields,
                          ],
                        properties:
                          {
                            dimension_code: { type: string },
                            weight_percent: { type: number },
                            input_score: { type: number, nullable: true },
                            weighted_score: { type: number, nullable: true },
                            evidence_ids: { type: array, items: { type: string, format: uuid } },
                            missing_fields: { type: array, items: { type: string } },
                          },
                      },
                  }
                adoption_blockers:
                  type: array
                  items:
                    type: object
                    required:
                      [
                        code,
                        status,
                        progress_percent,
                        next_action,
                        task_id,
                        task_status,
                        score_job_status,
                      ]
                    properties:
                      code:
                        { type: string, enum: [evidence_insufficient, recommendation_insufficient] }
                      status: { type: string, enum: [blocked, in_progress, cleared] }
                      progress_percent: { type: integer, minimum: 0, maximum: 100, nullable: true }
                      next_action: { type: string }
                      task_id: { type: string, format: uuid, nullable: true }
                      task_status: { type: string, nullable: true }
                      score_job_status: { type: string, nullable: true }
                redecision_ready:
                  {
                    type: boolean,
                    description: True only after an evidence-completion task has triggered a completed score job,
                  }
                evidence:
                  {
                    type: array,
                    items:
                      {
                        type: object,
                        required:
                          [
                            id,
                            title,
                            publisher,
                            canonical_url,
                            provider_id,
                            raw_evidence_id,
                            observed_at,
                          ],
                        properties:
                          {
                            id: { type: string, format: uuid },
                            title: { type: string },
                            publisher: { type: string },
                            canonical_url: { type: string, format: uri },
                            provider_id: { type: string, format: uuid },
                            raw_evidence_id: { type: string, format: uuid },
                            observed_at: { type: string, format: date-time },
                          },
                      },
                  }
                decisions:
                  {
                    type: array,
                    items:
                      {
                        type: object,
                        required: [id, action, reason, actor_id, created_at, opportunity_version],
                        properties:
                          {
                            id: { type: string, format: uuid },
                            action: { type: string, enum: [adopt, observe, reject] },
                            reason: { type: string },
                            actor_id: { type: string, format: uuid },
                            created_at: { type: string, format: date-time },
                            opportunity_version: { type: integer, minimum: 2 },
                          },
                      },
                  }
                section_status:
                  {
                    type: object,
                    required: [market, competition, profit, risk, execution],
                    properties:
                      {
                        market: { type: string, enum: [covered, insufficient_data] },
                        competition: { type: string, enum: [covered, insufficient_data] },
                        profit: { type: string, enum: [insufficient_data, calculated] },
                        risk: { type: string, enum: [covered, insufficient_data] },
                        execution: { type: string, enum: [not_available] },
                      },
                  }
    OrganizationAdminEnvelope:
      type: object
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          required:
            [
              organization,
              members,
              workspaces,
              teams,
              pending_approvals,
              active_tokens,
              recent_audit_events,
              observed_at,
            ]
          properties:
            organization: { type: object, additionalProperties: true }
            members:
              {
                type: object,
                required: [total, active],
                properties:
                  { total: { type: integer, minimum: 0 }, active: { type: integer, minimum: 0 } },
              }
            workspaces:
              {
                type: object,
                required: [total, active],
                properties:
                  { total: { type: integer, minimum: 0 }, active: { type: integer, minimum: 0 } },
              }
            teams:
              {
                type: object,
                required: [total, active],
                properties:
                  { total: { type: integer, minimum: 0 }, active: { type: integer, minimum: 0 } },
              }
            pending_approvals: { type: integer, minimum: 0 }
            active_tokens: { type: integer, minimum: 0 }
            recent_audit_events: { type: integer, minimum: 0 }
            observed_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
