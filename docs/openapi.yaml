                  {
                    type: string,
                    enum: [unverified, measured_single_host_limited],
                  }
                stop_reason:
                  {
                    type: string,
                    nullable: true,
                    enum: [next_stage_gate_failed, planning_ceiling_reached],
                  }
                failed_next_concurrency:
                  { type: integer, nullable: true, enum: [10, 20] }
                failed_next_code:
                  {
                    type: string,
                    nullable: true,
                    description: Sanitized fixed-gate failure code for the attempted next stage,
                  }
