openapi: 3.0.3
info:
  title: ScoutOps Internal API
  version: 0.1.0
  description: P00 foundation, P01 identity/tenancy/RBAC, and P02 scoped UI preference contracts. Organization-visible endpoints require server-side authorization.
servers:
  - url: /api/v1
x-scoutops-verification:
  runtimeApiExposed: false
  reason: Software completion commands execute only in local, CI, or Baota-controlled tasks and do not require disk, capacity-load, PVE, or production-resource evidence.
  completionProfile: software
  operationalEvidenceRequired: false
  statePersistence: verification/state.json
  commands:
    module: npm run verify:module -- M00-01
    phase: npm run verify:phase -- P00
    all: npm run verify:all
    releaseMatrix: node scripts/verify-release-matrix.mjs --validate
    securityGate: npm run verify:security-gate
  releaseMatrixRuntimeApiExposed: false
  securityGateRuntimeApiExposed: false
x-scoutops-redis:
  runtimeApiExposed: true
  reason: M00-04 provides the backend-only scoped key contract; M08-02 adds a platform:operate protected and audited single-instance resilience view without exposing connection details or keys.
  keyScope: "scoutops:v1:<purpose>:org:<organization_id>:ws:<workspace_id>:..."
  purposes: [cache, queue, rate, sse]
  secretFields: [REDIS_PASSWORD]
x-scoutops-mysql:
  runtimeApiExposed: false
  reason: M00-03 provides a backend-only MySQL 5.7 contract; M00-05 owns readiness routing and authorization middleware.
  requiredVersion: "5.7"
  requiredCharset: utf8mb4
  requiredDatabaseAndAccount: product_scout
  baotaSingleHostResourceProfile:
    innodbBufferPoolSize: 4096M
    innodbBufferPoolInstances: 4
    innodbIoCapacity: 1000
    innodbIoCapacityMax: 4000
    innodbFlushNeighbors: 0
    innodbFlushMethod: O_DIRECT
x-scoutops-file-audit:
  runtimeApiExposed: false
  reason: M00-06 provides backend-only path, grant and audit contracts; authorized download routing is added with identity modules.
  pathScope: "organizations/<organization_id>/workspaces/<workspace_id>/..."
  downloadGrantMaximumSeconds: 300
  sensitiveMetadataKeys: [password, secret, token, cookie, authorization, api_key, private_key]
x-scoutops-baota-s0:
  productionDeployed: true
  deploymentStatus: healthy
  manifest: infra/baota/service-manifest.json
  targetHost: 192.168.1.220
  targetDomain: midouai.mozhiz.cn
  deployRoot: /www/wwwroot/ai选品
  backendProject: ai选品
  backendStartCommand: node apps/backend/dist/server.js
  backendProjectCount: 1
  productionEvidence: .artifacts/verification/baota-production-evidence.json
  livenessPath: /api/v1/health/live
  readinessPath: /api/v1/health/ready
  businessAvailabilityPath: /api/v1/health/available
  asyncRuntimeStatus: structured Worker heartbeat inside the unified BaoTa Node backend
  completionGate: build, startup, health, permissions and real browser functionality; excludes disk and capacity
x-scoutops-backup-recovery:
  module: M07-04
  productionManager: baota
  primaryRegion: 惠州
  recoveryRegion: 惠州
  topology: same-host-local-isolation
  mysqlRpoMinutes: 15
  mysqlRtoMinutes: 240
  mysqlBusinessConnection: product_scout-over-tcp
  mysqlAdminTransport: unix-socket
  encryption: aes-256-gcm
  recoveryVerifiedByDefault: false
  productionEvidence: .artifacts/verification/backup-recovery-production-evidence.json
x-scoutops-release-rollout:
  module: M07-05
  productionManager: baota
  topology: single-host-stable-and-candidate
  backupServerUsed: false
  percentages: [5, 25, 100]
  minimumObservationSeconds: 1800
  syntheticProbeIntervalSeconds: 1
  publicProbe:
    connectAddress: 127.0.0.1
    tlsSniHostPreserved: true
    manager: baota-nginx
    purpose: 避免公网回环波动，同时保留正式 HTTPS 与宝塔 Nginx 的真实发布采样
  taskTrigger: manual_only
  concurrencyProtection:
    concurrentRuns: 1
    lock: mysql_session_named_lock
    lockName: "scoutops:m07-05:release-rollout"
    lockTimeoutSeconds: 0
    attemptHistoryPreserved: true
  mysqlDurability:
    innodbFlushLogAtTrxCommit: 2
    syncBinlog: 1
    binlogFormat: ROW
    productScoutBinlogExcluded: false
    osCrashDataLossWindowSeconds: 1
    verificationAccount: product_scout@127.0.0.1 with global REPLICATION CLIENT
  samplingPolicy: 1 秒采样用于提高低流量 S0 的候选 P95 样本分辨率，不缩短观察时间或放宽停止阈值
  automaticStop: true
  productionEvidence: .artifacts/verification/release-rollout-production-evidence.json
x-scoutops-platform-seed:
  runtimeApiExposed: false
  command: node scripts/seed-platform-admin.mjs
  environment: [PLATFORM_ADMIN_SEED_EMAIL, PLATFORM_ADMIN_SEED_PASSWORD]
  lifecycle: inject in one Baota-controlled release task, run once, then delete both variables
  sourceCatalogSync: successful seed immediately synchronizes the code-owned Provider catalog; API startup remains the idempotent fallback
  restrictedSessionError: security_setup_required
x-scoutops-design-themes:
  module: M02-01
  identifiers: [deep-ocean, aurora-purple, cloud-white]
  default: deep-ocean
  rule: Themes only change color, shadow, background and chart semantic colors; they never change authorization, data scope, feature visibility or business conclusions.
paths:
  /health/live:
    get:
      summary: Process liveness
      security: []
      responses:
        "200":
          description: Process is alive; this check does not read MySQL, Redis or providers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthLiveEnvelope" }
  /health/ready:
    get:
      summary: API readiness
      security: []
      responses:
        "200":
          description: Required configuration, MySQL and Redis can serve synchronous traffic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReadyEnvelope" }
        "503":
          description: Sanitized dependency unavailable envelope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /health/available:
    get:
      summary: Business processing availability
      description: Separates process liveness and synchronous dependency readiness from the ability of the supervised Worker scheduler to accept and process background business tasks.
      security: []
      responses:
        "200":
          description: Business processing is available or degraded with explicit service categories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthBusinessEnvelope" }
        "503":
          description: Runtime topology or the Worker scheduler heartbeat is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthBusinessEnvelope" }
  /health/version:
    get:
      summary: Sanitized build and configuration identity
      security: []
      responses:
        "200":
          description: Version data without configuration values or secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthVersionEnvelope" }
  /health/nodes:
    get:
      summary: Sanitized single-server API health
      description: M08-01 fails closed unless the configured API node has a fresh ready heartbeat on the configured current Baota host. It does not expose host identity and does not assert load balancing, high availability or capacity.
      security: []
      responses:
        "200":
          description: M08-01 single-server runtime gate is ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeNodesHealthEnvelope" }
        "503":
          description: The configured single-server API is empty, blocked or stale; sanitized counters are returned for operations probing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeNodesHealthEnvelope" }
  /platform/operations/topology:
    get:
      summary: Read audited single-server runtime facts
      description: Read-only platform operations surface for the current BaoTa host. It includes bounded continuous probes of the fixed live, ready and available health endpoints with sample counts, timeout counts and P50/P95/P99 latency, plus a bounded 24-hour API and Worker restart trend sampled into five-minute buckets. It marks supervisor counter resets without inventing negative restarts and correlates runtime alerts to exact queues plus allowlisted business object identifiers from the latest one-minute Worker result when available. Probe response bodies, raw job payloads, credentials and private endpoints are never stored or returned; missing exact associations stay empty.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: platform:operate
      responses:
        "200":
          description: Current M08-01 single-server facts; state may be empty, blocked, stale or ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeTopologyEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/operations/redis:
    get:
      summary: Read audited Redis single-instance resilience facts
      description: M08-02 reports sanitized AOF/RDB, memory, connection and fail-closed findings for the current BaoTa Redis. It also scans at most 128 scoutops:v1 keys and returns only purpose/resource-class memory-usage aggregates; no raw key, organization/workspace identifier, payload or access-frequency claim is exposed. It never returns host, port or password and makes no Sentinel, cluster, replica or capacity claim.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: platform:operate
      responses:
        "200":
          description: Current Redis resilience state is ready, warning or blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedisResilienceEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/operations/mysql:
    get:
      summary: Read audited MySQL 5.7 single-primary resilience facts
      description: M08-03 reports sanitized durability, connection, storage, I/O, slow-query and recovery facts for the current BaoTa MySQL 5.7 single primary. It never returns host, port, account, password, data path, binlog filename or SQL text and makes no replica, load-balancing, backup-server or capacity claim.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: platform:operate
      responses:
        "200":
          description: Current MySQL single-primary resilience state is ready, warning or blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MySqlResilienceEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/operations/files:
    get:
      summary: Read audited local managed file resilience facts
      description: M08-04 reports sanitized evidence/export directory availability, capacity, checksum sampling and same-host encrypted recovery facts for the current BaoTa host. It never returns paths, filenames, hashes, organization identifiers or file content and makes no shared-storage, backup-server or capacity claim.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: platform:operate
      responses:
        "200":
          description: Current local file resilience state is ready, warning or blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileResilienceEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/operations/crawler-scheduler:
    get:
      summary: Read audited S0 single-host Crawler scheduler facts
      description: M08-05 reports separately observed process counts for the supervised Node Worker and the BaoTa-managed Python Crawler, plus global and provider lease aggregates, provider-level due queue counts, wait percentiles, 24-hour success/P95 samples, isolated runtime circuit state, hourly throughput/failure trend, browser-profile exclusivity, host resource watermarks and sanitized completion-receipt capacity/retention facts. Queue facts count distinct provider tasks only after available_at is due, so future retry or rate-limit backoff is not reported as current waiting. Receipt facts contain only counts, bytes and timestamps; they never contain paths, filenames or receipt payloads. It never returns scope identifiers, task payloads, lease tokens or hashes, credentials or cookies and makes no load-balancing, backup-server, multi-node or capacity claim.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: platform:operate
      responses:
        "200":
          {
            description: Current single-host scheduler state is ready,
            warning or blocked,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CrawlerSchedulerEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/operations/crawler-scheduler/recover-expired:
    post:
      summary: Idempotently recover only expired single-host scheduler slots
      description: M08-05 deletes only scheduler leases whose expires_at is not later than server time, records a platform audit event and never terminates a valid collection or browser run.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: platform:operate
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Expired slots recovered or an earlier idempotent result replayed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /platform/operations/crawler-scheduler/providers/{providerId}/recover:
    post:
      summary: Idempotently recover one isolated provider runtime circuit
      description: Recovery is rejected unless the provider is enabled and has a ready adapter-health observation newer than the circuit opened_at time. It resets only that provider circuit and records platform audit evidence.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: platform:operate
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          {
            description: One provider circuit recovered,
            no-op result,
            or earlier idempotent result replayed,
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /platform/operations/capacity:
    get:
      summary: Read audited S0 measured single-host capacity boundary
      description: M08-06 reports only the latest same-commit controlled measurement, fixed latency/error/lag/resource gates and existing archive/recovery verification for the current Huizhou BaoTa host. Every warning or blocker includes a factual reason and assigns the platform_operations_admin responsibility role that already owns platform:operate; it never fabricates a named individual. Measurement always attempts fixed 5-10-20 order and stops at the first failed gate; concurrency 5 must pass, and any limited claim names only the last passing stage while preserving the failed next stage. Planning 100 users and 5-20 concurrent users are not promises. The response never claims load balancing, a backup server, multi-node or 10,000-user capability.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: platform:operate
      responses:
        "200":
          {
            description: Current measured single-host capacity state is ready,
            warning or blocked,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CapacityBoundaryEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/operations/capacity/drills:
    post:
      summary: Idempotently attest an already verified archive and isolated recovery drill
      description: M08-06 records an archive_recovery attestation only when the latest measured observation already contains verified archive and recovery facts. It creates no service, backup server or new topology.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: platform:operate
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, reason]
              properties:
                kind: { type: string, enum: [archive_recovery] }
                reason: { type: string, minLength: 2, maxLength: 500 }
      responses:
        "200": { description: Verified drill attested or an earlier idempotent result replayed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/register:
    post:
      summary: Register a local email account and queue verification delivery
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          {
            application/json: { schema: { $ref: "#/components/schemas/LocalAccountRegistration" } },
          }
      responses:
        "201":
          {
            description: Pending-verification account without action or session token,
            content:
              {
                application/json: { schema: { $ref: "#/components/schemas/LocalAccountEnvelope" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/email-verification/confirm:
    post:
      summary: Consume a single-use email verification token
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/ActionTokenConfirm" } } },
        }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      summary: Authenticate a verified local account and set an opaque HttpOnly session cookie
      security: []
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/LocalLoginRequest" } } },
        }
      responses:
        "200":
          description: Authenticated for the configured 30-day session lifetime; raw session token exists only in Set-Cookie
          headers:
            {
              Set-Cookie:
                {
                  schema: { type: string },
                  description: "__Host-scoutops_session with Secure, HttpOnly, SameSite=Strict, Path=/ and Max-Age=2592000",
                },
            }
          content: { application/json: { schema: { $ref: "#/components/schemas/LoginEnvelope" } } }
        "202":
          description: Password accepted; TOTP or one-time recovery code is still required
          headers:
            {
              Set-Cookie:
                {
                  schema: { type: string },
                  description: "__Host-scoutops_mfa_challenge; Secure; HttpOnly; SameSite=Strict; short lived",
                },
            }
          content:
            { application/json: { schema: { $ref: "#/components/schemas/MfaChallengeEnvelope" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
  /auth/session-status:
    get:
      summary: Resolve browser session presence without using an expected 401 response
      description: Returns authenticated false with HTTP 200 when the HttpOnly session cookie is missing or invalid. The response is no-store and exposes no user, session or tenancy identifiers.
      security: []
      responses:
        "200":
          description: Current browser session status for frontend account-route admission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionStatusEnvelope" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/mfa/totp/verify:
    post:
      summary: Complete a short-lived MFA login challenge and create a session
      security: [{ HttpOnlyMfaChallenge: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/MfaCodeRequest" } } },
        }
      responses:
        "200":
          description: Challenge consumed once; challenge cookie cleared and session cookie set
          headers:
            {
              Set-Cookie:
                {
                  schema: { type: array, items: { type: string } },
                  description: "30-day session cookie with Max-Age=2592000 plus expired MFA challenge cookie",
                },
            }
          content: { application/json: { schema: { $ref: "#/components/schemas/LoginEnvelope" } } }
        "401": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: Revoke the current local session and clear browser state
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Session revoked and cookie cleared }
        "401": { $ref: "#/components/responses/Error" }
  /auth/password-reset/request:
    post:
      summary: Queue a password reset if the account exists; response is enumeration-safe
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/PasswordResetRequest" } } },
        }
      responses:
        "202":
          {
            description: Always accepted for a syntactically valid email,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/AcceptedEnvelope" } } },
          }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/password-reset/confirm:
    post:
      summary: Consume a single-use reset token, change password and revoke sessions
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/PasswordResetConfirm" } } },
        }
      responses:
        "204": { description: Password changed; all sessions revoked }
        "400": { $ref: "#/components/responses/Error" }
  /me/password:
    post:
      summary: Change own password after current-password verification and revoke all sessions
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json: { schema: { $ref: "#/components/schemas/PasswordChangeRequest" } },
            },
        }
      responses:
        "204": { description: Password changed and session cookie cleared }
        "401": { $ref: "#/components/responses/Error" }
  /me/security-setup:
    get:
      summary: Read the authenticated seed administrator's forced security setup state
      description: A restricted seed session may call only password, MFA, security-setup and logout endpoints until both steps complete.
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          {
            description: Security setup posture without secrets,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SecuritySetupEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
  /me/sessions:
    get:
      summary: List only the authenticated user's device sessions
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          {
            description: Own sessions without token hashes,
            content:
              {
                application/json: { schema: { $ref: "#/components/schemas/SessionListEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
  /me/mfa:
    get:
      summary: Read the authenticated user's MFA status and non-enabled enterprise identity capabilities
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          {
            description: Own MFA status without encrypted secret or recovery hashes,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/MfaStatusEnvelope" } } },
          }
        "401": { $ref: "#/components/responses/Error" }
  /me/mfa/totp/enrollment:
    post:
      summary: Reauthenticate and create a pending encrypted TOTP factor
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/MfaEnrollmentRequest" } } },
        }
      responses:
        "201":
          {
            description: Secret is displayed only for this enrollment response and must never be logged,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/MfaEnrollmentEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /me/mfa/totp/confirm:
    post:
      summary: Verify the pending factor and return one-time recovery codes once
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/MfaCodeRequest" } } },
        }
      responses:
        "200":
          {
            description: TOTP enabled and recovery codes shown once,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/MfaEnrollmentConfirmEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /me/mfa/totp:
    delete:
      summary: Reauthenticate with password and current second factor, disable TOTP and revoke every session
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: "#/components/schemas/MfaDisableRequest" } } },
        }
      responses:
        "204": { description: TOTP disabled; all sessions and browser cookie revoked }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /me/sessions/{sessionId}:
    delete:
      summary: Revoke one session owned by the authenticated user
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Owned session revoked }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /org/memberships:
    get:
      summary: List organizations where the authenticated user has an active membership
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          {
            description: Membership-backed organization choices only,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/OrganizationMembershipListEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
  /org/{organizationId}/workspaces:
    get:
      summary: List workspaces in an organization after active-membership guard
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/OrganizationId" }]
      responses:
        "200":
          {
            description: Organization-scoped workspace choices,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/WorkspaceListEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /org/{organizationId}/teams:
    get:
      summary: List organization-level teams after active-membership guard
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/OrganizationId" }]
      responses:
        "200":
          {
            description: Organization-scoped team summaries without role or member details,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/TeamListEnvelope" } } },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /auth/context:
    post:
      summary: Select an active organization and workspace for the current session
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/TenancyContextSelection" } },
            },
        }
      responses:
        "200":
          {
            description: Audited session context selected idempotently,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SelectedTenancyContextEnvelope" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/authorization:
    get:
      summary: Read the authenticated user's effective roles, capabilities and data scopes for the selected session context
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          {
            description: Server-computed effective authorization without internal assignment identifiers,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CurrentAuthorizationEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/navigation:
    get:
      summary: Guard and describe one authenticated navigation shell
      description: The server derives shell access from active organization membership or platform role and writes an authorization decision. The organization shell accepts organization administrators and an active auditor with audit:read; the auditor receives only capability-gated audit navigation and cannot open unscoped organization management routes. Platform administrators do not require an organization context.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - {
            name: shell,
            in: query,
            required: true,
            schema: { type: string, enum: [member, organization_admin, platform_admin] },
          }
      responses:
        "200":
          {
            description: Audited shell access and server-derived role context,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/NavigationGuardEnvelope" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/landing:
    get:
      summary: Resolve the authenticated user's preferred application landing
      description: Platform administrators land in the platform console without an organization context. Otherwise the active organization context selects the organization-admin or member workspace; users without an active context are sent to context selection. Every resolution writes an authorization decision.
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          {
            description: Audited role-aware landing route,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/LandingEnvelope" } } },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /me/global-search:
    get:
      summary: Search indexed resources in the selected organization and workspace
      description: Requires an active selected context and task:read. Results are additionally filtered by each document's required capability. Optional resource_type and exact persisted status filters apply before pagination; assignee matches only a task assignee or opportunity owner by id or display label and never treats a creator as an owner.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - {
            name: q,
            in: query,
            required: true,
            schema: { type: string, minLength: 2, maxLength: 100 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 20, default: 10 },
          }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
        - {
            name: resource_type,
            in: query,
            schema: { type: string, enum: [task, opportunity, evidence, collection_task] },
          }
        - { name: status, in: query, schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,39}$" } }
        - { name: assignee, in: query, schema: { type: string, minLength: 1, maxLength: 120 } }
      responses:
        "200":
          {
            description: Capability-filtered workspace search results,
            content:
              {
                application/json: { schema: { $ref: "#/components/schemas/GlobalSearchEnvelope" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/quick-actions:
    get:
      summary: List capability-filtered quick-create entry points
      description: Returns navigation-only entries in validated shell role priority. The browser may temporarily promote recently used entries in the current SPA without persistent tracking.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - {
            name: shell,
            in: query,
            required: true,
            schema: { type: string, enum: [member, organization_admin, platform_admin] },
          }
      responses:
        "200":
          {
            description: Navigation entries only; this endpoint performs no business mutation,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/QuickActionListEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/home-dashboard:
    get:
      summary: Read the current user's scoped cross-module home dashboard
      description: Requires an active selected context and task:read. Today actions merge active tasks assigned to the user, pending approval nodes assigned to the user, and pending opportunities owned by or created unassigned by the user; stored projection items remain capability and audience scoped. Actions are ordered by overdue, blocking, high risk, high value and normal, then by persisted risk, value score and deadline. Health items must target the authenticated user.
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          {
            description: Capability and audience filtered home dashboard,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/HomeDashboardEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /org/{organizationId}/roles:
    get:
      summary: List the fixed organization role and capability matrix
      description: Requires role:read, active membership, organization data scope and the same selected organization context.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/OrganizationId" }]
      responses:
        "200":
          {
            description: Read-only organization role catalog,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/RoleCapabilityListEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /platform/roles:
    get:
      summary: List the fixed platform role and capability matrix
      description: Requires platform:superadmin. Returns the authoritative active platform role catalog used by the role comparison UI.
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          {
            description: Read-only platform role catalog,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/RoleCapabilityListEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /me/resource-grants:
    get:
      summary: List exact-resource grants for the authenticated membership in the selected organization
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          {
            description: Current membership grants with derived active,
            expired or revoked status,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ResourceGrantListEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /org/{organizationId}/resource-grants:
    get:
      summary: List organization resource grants
      description: Requires role:read, organization scope and the selected organization context.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrganizationId" }
        - { $ref: "#/components/parameters/Page" }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - { name: status, in: query, schema: { type: string, enum: [active, revoked, expired] } }
      responses:
        "200":
          {
            description: Paginated organization grants,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ResourceGrantListEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    post:
      summary: Grant minimal actions on one resource to an active membership in the same organization
      description: Requires role:manage. Evidence download, export, credential reference and replay actions are excluded. Expiry cannot exceed 30 days.
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/OrganizationId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CreateResourceGrantRequest" } },
            },
        }
      responses:
        "201":
          {
            description: Audited resource grant,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ResourceGrantEnvelope" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /org/{organizationId}/resource-grant-targets:
    get:
      summary: List active same-organization memberships eligible for resource grants
      description: Requires membership:read and never returns members from another organization.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/OrganizationId" }]
      responses:
        "200":
          {
            description: Eligible active members,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/EligibleResourceGrantMemberListEnvelope" },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /org/{organizationId}/resource-grants/{grantId}/expiry:
    patch:
      summary: Extend an active resource grant with optimistic version locking
      description: Requires role:manage. Expired or revoked grants cannot be reactivated; create a new grant instead.
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/OrganizationId" },
          { $ref: "#/components/parameters/GrantId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ExtendResourceGrantRequest" } },
            },
        }
      responses:
        "200":
          {
            description: Extended and audited resource grant,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ResourceGrantEnvelope" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /org/{organizationId}/resource-grants/{grantId}/revoke:
    post:
      summary: Revoke an active resource grant with optimistic version locking
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/OrganizationId" },
          { $ref: "#/components/parameters/GrantId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/RevokeResourceGrantRequest" } },
            },
        }
      responses:
        "200":
          {
            description: Revoked and audited resource grant,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ResourceGrantEnvelope" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /org/admin/summary:
    get:
      summary: Read the current organization administration dashboard
      description: Requires organization:manage and the active selected organization; all counters are database facts.
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          {
            description: Organization-scoped factual summary,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/OrganizationAdminEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /org/admin/profile:
    get:
      summary: Read the current organization profile
      security: [{ HttpOnlySession: [] }]
      responses:
        {
          "200": { description: Current organization profile },
          "401": { $ref: "#/components/responses/Error" },
          "403": { $ref: "#/components/responses/Error" },
        }
    patch:
      summary: Update the current organization profile with optimistic locking
      description: Requires organization:manage, same-origin request, Idempotency-Key, reason and expected_version.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required:
                        [
                          name,
                          timezone,
                          data_retention_days,
                          default_workspace_id,
                          expected_version,
                          reason,
                        ],
                      properties:
                        {
                          name: { type: string, maxLength: 120 },
                          logo_url: { type: string, format: uri, nullable: true },
                          timezone: { type: string, maxLength: 64 },
                          data_retention_days: { type: integer, minimum: 30, maximum: 3650 },
                          default_workspace_id: { type: string, format: uuid },
                          expected_version: { type: integer, minimum: 1 },
                          reason: { type: string, minLength: 1, maxLength: 500 },
                        },
                    },
                },
            },
        }
      responses:
        {
          "200": { description: Audited profile update },
          "400": { $ref: "#/components/responses/Error" },
          "401": { $ref: "#/components/responses/Error" },
          "403": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /org/admin/members:
    get:
      summary: List current organization members and pending invitations
      description: Requires membership:read, includes member role and team names plus actionable or expired invitation lifecycle records, and never returns another organization.
      security: [{ HttpOnlySession: [] }]
      responses:
        {
          "200": { description: Scoped members and invitations },
          "401": { $ref: "#/components/responses/Error" },
          "403": { $ref: "#/components/responses/Error" },
        }
  /org/admin/invitations:
    post:
      summary: Create an auditable pending organization invitation
      description: Requires membership:manage. Email delivery remains provider_pending until a provider contract is configured.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [email, role_code, reason],
                      properties:
                        {
                          email: { type: string, format: email },
                          role_code:
                            {
                              type: string,
                              enum:
                                [
                                  member,
                                  selection_manager,
                                  procurement_member,
                                  organization_admin,
                                  auditor,
                                ],
                            },
                          reason: { type: string, minLength: 1, maxLength: 500 },
                        },
                    },
                },
            },
        }
      responses:
        {
          "202": { description: Invitation persisted in pending delivery state },
          "400": { $ref: "#/components/responses/Error" },
          "401": { $ref: "#/components/responses/Error" },
          "403": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /org/admin/invitations/{invitationId}/actions:
    post:
      summary: Revoke a pending organization invitation
      description: Requires membership:manage, is versioned and idempotent, and only accepts invitations from the current organization that are still pending delivery or acceptance.
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [action, expected_version, reason],
                      properties:
                        {
                          action: { type: string, enum: [revoke] },
                          expected_version: { type: integer, minimum: 1 },
                          reason: { type: string, minLength: 1, maxLength: 500 },
                        },
                    },
                },
            },
        }
      responses:
        {
          "200": { description: Audited revoked invitation state },
          "400": { $ref: "#/components/responses/Error" },
          "401": { $ref: "#/components/responses/Error" },
          "403": { $ref: "#/components/responses/Error" },
          "404": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /org/admin/members/{membershipId}/actions:
    post:
      summary: Disable or restore a same-organization membership
      description: Requires membership:manage; self-disable and removal of the last active organization administrator fail closed.
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      responses:
        {
          "200": { description: Versioned membership state },
          "400": { $ref: "#/components/responses/Error" },
          "403": { $ref: "#/components/responses/Error" },
          "404": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /org/admin/members/{membershipId}/roles:
    post:
      summary: Replace a membership organization role from the fixed catalog
      description: Requires role:manage and protects the last active organization administrator.
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [role_code, expected_version, reason],
                      properties:
                        {
                          role_code:
                            {
                              type: string,
                              enum:
                                [
                                  member,
                                  selection_manager,
                                  procurement_member,
                                  organization_admin,
                                  auditor,
                                ],
                            },
                          expected_version: { type: integer, minimum: 1 },
                          reason: { type: string, minLength: 1, maxLength: 500 },
                        },
                    },
                },
            },
        }
      responses:
        {
          "200": { description: Audited role assignment },
          "400": { $ref: "#/components/responses/Error" },
          "403": { $ref: "#/components/responses/Error" },
          "404": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /org/admin/roles:
    get:
      summary: Read fixed organization role capability templates
      security: [{ HttpOnlySession: [] }]
      responses:
        {
          "200": { description: Organization role catalog },
          "403": { $ref: "#/components/responses/Error" },
        }
  /org/admin/workspaces:
    get:
      summary: List current organization workspaces
      security: [{ HttpOnlySession: [] }]
      responses:
        {
          "200": { description: Scoped workspace list },
          "403": { $ref: "#/components/responses/Error" },
        }
    post:
      summary: Create a workspace in the current organization
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        {
          "201": { description: Audited workspace },
          "400": { $ref: "#/components/responses/Error" },
          "403": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /org/admin/workspaces/{workspaceId}/actions:
    post:
      summary: Archive or restore a same-organization workspace
      description: The current default workspace cannot be archived.
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      responses:
        {
          "200": { description: Versioned workspace state },
          "403": { $ref: "#/components/responses/Error" },
