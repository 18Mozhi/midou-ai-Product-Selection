      required: [raw_evidence_id, title, publisher, canonical_url, observed_at, topic_id]
      properties:
        raw_evidence_id: { type: string, format: uuid }
        title: { type: string, nullable: true }
        publisher: { type: string, nullable: true }
        canonical_url: { type: string, format: uri }
        observed_at: { type: string, format: date-time }
        topic_id: { type: string, format: uuid, nullable: true }
    SelectionJourneyEnvelope:
      type: object
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          required:
            [
              id,
              organization_id,
              workspace_id,
              input_kind,
              input_value,
              provider_code,
              task_id,
              task_status,
              state,
              available_result_count,
              results,
              accepted_at,
              elapsed_ms,
              deadline_ms,
              within_deadline,
              request_id,
              trace_id,
            ]
          properties:
            id: { type: string, format: uuid }
            organization_id: { type: string, format: uuid }
            workspace_id: { type: string, format: uuid }
            input_kind: { type: string, enum: [keyword, asin, product_url] }
            input_value: { type: string }
            provider_code: { type: string, enum: [google_news_search] }
            task_id: { type: string, format: uuid }
            task_status: { type: string }
            state:
              {
                type: string,
                enum: [accepted, running, result_ready, succeeded_empty, blocked, failed, decided],
              }
            coverage_status: { type: string, nullable: true }
            available_result_count: { type: integer, minimum: 0 }
            results:
              type: array
              maxItems: 20
              items: { $ref: "#/components/schemas/SelectionJourneyCandidate" }
            first_result:
              {
                allOf: [{ $ref: "#/components/schemas/SelectionJourneyCandidate" }],
                nullable: true,
                deprecated: true,
                description: Compatibility alias for the first item in results,
              }
            blocked_reason: { type: string, nullable: true }
            blocked_owner: { type: string, nullable: true }
            blocked_next_step: { type: string, nullable: true }
            timeline:
              type: array
              items:
                type: object
                required: [stage, label, status]
                properties:
                  stage: { type: string, enum: [queued, collecting, parsing, decision] }
                  label: { type: string }
                  status: { type: string, enum: [waiting, active, completed, blocked] }
                  occurred_at: { type: string, format: date-time, nullable: true }
            decision: { type: object, nullable: true, additionalProperties: true }
            opportunity_id: { type: string, format: uuid, nullable: true }
            verification_task_id: { type: string, format: uuid, nullable: true }
            accepted_at: { type: string, format: date-time }
            terminal_at: { type: string, format: date-time, nullable: true }
            decided_at: { type: string, format: date-time, nullable: true }
            elapsed_ms: { type: integer, minimum: 0 }
            deadline_ms: { type: integer, enum: [180000] }
            within_deadline: { type: boolean }
            request_id: { type: string }
            trace_id: { type: string }
        request_id: { type: string }
        trace_id: { type: string }
    OneTimeSecretEnvelope:
      type: object
      required: [data, request_id, trace_id]
