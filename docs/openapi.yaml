  /internal/crawler-runtime/acquire:
    post:
      summary: Acquire a scoped crawler profile lease for the BaoTa Python consumer
      security: [{ CrawlerServiceBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organization_id, workspace_id, profile_id, lease_owner, lease_seconds]
              properties:
                organization_id: { type: string, format: uuid }
                workspace_id: { type: string, format: uuid }
                profile_id: { type: string, format: uuid }
                lease_owner: { type: string }
                lease_seconds: { type: integer, minimum: 30, maximum: 600 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /internal/crawler-runtime/jobs/acquire:
    post:
      summary: Claim the next authenticated-browser business subquery
      description: The BaoTa Python Crawler first reports sanitized completion-spool counts, byte watermarks, retention policy and free-disk facts, then receives one business-linked browser job, the scoped execution plan, profile locale/timezone, encrypted credential record and a one-time lease token. The spool observation is persisted even when a 204 response means there is no runnable job. Paths, file names, receipt contents and plaintext credentials are never returned or stored by this contract.
      security: [{ CrawlerServiceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lease_owner, lease_seconds, completion_spool]
              properties:
                lease_owner: { type: string, minLength: 2, maxLength: 160 }
                lease_seconds: { type: integer, minimum: 30, maximum: 600 }
                completion_spool:
                  type: object
                  additionalProperties: false
                  required:
                    - pending_count
                    - pending_bytes
                    - quarantined_count
                    - quarantined_bytes
                    - oldest_pending_at
                    - retention_days
                    - max_bytes
                    - minimum_free_disk_mb
                    - free_disk_mb
                  properties:
                    pending_count: { type: integer, minimum: 0, maximum: 4294967295 }
                    pending_bytes: { type: integer, minimum: 0, maximum: 1099511627776 }
                    quarantined_count: { type: integer, minimum: 0, maximum: 4294967295 }
                    quarantined_bytes: { type: integer, minimum: 0, maximum: 1099511627776 }
                    oldest_pending_at: { type: string, format: date-time, nullable: true }
                    retention_days: { type: integer, minimum: 1, maximum: 3650 }
                    max_bytes: { type: integer, minimum: 1048576, maximum: 1099511627776 }
                    minimum_free_disk_mb: { type: integer, minimum: 128, maximum: 1048576 }
                    free_disk_mb: { type: integer, minimum: 0, maximum: 4294967295 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "204": { description: No runnable authenticated-browser job }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /internal/crawler-runtime/jobs/{jobId}/heartbeat:
    post:
      summary: Renew the business job, browser profile and single-host crawler leases together
      security: [{ CrawlerServiceBearer: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /internal/crawler-runtime/jobs/{jobId}/complete:
