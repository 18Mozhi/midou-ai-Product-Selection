        - {
            name: workspace_id,
            in: query,
            schema: { type: string, format: uuid },
          }
        - {
            name: provider_id,
            in: query,
            description: Filter task, attempt, dead-letter and quality facts by their real collection source,
            schema: { type: string, format: uuid },
          }
        - {
            name: window,
            in: query,
            description: Limit operational facts by their task update or event observation time,
            schema: { type: string, enum: [24h, 7d, 30d, all], default: 24h },
          }
        - {
            name: error_code,
            in: query,
            description: Drill recent attempts and dead letters by an exact returned error root,
            schema: { type: string, maxLength: 80 },
          }
