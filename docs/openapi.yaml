      description: Requires platform:operate. Optional organization_id, workspace_id, provider_id, window and exact error_code scope task, attempt, dead-letter and quality rows; root causes count exact collection_dead_letters.error_code facts only, excluding attempts that have not entered dead letter. Source definitions remain platform-global. Write and replay actions use their existing versioned idempotent endpoints.
