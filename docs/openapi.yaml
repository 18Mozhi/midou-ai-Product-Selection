openapi: 3.0.3
info:
  title: ScoutOps Internal API
  version: 0.1.0
  description: P00 foundation, P01 identity/tenancy/RBAC, and P02 scoped UI preference contracts. Organization-visible endpoints require server-side authorization.
servers:
  - url: /api/v1
x-scoutops-verification:
  runtimeApiExposed: false
  reason: Verification commands execute only in local, CI, or Baota-controlled release tasks.
  commands:
    module: npm run verify:module -- M00-01
    phase: npm run verify:phase -- P00
    all: npm run verify:all
x-scoutops-redis:
  runtimeApiExposed: false
  reason: M00-04 provides a backend-only scoped connection contract; M00-05 owns readiness routing and authorization middleware.
  keyScope: 'scoutops:v1:<purpose>:org:<organization_id>:ws:<workspace_id>:...'
  purposes: [cache, queue, rate, sse]
  secretFields: [REDIS_PASSWORD]
x-scoutops-mysql:
  runtimeApiExposed: false
  reason: M00-03 provides a backend-only MySQL 5.7 contract; M00-05 owns readiness routing and authorization middleware.
  requiredVersion: '5.7'
  requiredCharset: utf8mb4
  requiredDatabaseAndAccount: product_scout
x-scoutops-file-audit:
  runtimeApiExposed: false
  reason: M00-06 provides backend-only path, grant and audit contracts; authorized download routing is added with identity modules.
  pathScope: 'organizations/<organization_id>/workspaces/<workspace_id>/...'
  downloadGrantMaximumSeconds: 300
  sensitiveMetadataKeys: [password, secret, token, cookie, authorization, api_key, private_key]
x-scoutops-baota-s0:
  productionDeployed: false
  manifest: infra/baota/service-manifest.json
  livenessPath: /api/v1/health/live
  readinessPath: /api/v1/health/ready
  asyncRuntimeStatus: structured Worker and Crawler heartbeat logs in Baota
  capacityClaim: S0 single host only; no multi-node or 10000-user claim
x-scoutops-platform-seed:
  runtimeApiExposed: false
  command: node scripts/seed-platform-admin.mjs
  environment: [PLATFORM_ADMIN_SEED_EMAIL, PLATFORM_ADMIN_SEED_PASSWORD]
  lifecycle: inject in one Baota-controlled release task, run once, then delete both variables
  restrictedSessionError: security_setup_required
x-scoutops-design-themes:
  module: M02-01
  identifiers: [deep-ocean, aurora-purple, cloud-white]
  default: deep-ocean
  rule: Themes only change color, shadow, background and chart semantic colors; they never change authorization, data scope, feature visibility or business conclusions.
paths:
  /health/live:
    get:
      summary: Process liveness
      security: []
      responses:
        '200':
          description: Process is alive; this check does not read MySQL, Redis or providers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthLiveEnvelope' }
  /health/ready:
    get:
      summary: API readiness
      security: []
      responses:
        '200':
          description: Required configuration, MySQL and Redis can serve synchronous traffic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReadyEnvelope' }
        '503':
          description: Sanitized dependency unavailable envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /health/version:
    get:
      summary: Sanitized build and configuration identity
      security: []
      responses:
        '200':
          description: Version data without configuration values or secrets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthVersionEnvelope' }
  /auth/register:
    post:
      summary: Register a local email account and queue verification delivery
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LocalAccountRegistration' } } }
      responses:
        '201': { description: Pending-verification account without action or session token, content: { application/json: { schema: { $ref: '#/components/schemas/LocalAccountEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/email-verification/confirm:
    post:
      summary: Consume a single-use email verification token
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActionTokenConfirm' } } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      summary: Authenticate a verified local account and set an opaque HttpOnly session cookie
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocalLoginRequest' } } } }
      responses:
        '200':
          description: Authenticated; raw session token exists only in Set-Cookie
          headers: { Set-Cookie: { schema: { type: string }, description: '__Host-scoutops_session with Secure, HttpOnly, SameSite=Strict and Path=/' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LoginEnvelope' } } }
        '202':
          description: Password accepted; TOTP or one-time recovery code is still required
          headers: { Set-Cookie: { schema: { type: string }, description: '__Host-scoutops_mfa_challenge; Secure; HttpOnly; SameSite=Strict; short lived' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MfaChallengeEnvelope' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /auth/mfa/totp/verify:
    post:
      summary: Complete a short-lived MFA login challenge and create a session
      security: [{ HttpOnlyMfaChallenge: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaCodeRequest' } } } }
      responses:
        '200':
          description: Challenge consumed once; challenge cookie cleared and session cookie set
          headers: { Set-Cookie: { schema: { type: array, items: { type: string } }, description: 'Session cookie plus expired MFA challenge cookie' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LoginEnvelope' } } }
        '401': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      summary: Revoke the current local session and clear browser state
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Session revoked and cookie cleared }
        '401': { $ref: '#/components/responses/Error' }
  /auth/password-reset/request:
    post:
      summary: Queue a password reset if the account exists; response is enumeration-safe
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } } }
      responses:
        '202': { description: Always accepted for a syntactically valid email, content: { application/json: { schema: { $ref: '#/components/schemas/AcceptedEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/password-reset/confirm:
    post:
      summary: Consume a single-use reset token, change password and revoke sessions
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetConfirm' } } } }
      responses:
        '204': { description: Password changed; all sessions revoked }
        '400': { $ref: '#/components/responses/Error' }
  /me/password:
    post:
      summary: Change own password after current-password verification and revoke all sessions
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChangeRequest' } } } }
      responses:
        '204': { description: Password changed and session cookie cleared }
        '401': { $ref: '#/components/responses/Error' }
  /me/security-setup:
    get:
      summary: Read the authenticated seed administrator's forced security setup state
      description: A restricted seed session may call only password, MFA, security-setup and logout endpoints until both steps complete.
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Security setup posture without secrets, content: { application/json: { schema: { $ref: '#/components/schemas/SecuritySetupEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /me/sessions:
    get:
      summary: List only the authenticated user's device sessions
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Own sessions without token hashes, content: { application/json: { schema: { $ref: '#/components/schemas/SessionListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /me/mfa:
    get:
      summary: Read the authenticated user's MFA status and non-enabled enterprise identity capabilities
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Own MFA status without encrypted secret or recovery hashes, content: { application/json: { schema: { $ref: '#/components/schemas/MfaStatusEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /me/mfa/totp/enrollment:
    post:
      summary: Reauthenticate and create a pending encrypted TOTP factor
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaEnrollmentRequest' } } } }
      responses:
        '201': { description: Secret is displayed only for this enrollment response and must never be logged, content: { application/json: { schema: { $ref: '#/components/schemas/MfaEnrollmentEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /me/mfa/totp/confirm:
    post:
      summary: Verify the pending factor and return one-time recovery codes once
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaCodeRequest' } } } }
      responses:
        '200': { description: TOTP enabled and recovery codes shown once, content: { application/json: { schema: { $ref: '#/components/schemas/MfaEnrollmentConfirmEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /me/mfa/totp:
    delete:
      summary: Reauthenticate with password and current second factor, disable TOTP and revoke every session
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaDisableRequest' } } } }
      responses:
        '204': { description: TOTP disabled; all sessions and browser cookie revoked }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /me/sessions/{sessionId}:
    delete:
      summary: Revoke one session owned by the authenticated user
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Owned session revoked }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /org/memberships:
    get:
      summary: List organizations where the authenticated user has an active membership
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Membership-backed organization choices only, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationMembershipListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /org/{organizationId}/workspaces:
    get:
      summary: List workspaces in an organization after active-membership guard
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses:
        '200': { description: Organization-scoped workspace choices, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /org/{organizationId}/teams:
    get:
      summary: List organization-level teams after active-membership guard
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses:
        '200': { description: Organization-scoped team summaries without role or member details, content: { application/json: { schema: { $ref: '#/components/schemas/TeamListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/context:
    post:
      summary: Select an active organization and workspace for the current session
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TenancyContextSelection' } } } }
      responses:
        '200': { description: Audited session context selected idempotently, content: { application/json: { schema: { $ref: '#/components/schemas/SelectedTenancyContextEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /me/authorization:
    get:
      summary: Read the authenticated user's effective roles, capabilities and data scopes for the selected session context
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Server-computed effective authorization without internal assignment identifiers, content: { application/json: { schema: { $ref: '#/components/schemas/CurrentAuthorizationEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /me/navigation:
    get:
      summary: Guard and describe one authenticated navigation shell
      description: The server derives shell access from active organization membership or platform role and writes an authorization decision. Platform administrators do not require an organization context.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: shell, in: query, required: true, schema: { type: string, enum: [member, organization_admin, platform_admin] } }
      responses:
        '200': { description: Audited shell access and server-derived role context, content: { application/json: { schema: { $ref: '#/components/schemas/NavigationGuardEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /me/global-search:
    get:
      summary: Search indexed resources in the selected organization and workspace
      description: Requires an active selected context and task:read. Results are additionally filtered by each document's required capability.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 10 } }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Capability-filtered workspace search results, content: { application/json: { schema: { $ref: '#/components/schemas/GlobalSearchEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /me/quick-actions:
    get:
      summary: List capability-filtered quick-create entry points
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Navigation entries only; this endpoint performs no business mutation, content: { application/json: { schema: { $ref: '#/components/schemas/QuickActionListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /me/home-dashboard:
    get:
      summary: Read the current user's scoped home dashboard projection
      description: Requires an active selected context and task:read. Action, change and follow items are workspace or user scoped; health items must target the authenticated user. Empty arrays are returned until owning modules write real projections.
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Capability and audience filtered home dashboard, content: { application/json: { schema: { $ref: '#/components/schemas/HomeDashboardEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /org/{organizationId}/roles:
    get:
      summary: List the fixed organization role and capability matrix
      description: Requires role:read, active membership, organization data scope and the same selected organization context.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses:
        '200': { description: Read-only organization role catalog, content: { application/json: { schema: { $ref: '#/components/schemas/RoleCapabilityListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /me/resource-grants:
    get:
      summary: List exact-resource grants for the authenticated membership in the selected organization
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Current membership grants with derived active, expired or revoked status, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceGrantListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /org/{organizationId}/resource-grants:
    get:
      summary: List organization resource grants
      description: Requires role:read, organization scope and the selected organization context.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/Page' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { type: string, enum: [active, revoked, expired] } }
      responses:
        '200': { description: Paginated organization grants, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceGrantListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    post:
      summary: Grant minimal actions on one resource to an active membership in the same organization
      description: Requires role:manage. Evidence download, export, credential reference and replay actions are excluded. Expiry cannot exceed 30 days.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateResourceGrantRequest' } } } }
      responses:
        '201': { description: Audited resource grant, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceGrantEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /org/{organizationId}/resource-grant-targets:
    get:
      summary: List active same-organization memberships eligible for resource grants
      description: Requires membership:read and never returns members from another organization.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses:
        '200': { description: Eligible active members, content: { application/json: { schema: { $ref: '#/components/schemas/EligibleResourceGrantMemberListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /org/{organizationId}/resource-grants/{grantId}/expiry:
    patch:
      summary: Extend an active resource grant with optimistic version locking
      description: Requires role:manage. Expired or revoked grants cannot be reactivated; create a new grant instead.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/GrantId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExtendResourceGrantRequest' } } } }
      responses:
        '200': { description: Extended and audited resource grant, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceGrantEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /org/{organizationId}/resource-grants/{grantId}/revoke:
    post:
      summary: Revoke an active resource grant with optimistic version locking
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/GrantId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RevokeResourceGrantRequest' } } } }
      responses:
        '200': { description: Revoked and audited resource grant, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceGrantEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /platform/audit-events:
    get:
      summary: Query platform-global security audit events
      description: Requires audit:read through a platform role. This surface is read-only and never returns seed passwords or credential material.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { $ref: '#/components/parameters/AuditAction' }
        - { $ref: '#/components/parameters/AuditOutcome' }
        - { $ref: '#/components/parameters/AuditResourceType' }
        - { $ref: '#/components/parameters/AuditCursor' }
        - { $ref: '#/components/parameters/AuditLimit' }
        - { $ref: '#/components/parameters/AuditOccurredFrom' }
        - { $ref: '#/components/parameters/AuditOccurredTo' }
      responses:
        '200': { description: Cursor-paginated platform audit page, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityAuditPageEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /organizations/{organizationId}/audit-events:
    get:
      summary: Query audit events restricted to one organization
      description: Requires audit:read plus a matching active organization scope; auditor remains read-only.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/AuditAction' }
        - { $ref: '#/components/parameters/AuditOutcome' }
        - { $ref: '#/components/parameters/AuditResourceType' }
        - { $ref: '#/components/parameters/AuditCursor' }
        - { $ref: '#/components/parameters/AuditLimit' }
        - { $ref: '#/components/parameters/AuditOccurredFrom' }
        - { $ref: '#/components/parameters/AuditOccurredTo' }
      responses:
        '200': { description: Cursor-paginated organization audit page, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityAuditPageEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /trends:
    get:
      summary: List trend topics
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
  /opportunities:
    get:
      summary: List opportunities
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
    post:
      summary: Create an opportunity candidate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /tasks:
    get:
      summary: List authorized tasks
      responses:
        '200':
          description: Authorized task list with collection coverage when applicable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListEnvelope' }
  /subscriptions:
    get:
      summary: List organization monitoring subscriptions
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
  /reviews/analysis:
    post:
      summary: Create an auditable review pain-point analysis run
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/Success' }
  /analysis/validate:
    post:
      summary: Validate uploaded business data with approved statistical methods
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/Success' }
  /reports:
    get:
      summary: List authorized generated reports and exports
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
  /realtime/events:
    get:
      summary: Organization-filtered SSE stream
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream: {}
  /platform/providers:
    get:
      summary: List platform-global versioned provider definitions
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Provider definitions visible to platform operators with provider:configure, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderDefinitionListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      summary: Register a disabled-by-default platform provider technical contract
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProviderDefinitionInput' } } }
      responses:
        '201': { description: Version 1 provider definition, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderDefinitionEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /platform/providers/{providerId}:
    put:
      summary: Append a new version and update a platform provider definition
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProviderDefinitionUpdate' } } }
      responses:
        '200': { description: Updated versioned provider definition, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderDefinitionEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /platform/provider-adapters:
    get:
      summary: List platform Provider adapter registration and last health state
      description: Requires provider:configure. No credentials, cookies, raw payloads or organization data are returned.
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Adapter runtime catalog, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderAdapterListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /platform/provider-adapters/{providerId}/health-check:
    post:
      summary: Run a bounded healthCheck through the registered Provider adapter
      description: Unregistered adapters fail closed as blocked/adapter_not_registered. The endpoint never guesses a Provider request contract.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Persisted correlated health result, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderAdapterEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /platform/credential-provider-options:
    get:
      summary: List non-secret Provider options for platform security credential assignment
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Provider id code and name only, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialProviderOptionListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /platform/credential-assets:
    get:
      summary: List masked platform credential asset metadata
      description: Requires key_rotation:manage. Ciphertext, nonce, authentication tag and secret payload are never returned.
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Masked credential asset list, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialAssetListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      summary: Encrypt and create a platform credential asset
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialAssetCreateInput' } } } }
      responses:
        '201': { description: Masked created asset, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialAssetEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /platform/credential-assets/{assetId}/rotate:
    post:
      summary: Replace the encrypted payload and append a credential version
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialAssetRotateInput' } } } }
      responses:
        '200': { description: Masked rotated asset, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialAssetEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /platform/credential-assets/{assetId}/revoke:
    post:
      summary: Irreversibly revoke a platform credential asset while retaining audit history
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialAssetRevokeInput' } } } }
      responses:
        '200': { description: Masked revoked asset, content: { application/json: { schema: { $ref: '#/components/schemas/CredentialAssetEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /platform/crawler-profiles:
    get:
      summary: List platform crawler profile metadata and encrypted asset references
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Crawler profile metadata, content: { application/json: { schema: { $ref: '#/components/schemas/CrawlerProfileListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Create a crawler profile referencing an active encrypted browser profile asset
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CrawlerProfileInput' } } } }
      responses:
        '201': { description: Created profile metadata, content: { application/json: { schema: { $ref: '#/components/schemas/CrawlerProfileEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /platform/crawler-runtime:
    get:
      summary: List sanitized Playwright profile leases and scoped browser runs
      description: Requires collection:replay. Credential references, encrypted payloads, plans, temporary paths and lease tokens are never returned.
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Platform crawler runtime snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/CrawlerRuntimeEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /platform/crawler-runtime/recover-expired:
    post:
      summary: Recover only expired browser profile leases and mark their runs timed out
      description: Requires collection:replay, same-origin Origin and Idempotency-Key. Active leases and run history are retained.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses:
        '200': { description: Expired lease recovery count, content: { application/json: { schema: { $ref: '#/components/schemas/CrawlerLeaseRecoveryEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /platform/collection/tasks:
    get:
      summary: List scoped collection tasks for platform monitoring
      description: Requires collection:replay. Internal target_json, lease tokens and credentials are never returned.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: organization_id, in: query, schema: { type: string, format: uuid } }
        - { name: workspace_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TaskStatus' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paged task summaries, content: { application/json: { schema: { $ref: '#/components/schemas/TaskListEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /platform/collection/tasks/{taskId}:
    get:
      summary: Read task, subquery coverage, attempts, events and dead-letter detail
      security: [{ HttpOnlySession: [] }]
      parameters: [{ name: taskId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Collection task detail, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionTaskDetailEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /platform/collection/tasks/{taskId}/replay:
    post:
      summary: Manually replay one dead-letter task while retaining all history
      description: Requires collection:replay, same-origin Origin, Idempotency-Key and a 2-500 character reason.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties: { reason: { type: string, minLength: 2, maxLength: 500 } }
      responses:
        '200': { description: Newly scheduled replay task detail, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionTaskDetailEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /platform/data-quality:
    get:
      summary: List scoped evidence metadata, quality issues and recent reconciliation runs
      description: Requires platform:operate. Raw evidence content, file paths, credentials and cookies are never returned.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: organization_id, in: query, schema: { type: string, format: uuid } }
        - { name: workspace_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [open, resolved, all], default: all } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Evidence and data-quality dashboard, content: { application/json: { schema: { $ref: '#/components/schemas/DataQualityDashboardEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /platform/data/evidence/{evidenceId}:
    get:
      summary: Read evidence metadata, normalized versions, field provenance and linked quality issues
      description: Requires platform:operate. The raw body and storage path are excluded.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Evidence lineage detail, content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceDetailEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /platform/data-quality/issues/{issueId}/resolve:
    post:
      summary: Resolve a versioned quality issue while retaining evidence and history
      description: Requires platform:operate, same-origin Origin, Idempotency-Key, reason and expected_version.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: issueId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, expected_version]
              properties:
                reason: { type: string, minLength: 2, maxLength: 500 }
                expected_version: { type: integer, minimum: 1 }
      responses:
        '200': { description: Resolved quality issue, content: { application/json: { schema: { $ref: '#/components/schemas/QualityIssueEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /platform/data/evidence/{evidenceId}/download-grant:
    post:
      summary: Issue a short-lived evidence download grant
      description: Requires platform:operate, same-origin Origin and Idempotency-Key. Grant issuance is audited and no file path is returned.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses:
        '200': { description: Scoped short-lived grant, content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceDownloadGrantEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /platform/data/evidence/{evidenceId}/download:
    get:
      summary: Download integrity-checked evidence using a scoped short-lived grant
      description: Requires platform:operate. The grant is bound to organization, workspace, evidence and path; successful access is audited.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: evidenceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: grant, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Raw evidence bytes with X-Content-Sha256, headers: { X-Content-Sha256: { schema: { type: string, pattern: '^[a-f0-9]{64}$' } } }, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /me/ui-preferences:
    get:
      summary: Read the signed-in user's preference for the selected organization and workspace
      responses:
        '200': { description: Saved preference or deep-ocean default with version 0, content: { application/json: { schema: { $ref: '#/components/schemas/UiPreferenceEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      summary: Save the signed-in user's theme for the selected organization and workspace
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UiPreferenceUpdate' } } }
      responses:
        '200': { description: Versioned saved preference, content: { application/json: { schema: { $ref: '#/components/schemas/UiPreferenceEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
    HttpOnlySession:
      type: apiKey
      in: cookie
      name: __Host-scoutops_session
    HttpOnlyMfaChallenge:
      type: apiKey
      in: cookie
      name: __Host-scoutops_mfa_challenge
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GrantId:
      name: grantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuditAction: { name: action, in: query, schema: { type: string, maxLength: 128 } }
    AuditOutcome: { name: outcome, in: query, schema: { type: string, enum: [succeeded, failed, blocked] } }
    AuditResourceType: { name: resource_type, in: query, schema: { type: string, maxLength: 64 } }
    AuditCursor: { name: cursor, in: query, schema: { type: string, format: uuid } }
    AuditLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    AuditOccurredFrom: { name: occurred_from, in: query, schema: { type: string, format: date-time } }
    AuditOccurredTo: { name: occurred_to, in: query, schema: { type: string, format: date-time } }
  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    PaginatedSuccess:
      description: Paginated successful response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaginatedEnvelope' }
    Error:
      description: Stable sanitized error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    OrganizationMembershipSummary:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, timezone, default_workspace_id, membership_status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
        status: { type: string, enum: [active, archived] }
        timezone: { type: string, maxLength: 64 }
        default_workspace_id: { type: string, format: uuid, nullable: true }
        membership_status: { type: string, enum: [active, disabled] }
    WorkspaceSummary:
      type: object
      additionalProperties: false
      required: [id, organization_id, name, slug, status, version]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
        status: { type: string, enum: [active, archived] }
        version: { type: integer, minimum: 1 }
    TeamSummary:
      type: object
      additionalProperties: false
      required: [id, organization_id, name, status, version]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 120 }
        status: { type: string, enum: [active, archived] }
        version: { type: integer, minimum: 1 }
    TenancyContextSelection:
      type: object
      additionalProperties: false
      required: [organization_id, workspace_id]
      properties:
        organization_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
    SelectedTenancyContext:
      type: object
      additionalProperties: false
      required: [organization, workspace]
      properties:
        organization:
          type: object
          additionalProperties: false
          required: [id, name]
          properties: { id: { type: string, format: uuid }, name: { type: string } }
        workspace: { $ref: '#/components/schemas/WorkspaceSummary' }
    OrganizationMembershipListEnvelope:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/OrganizationMembershipSummary' } } } }]
    WorkspaceListEnvelope:
