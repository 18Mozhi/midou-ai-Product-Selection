          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/provider-adapters:
    get:
      summary: List platform Provider adapter registration, health, runtime error budget and observed page compatibility
      description: Requires provider:configure. Runtime error budget is the persisted consecutive runtime failure count against each Provider circuit_failure_threshold; recovery is eligible only when a real ready health check is newer than the open circuit. Compatibility rows aggregate retained DOM or HTML evidence by parser version and content SHA-256, capped at eight latest pairs per Provider. No credentials, cookies, raw payloads, URLs or organization data are returned.
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          {
            description: Adapter runtime catalog,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ProviderAdapterListEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/provider-adapters/{providerId}/health-check:
    post:
      summary: Run a bounded healthCheck through the registered Provider adapter
      description: Unregistered adapters fail closed as blocked/adapter_not_registered. A ready result newer than an open runtime circuit satisfies the existing recovery gate but does not itself close the circuit; recovery remains an explicit audited crawler-scheduler action. The endpoint never guesses a Provider request contract. When the optional project-scoped HTTP CONNECT proxy is configured, only the fixed news.google.com adapter request uses it; proxy configuration is never returned by this API.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          {
            description: Persisted correlated health result,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ProviderAdapterEnvelope" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/provider-sources:
    get:
      summary: List the code-owned 100+ hotspot and product-source channel catalog
      description: Requires provider:configure. Public RSS/Atom feeds and fixed public marketplace pages are automatically registered and enabled; authenticated-browser and manual channels stay disabled until their real login profile or explicit input is available. Each provisioned source may include a read-time concurrency snapshot containing only its configured limit and count of persisted pending/running subqueries. The UI combines that fact with the proposed interval to show same-interval source count; because no per-source phase is persisted, it explicitly treats this as a possible shared window rather than a certain collision. No official API key is required for built-in channels, and no arbitrary outbound URL, credential, raw replay input or fabricated platform data is returned.
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          {
            description: Built-in source catalog,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ProviderSourceCatalogEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/provider-sources/1688-acceptance:
    get:
      summary: Read 1688 login captcha and parser acceptance facts
      description: Requires provider:configure. Returns only the configured owner, source status, current login/captcha/parser gate results, evidence times, latest sanitized browser-run status and explicit pending reasons. A successful login-state run proves the current run was not captcha-blocked; credentials, cookies, profile identifiers, payloads and lease data are excluded.
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          description: Current 1688 acceptance facts
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, request_id, trace_id]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      [
                        provider_id,
                        source_status,
                        owner_label,
                        overall,
                        gates,
                        latest_run,
                        coverage_matrix,
                        pending_reasons,
                      ]
                    properties:
                      provider_id: { type: string, format: uuid }
                      source_status: { type: string, enum: [draft, disabled, enabled] }
                      owner_label: { type: string }
                      overall:
                        { type: string, enum: [setup_required, ready_for_enable, production_ready] }
                      gates:
                        type: array
                        minItems: 3
                        maxItems: 3
                        items:
                          type: object
                          additionalProperties: false
                          required: [key, state, evidence_at, reason]
                          properties:
                            key: { type: string, enum: [login, captcha, parser] }
                            state: { type: string, enum: [passed, blocked, pending] }
                            evidence_at: { type: string, format: date-time, nullable: true }
                            reason: { type: string }
                      latest_run:
                        type: object
                        nullable: true
                        additionalProperties: false
                        required: [status, error_code, started_at, finished_at]
                        properties:
                          status: { type: string }
                          error_code: { type: string, nullable: true }
                          started_at: { type: string, format: date-time }
                          finished_at: { type: string, format: date-time, nullable: true }
                      coverage_matrix:
                        type: object
                        additionalProperties: false
                        required: [parser_version, observed_at, rows]
                        properties:
                          parser_version: { type: string }
                          observed_at: { type: string, format: date-time, nullable: true }
                          rows:
                            type: array
                            minItems: 3
                            maxItems: 3
                            items:
                              type: object
                              additionalProperties: false
                              required: [key, contract, state, observed_count, reason]
                              properties:
                                key: { type: string, enum: [search, detail, pagination] }
                                contract: { type: string }
                                state:
                                  {
                                    type: string,
                                    enum: [covered, not_observed, not_exercised, invalid],
                                  }
                                observed_count: { type: integer, minimum: 0 }
                                reason: { type: string }
                      pending_reasons: { type: array, items: { type: string } }
                  request_id: { type: string }
                  trace_id: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/provider-sources/{providerId}/configuration:
    put:
      summary: Update an admitted source collection configuration
      description: Requires provider:configure, same-origin Origin and Idempotency-Key. Updates schedule, timeout, retry limit and enabled state with optimistic version control and a mandatory audited reason; startup catalog sync preserves these administrator-owned fields. A disabled public_page or public_rss source can be enabled only after its currently persisted timeout configuration has produced a ready real-page adapter health check. The UI stages changed settings as disabled, runs that smoke test, and submits a second version-locked enable request. Direct or rollback requests cannot bypass this gate.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [schedule_minutes, timeout_ms, retry_limit, status, expected_version, reason]
              properties:
                schedule_minutes: { type: integer, minimum: 1, maximum: 10080 }
                timeout_ms: { type: integer, minimum: 1000, maximum: 120000 }
                retry_limit: { type: integer, minimum: 0, maximum: 10 }
                status: { type: string, enum: [enabled, disabled] }
                expected_version: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 2, maxLength: 500 }
      responses:
        "200": { description: Updated source configuration }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Version, admission, compliance or current real-page smoke-test gate failed. A missing or stale public-source smoke test uses error code provider_source_smoke_test_required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/provider-sources/{providerId}/configuration/versions:
    get:
      summary: List safe source configuration versions and field differences
      description: Requires provider:configure. Returns only schedule, timeout, retry and status differences from immutable provider snapshots. Credentials, cookies, restricted environment values, raw snapshots, actor identifiers and correlation identifiers are not returned.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/provider-sources/{providerId}/configuration/rollbacks:
    post:
      summary: Restore a historical source configuration as a new version
      description: Requires provider:configure, same-origin Origin and Idempotency-Key. Restores only schedule, timeout, retry and status from an immutable older snapshot, rechecks current version, public-source terms and logged-in parser acceptance, then appends a new version and audit event without rewriting history.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_version, expected_version, reason]
              properties:
                target_version: { type: integer, minimum: 1 }
                expected_version: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 2, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/provider-sources/{providerId}/parser-samples:
    get:
      summary: List fixed parser samples and eligible real browser jobs
      description: Requires provider:configure. Candidates exist only for succeeded browser jobs that contain structured snapshots plus active screenshot and DOM evidence from one parser version.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      summary: Fix a real logged-in browser result as a parser sample
      description: Requires provider:configure, same-origin Origin and Idempotency-Key. The server derives snapshots and baseline output from the selected completed browser job; arbitrary client JSON cannot become a production sample.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [browser_job_id, name]
              properties:
                browser_job_id: { type: string, format: uuid }
                name: { type: string, minLength: 2, maxLength: 120 }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/provider-sources/{providerId}/parser-samples/{sampleId}/replays:
    post:
      summary: Replay one fixed sample and persist bounded field differences
      description: Requires collection:replay, same-origin Origin and Idempotency-Key. Enabling 1688 accepts only a sample whose latest replay passed on the current parser version and whose immutable baseline was approved by a different source administrator.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sampleId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/provider-sources/{providerId}/parser-samples/{sampleId}/reviews:
    post:
      summary: Approve or reject an immutable fixed parser sample
      description: Requires provider:configure, same-origin Origin and Idempotency-Key. The creator cannot review the same sample. Rejected samples remain visible and a correction must be created from a new eligible browser job.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sampleId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason, expected_version]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                reason: { type: string, minLength: 2, maxLength: 1000 }
                expected_version: { type: integer, minimum: 1 }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/provider-sources/{code}/provision:
    post:
      summary: Provision one fixed built-in source as disabled
      description: Requires provider:configure, same-origin Origin and Idempotency-Key. Provisioning never enables collection.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - {
            name: code,
            in: path,
            required: true,
            schema: { type: string, minLength: 2, maxLength: 80 },
          }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201":
          {
            description: Disabled provisioned Provider,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ProvisionedSourceEnvelope" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /provider-sources/refresh:
    post:
      summary: Manually request an immediate organization hotspot refresh
      description: Requires trend:read, an active organization/workspace context, same-origin Origin and Idempotency-Key. Schedules only currently enabled automatic public-feed channels; setup-required sources never fabricate results.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ProviderSourceRefreshInput" } },
          }
      responses:
        "202":
          {
            description: Immediate refresh scheduled,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ProviderSourceRefreshEnvelope" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/provider-sources/{providerId}/replays:
    post:
      summary: Schedule a bounded replay for an explicitly enabled built-in source
      description: Requires collection:replay, same-origin Origin and Idempotency-Key. Query and CSV are mutually exclusive; each task reads at most 20 records.
