      summary: Write a bounded Playwright result back to its business subquery job
      description: Correlates job, browser run, profile and lease token, stores at most 2 MB of structured result JSON, including hash-verified bounded screenshot and DOM-fragment artifacts with parser version when the source contract requests evidence, releases all crawler leases and creates a credential-renewal task for login expiry.
      security: [{ CrawlerServiceBearer: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /internal/crawler-runtime/{runId}/heartbeat:
    post:
      summary: Renew a live Python crawler lease
      security: [{ CrawlerServiceBearer: [] }]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
