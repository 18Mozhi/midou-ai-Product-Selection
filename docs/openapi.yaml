  /platform/data-quality/issues/batch:
    post:
      summary: Attribute, assign or close 1-50 versioned quality issues atomically
      description: Requires platform:operate, same-origin Origin and Idempotency-Key. Assignment accepts one active membership shared by every selected issue organization; any stale version fails the whole batch.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items, action, reason]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, expected_version]
                    properties:
                      id: { type: string, format: uuid }
                      expected_version: { type: integer, minimum: 1 }
                action: { type: string, enum: [attribute, assign, close] }
                reason: { type: string, minLength: 2, maxLength: 500 }
                assignee_membership_id: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          description: Updated quality issues in the same transaction
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/QualityIssue" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
