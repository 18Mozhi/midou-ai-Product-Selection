        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /org/{organizationId}/resource-grants/{grantId}/expiry:
    patch:
      summary: Extend an active resource grant with optimistic version locking
      description: Requires role:manage. Expired or revoked grants cannot be reactivated; create a new grant instead.
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/OrganizationId" },
          { $ref: "#/components/parameters/GrantId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/ExtendResourceGrantRequest" },
                },
            },
        }
      responses:
        "200":
          {
            description: Extended and audited resource grant,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/ResourceGrantEnvelope" },
                  },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /org/{organizationId}/resource-grants/{grantId}/revoke:
    post:
      summary: Revoke an active resource grant with optimistic version locking
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/OrganizationId" },
          { $ref: "#/components/parameters/GrantId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
