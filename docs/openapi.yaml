openapi: 3.0.3
info:
  title: ScoutOps Internal API
  version: 0.1.0
  description: P00 foundation, P01 identity/tenancy/RBAC, and P02 scoped UI preference contracts. Organization-visible endpoints require server-side authorization.
servers:
  - url: /api/v1
x-scoutops-verification:
  runtimeApiExposed: false
  reason: Software completion commands execute only in local, CI, or Baota-controlled tasks and do not require disk, capacity-load, PVE, or production-resource evidence.
  completionProfile: software
  operationalEvidenceRequired: false
  statePersistence: verification/state.json
  commands:
    module: npm run verify:module -- M00-01
    phase: npm run verify:phase -- P00
    all: npm run verify:all
    releaseMatrix: node scripts/verify-release-matrix.mjs --validate
    securityGate: npm run verify:security-gate
  releaseMatrixRuntimeApiExposed: false
  securityGateRuntimeApiExposed: false
x-scoutops-redis:
  runtimeApiExposed: true
  reason: M00-04 provides the backend-only scoped key contract; M08-02 adds a platform:operate protected and audited single-instance resilience view without exposing connection details or keys.
  keyScope: "scoutops:v1:<purpose>:org:<organization_id>:ws:<workspace_id>:..."
  purposes: [cache, queue, rate, sse]
  secretFields: [REDIS_PASSWORD]
x-scoutops-mysql:
  runtimeApiExposed: false
  reason: M00-03 provides a backend-only MySQL 5.7 contract; M00-05 owns readiness routing and authorization middleware.
  requiredVersion: "5.7"
  requiredCharset: utf8mb4
  requiredDatabaseAndAccount: product_scout
  baotaSingleHostResourceProfile:
    innodbBufferPoolSize: 4096M
    innodbBufferPoolInstances: 4
    innodbIoCapacity: 1000
    innodbIoCapacityMax: 4000
    innodbFlushNeighbors: 0
    innodbFlushMethod: O_DIRECT
x-scoutops-file-audit:
  runtimeApiExposed: false
  reason: M00-06 provides backend-only path, grant and audit contracts; authorized download routing is added with identity modules.
  pathScope: "organizations/<organization_id>/workspaces/<workspace_id>/..."
  downloadGrantMaximumSeconds: 300
  sensitiveMetadataKeys:
    [password, secret, token, cookie, authorization, api_key, private_key]
x-scoutops-baota-s0:
  productionDeployed: true
  deploymentStatus: healthy
  manifest: infra/baota/service-manifest.json
  targetHost: 192.168.1.220
  targetDomain: midouai.mozhiz.cn
  deployRoot: /www/wwwroot/ai选品
  backendProject: ai选品
  backendStartCommand: node apps/backend/dist/server.js
  backendProjectCount: 1
  productionEvidence: .artifacts/verification/baota-production-evidence.json
  livenessPath: /api/v1/health/live
  readinessPath: /api/v1/health/ready
  businessAvailabilityPath: /api/v1/health/available
  asyncRuntimeStatus: structured Worker heartbeat inside the unified BaoTa Node backend
  completionGate: build, startup, health, permissions and real browser functionality; excludes disk and capacity
x-scoutops-backup-recovery:
  module: M07-04
  productionManager: baota
  primaryRegion: 惠州
  recoveryRegion: 惠州
  topology: same-host-local-isolation
  mysqlRpoMinutes: 15
  mysqlRtoMinutes: 240
  mysqlBusinessConnection: product_scout-over-tcp
  mysqlAdminTransport: unix-socket
  encryption: aes-256-gcm
  recoveryVerifiedByDefault: false
  productionEvidence: .artifacts/verification/backup-recovery-production-evidence.json
x-scoutops-release-rollout:
  module: M07-05
  productionManager: baota
  topology: single-host-stable-and-candidate
  backupServerUsed: false
  percentages: [5, 25, 100]
  minimumObservationSeconds: 1800
  syntheticProbeIntervalSeconds: 1
  publicProbe:
    connectAddress: 127.0.0.1
    tlsSniHostPreserved: true
    manager: baota-nginx
    purpose: 避免公网回环波动，同时保留正式 HTTPS 与宝塔 Nginx 的真实发布采样
  taskTrigger: manual_only
  concurrencyProtection:
    concurrentRuns: 1
    lock: mysql_session_named_lock
    lockName: "scoutops:m07-05:release-rollout"
    lockTimeoutSeconds: 0
    attemptHistoryPreserved: true
  mysqlDurability:
    innodbFlushLogAtTrxCommit: 2
    syncBinlog: 1
    binlogFormat: ROW
    productScoutBinlogExcluded: false
    osCrashDataLossWindowSeconds: 1
    verificationAccount: product_scout@127.0.0.1 with global REPLICATION CLIENT
  samplingPolicy: 1 秒采样用于提高低流量 S0 的候选 P95 样本分辨率，不缩短观察时间或放宽停止阈值
  automaticStop: true
  productionEvidence: .artifacts/verification/release-rollout-production-evidence.json
x-scoutops-platform-seed:
  runtimeApiExposed: false
  command: node scripts/seed-platform-admin.mjs
  environment: [PLATFORM_ADMIN_SEED_EMAIL, PLATFORM_ADMIN_SEED_PASSWORD]
  lifecycle: inject in one Baota-controlled release task, run once, then delete both variables
  restrictedSessionError: security_setup_required
x-scoutops-design-themes:
  module: M02-01
  identifiers: [deep-ocean, aurora-purple, cloud-white]
  default: deep-ocean
  rule: Themes only change color, shadow, background and chart semantic colors; they never change authorization, data scope, feature visibility or business conclusions.
paths:
  /health/live:
    get:
      summary: Process liveness
      security: []
      responses:
        "200":
          description: Process is alive; this check does not read MySQL, Redis or providers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthLiveEnvelope" }
  /health/ready:
    get:
      summary: API readiness
      security: []
      responses:
        "200":
          description: Required configuration, MySQL and Redis can serve synchronous traffic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReadyEnvelope" }
        "503":
          description: Sanitized dependency unavailable envelope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /health/available:
    get:
      summary: Business processing availability
      description: Separates process liveness and synchronous dependency readiness from the ability of the supervised Worker scheduler to accept and process background business tasks.
      security: []
      responses:
        "200":
          description: Business processing is available or degraded with explicit service categories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthBusinessEnvelope" }
        "503":
          description: Runtime topology or the Worker scheduler heartbeat is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthBusinessEnvelope" }
  /health/version:
    get:
      summary: Sanitized build and configuration identity
      security: []
      responses:
        "200":
          description: Version data without configuration values or secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthVersionEnvelope" }
  /health/nodes:
    get:
      summary: Sanitized single-server API health
      description: M08-01 fails closed unless the configured API node has a fresh ready heartbeat on the configured current Baota host. It does not expose host identity and does not assert load balancing, high availability or capacity.
      security: []
      responses:
        "200":
          description: M08-01 single-server runtime gate is ready
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/RuntimeNodesHealthEnvelope" }
        "503":
          description: The configured single-server API is empty, blocked or stale; sanitized counters are returned for operations probing
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/RuntimeNodesHealthEnvelope" }
  /platform/operations/topology:
    get:
      summary: Read audited single-server runtime facts
      description: Read-only platform operations surface for the current BaoTa host. It explicitly reports that load balancing, backup servers and multi-node claims are disabled; credentials and private endpoints are never returned.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: platform:operate
      responses:
        "200":
          description: Current M08-01 single-server facts; state may be empty, blocked, stale or ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeTopologyEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/operations/redis:
    get:
      summary: Read audited Redis single-instance resilience facts
      description: M08-02 reports sanitized AOF/RDB, memory, connection and fail-closed findings for the current BaoTa Redis. It never returns host, port, password, keys or queue payloads and makes no Sentinel, cluster, replica or capacity claim.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: platform:operate
      responses:
        "200":
          description: Current Redis resilience state is ready, warning or blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedisResilienceEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/operations/mysql:
    get:
      summary: Read audited MySQL 5.7 single-primary resilience facts
      description: M08-03 reports sanitized durability, connection, storage, I/O, slow-query and recovery facts for the current BaoTa MySQL 5.7 single primary. It never returns host, port, account, password, data path, binlog filename or SQL text and makes no replica, load-balancing, backup-server or capacity claim.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: platform:operate
      responses:
        "200":
          description: Current MySQL single-primary resilience state is ready, warning or blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MySqlResilienceEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/operations/files:
    get:
      summary: Read audited local managed file resilience facts
      description: M08-04 reports sanitized evidence/export directory availability, capacity, checksum sampling and same-host encrypted recovery facts for the current BaoTa host. It never returns paths, filenames, hashes, organization identifiers or file content and makes no shared-storage, backup-server or capacity claim.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: platform:operate
      responses:
        "200":
          description: Current local file resilience state is ready, warning or blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileResilienceEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/operations/crawler-scheduler:
    get:
      summary: Read audited S0 single-host Crawler scheduler facts
      description: M08-05 reports separately observed process counts for the supervised Node Worker and the BaoTa-managed Python Crawler, plus global and provider lease aggregates, provider-level due queue counts and longest waits, browser-profile exclusivity and host resource watermarks. Queue facts count distinct provider tasks only after available_at is due, so future retry or rate-limit backoff is not reported as current waiting. It never returns scope identifiers, task payloads, lease tokens or hashes, credentials, cookies or paths and makes no load-balancing, backup-server, multi-node or capacity claim.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: platform:operate
      responses:
        "200":
          {
            description: Current single-host scheduler state is ready,
            warning or blocked,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/CrawlerSchedulerEnvelope" },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/operations/crawler-scheduler/recover-expired:
    post:
      summary: Idempotently recover only expired single-host scheduler slots
      description: M08-05 deletes only scheduler leases whose expires_at is not later than server time, records a platform audit event and never terminates a valid collection or browser run.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: platform:operate
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          {
            description: Expired slots recovered or an earlier idempotent result replayed,
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /platform/operations/capacity:
    get:
      summary: Read audited S0 measured single-host capacity boundary
      description: M08-06 reports only the latest same-commit controlled measurement, fixed latency/error/lag/resource gates and existing archive/recovery verification for the current Huizhou BaoTa host. Measurement always attempts fixed 5-10-20 order and stops at the first failed gate; concurrency 5 must pass, and any limited claim names only the last passing stage while preserving the failed next stage. Planning 100 users and 5-20 concurrent users are not promises. The response never claims load balancing, a backup server, multi-node or 10,000-user capability.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: platform:operate
      responses:
        "200":
          {
            description: Current measured single-host capacity state is ready,
            warning or blocked,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/CapacityBoundaryEnvelope" },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/operations/capacity/drills:
    post:
      summary: Idempotently attest an already verified archive and isolated recovery drill
      description: M08-06 records an archive_recovery attestation only when the latest measured observation already contains verified archive and recovery facts. It creates no service, backup server or new topology.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: platform:operate
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, reason]
              properties:
                kind: { type: string, enum: [archive_recovery] }
                reason: { type: string, minLength: 2, maxLength: 500 }
      responses:
        "200":
          {
            description: Verified drill attested or an earlier idempotent result replayed,
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/register:
    post:
      summary: Register a local email account and queue verification delivery
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/LocalAccountRegistration" },
              },
          }
      responses:
        "201":
          {
            description: Pending-verification account without action or session token,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/LocalAccountEnvelope" },
                  },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/email-verification/confirm:
    post:
      summary: Consume a single-use email verification token
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ActionTokenConfirm" } },
            },
        }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      summary: Authenticate a verified local account and set an opaque HttpOnly session cookie
      security: []
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/LocalLoginRequest" } },
            },
        }
      responses:
        "200":
          description: Authenticated for the configured 30-day session lifetime; raw session token exists only in Set-Cookie
          headers:
            {
              Set-Cookie:
                {
                  schema: { type: string },
                  description: "__Host-scoutops_session with Secure, HttpOnly, SameSite=Strict, Path=/ and Max-Age=2592000",
                },
            }
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/LoginEnvelope" } },
            }
        "202":
          description: Password accepted; TOTP or one-time recovery code is still required
          headers:
            {
              Set-Cookie:
                {
                  schema: { type: string },
                  description: "__Host-scoutops_mfa_challenge; Secure; HttpOnly; SameSite=Strict; short lived",
                },
            }
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/MfaChallengeEnvelope" },
                },
            }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
  /auth/mfa/totp/verify:
    post:
      summary: Complete a short-lived MFA login challenge and create a session
      security: [{ HttpOnlyMfaChallenge: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MfaCodeRequest" } },
            },
        }
      responses:
        "200":
          description: Challenge consumed once; challenge cookie cleared and session cookie set
          headers:
            {
              Set-Cookie:
                {
                  schema: { type: array, items: { type: string } },
                  description: "30-day session cookie with Max-Age=2592000 plus expired MFA challenge cookie",
                },
            }
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/LoginEnvelope" } },
            }
        "401": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: Revoke the current local session and clear browser state
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "204": { description: Session revoked and cookie cleared }
        "401": { $ref: "#/components/responses/Error" }
  /auth/password-reset/request:
    post:
      summary: Queue a password reset if the account exists; response is enumeration-safe
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/PasswordResetRequest" },
                },
            },
        }
      responses:
        "202":
          {
            description: Always accepted for a syntactically valid email,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/AcceptedEnvelope" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/password-reset/confirm:
    post:
      summary: Consume a single-use reset token, change password and revoke sessions
      security: []
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/PasswordResetConfirm" },
                },
            },
        }
      responses:
        "204": { description: Password changed; all sessions revoked }
        "400": { $ref: "#/components/responses/Error" }
  /me/password:
    post:
      summary: Change own password after current-password verification and revoke all sessions
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/PasswordChangeRequest" },
                },
            },
        }
      responses:
        "204": { description: Password changed and session cookie cleared }
        "401": { $ref: "#/components/responses/Error" }
  /me/security-setup:
    get:
      summary: Read the authenticated seed administrator's forced security setup state
      description: A restricted seed session may call only password, MFA, security-setup and logout endpoints until both steps complete.
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          {
            description: Security setup posture without secrets,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/SecuritySetupEnvelope" },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
  /me/sessions:
    get:
      summary: List only the authenticated user's device sessions
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          {
            description: Own sessions without token hashes,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/SessionListEnvelope" },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
  /me/mfa:
    get:
      summary: Read the authenticated user's MFA status and non-enabled enterprise identity capabilities
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          {
            description: Own MFA status without encrypted secret or recovery hashes,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/MfaStatusEnvelope" },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
  /me/mfa/totp/enrollment:
    post:
      summary: Reauthenticate and create a pending encrypted TOTP factor
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/MfaEnrollmentRequest" },
                },
            },
        }
      responses:
        "201":
          {
            description: Secret is displayed only for this enrollment response and must never be logged,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/MfaEnrollmentEnvelope" },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /me/mfa/totp/confirm:
    post:
      summary: Verify the pending factor and return one-time recovery codes once
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MfaCodeRequest" } },
            },
        }
      responses:
        "200":
          {
            description: TOTP enabled and recovery codes shown once,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        $ref: "#/components/schemas/MfaEnrollmentConfirmEnvelope",
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /me/mfa/totp:
    delete:
      summary: Reauthenticate with password and current second factor, disable TOTP and revoke every session
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MfaDisableRequest" } },
            },
        }
      responses:
        "204":
          {
            description: TOTP disabled; all sessions and browser cookie revoked,
          }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /me/sessions/{sessionId}:
    delete:
      summary: Revoke one session owned by the authenticated user
      security: [{ HttpOnlySession: [] }]
      parameters:
        - {
            name: sessionId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "204": { description: Owned session revoked }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /org/memberships:
    get:
      summary: List organizations where the authenticated user has an active membership
