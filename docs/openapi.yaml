      responses:
        "201":
          {
            description: User created and audited,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /platform/accounts/users/{userId}:
    get:
      summary: Read user profile, organization memberships and session metadata
      description: Never returns password hashes, tokens, IP hashes or user-agent hashes.
      security: [{ HttpOnlySession: [] }]
