        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /platform/accounts/users/{userId}/platform-role:
    post:
      summary: Grant or revoke a fixed platform administrator role
      description: Requires platform:superadmin. Self-revocation of platform_super_admin is rejected; all changes require a reason and are audited.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - {
            name: userId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/PlatformRoleChangeInput" },
                },
            },
        }
      responses:
        "200":
          {
            description: Platform role changed and audited,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SuccessEnvelope" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /platform/accounts/users/{userId}/password:
    post:
      summary: Force-reset a local password and revoke all active sessions
      security: [{ HttpOnlySession: [] }]
      parameters:
        - {
            name: userId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/PlatformPasswordResetInput" },
                },
            },
        }
      responses:
        "200":
          {
            description: Password replaced with Argon2id hash,
            sessions revoked and operation audited,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SuccessEnvelope" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /platform/accounts/users/{userId}/sessions/revoke:
    post:
      summary: Revoke one or all active sessions for a user
      security: [{ HttpOnlySession: [] }]
      parameters:
        - {
            name: userId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/PlatformSessionRevokeInput" },
                },
            },
        }
      responses:
        "200":
          {
            description: Matching active sessions revoked and operation audited,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SuccessEnvelope" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
    HttpOnlySession:
      type: apiKey
      in: cookie
      name: __Host-scoutops_session
    HttpOnlyMfaChallenge:
      type: apiKey
      in: cookie
      name: __Host-scoutops_mfa_challenge
    OpenApiClient:
      type: http
      scheme: bearer
      bearerFormat: scoutops-api-client
    CrawlerServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: crawler-service-token
    ReleaseProbeHmac:
      type: apiKey
      in: header
      name: X-Release-Probe-Signature
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GrantId:
      name: grantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuditAction:
      { name: action, in: query, schema: { type: string, maxLength: 128 } }
    AuditOutcome:
      {
        name: outcome,
        in: query,
        schema: { type: string, enum: [succeeded, failed, blocked] },
      }
    AuditResourceType:
      {
        name: resource_type,
        in: query,
        schema: { type: string, maxLength: 64 },
      }
    AuditCursor:
      { name: cursor, in: query, schema: { type: string, format: uuid } }
    AuditLimit:
      {
        name: limit,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
      }
    AuditOccurredFrom:
      {
        name: occurred_from,
        in: query,
        schema: { type: string, format: date-time },
      }
    AuditOccurredTo:
      {
        name: occurred_to,
        in: query,
        schema: { type: string, format: date-time },
      }
  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SuccessEnvelope" }
    PaginatedSuccess:
      description: Paginated successful response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PaginatedEnvelope" }
    Error:
      description: Stable sanitized error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    RuntimeNodesHealthEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            [
              state,
              mode,
              active_api_instances,
              single_host,
              stale_node_count,
              observed_at,
            ]
          properties:
            state: { type: string, enum: [ready, empty, blocked, stale] }
            mode: { type: string, enum: [single_host] }
            active_api_instances: { type: integer, minimum: 0, maximum: 1 }
            single_host: { type: boolean, enum: [true] }
            stale_node_count: { type: integer, minimum: 0 }
            observed_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    RuntimeTopologyEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            [
              state,
              mode,
              active_api_instances,
              single_host,
              stale_node_count,
              nodes,
              processes,
              worker_scheduler,
              supervisor_pid,
              blockers,
              alerts,
              load_balancing_enabled,
              backup_server_used,
              multi_node_claim,
              capacity_claim,
              observed_at,
            ]
          properties:
            state: { type: string, enum: [ready, empty, blocked, stale] }
            mode: { type: string, enum: [single_host] }
            active_api_instances: { type: integer, minimum: 0, maximum: 1 }
            single_host: { type: boolean, enum: [true] }
            stale_node_count: { type: integer, minimum: 0 }
            nodes:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  [
                    node_id,
                    host_id,
                    role,
                    status,
                    region,
                    zone,
                    build_sha,
                    version,
                    last_heartbeat_at,
                  ]
                properties:
                  node_id: { type: string }
                  host_id: { type: string }
                  role: { type: string, enum: [api, worker, crawler] }
                  status:
                    {
                      type: string,
                      enum: [starting, ready, degraded, draining, stopped],
                    }
                  region: { type: string }
                  zone: { type: string }
                  build_sha: { type: string }
                  version: { type: string }
                  last_heartbeat_at: { type: string, format: date-time }
            processes:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [name, status, pid, restart_count, circuit_open_until]
                properties:
                  name: { type: string, enum: [api, worker] }
                  status: { type: string }
                  pid: { type: integer, nullable: true }
                  restart_count: { type: integer, minimum: 0 }
                  circuit_open_until: { type: string, format: date-time, nullable: true }
            worker_scheduler:
              nullable: true
              allOf: [{ $ref: "#/components/schemas/WorkerSchedulerSnapshot" }]
            supervisor_pid: { type: integer, nullable: true }
            blockers:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [code, actionHint]
                properties:
                  code: { type: string }
                  actionHint: { type: string }
            alerts:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [code, severity, actionHint]
                properties:
                  code: { type: string }
                  severity: { type: string, enum: [warning, critical] }
                  actionHint: { type: string }
            load_balancing_enabled: { type: boolean, enum: [false] }
            backup_server_used: { type: boolean, enum: [false] }
            multi_node_claim: { type: boolean, enum: [false] }
            capacity_claim: { type: string, enum: [unverified] }
            observed_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    RedisResilienceEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            [
              state,
              mode,
              persistence,
              memory,
              connections,
              evicted_keys,
              findings,
              single_instance,
              sentinel_enabled,
              cluster_enabled,
              capacity_claim,
              observed_at,
            ]
          properties:
            state: { type: string, enum: [ready, warning, blocked] }
            mode: { type: string, enum: [single_instance] }
            persistence:
              type: object
              additionalProperties: false
              required:
                [
                  aof_enabled,
                  rdb_enabled,
                  aof_last_write_status,
                  rdb_last_save_status,
                ]
              properties:
                aof_enabled: { type: boolean }
                rdb_enabled: { type: boolean }
                aof_last_write_status:
                  { type: string, enum: [ok, err, unknown] }
                rdb_last_save_status: { type: string, enum: [ok, err, unknown] }
            memory:
              type: object
              additionalProperties: false
              required: [used_bytes, max_bytes, usage_basis_points]
              properties:
                {
                  used_bytes: { type: integer, minimum: 0 },
                  max_bytes: { type: integer, minimum: 0 },
                  usage_basis_points:
                    { type: integer, minimum: 0, maximum: 10000 },
                }
            connections:
              type: object
              additionalProperties: false
              required: [connected, maximum, usage_basis_points, rejected]
              properties:
                {
                  connected: { type: integer, minimum: 0 },
                  maximum: { type: integer, minimum: 0 },
                  usage_basis_points:
                    { type: integer, minimum: 0, maximum: 10000 },
                  rejected: { type: integer, minimum: 0 },
                }
            evicted_keys: { type: integer, minimum: 0 }
            findings:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [code, severity, action_hint]
                properties:
                  {
                    code: { type: string },
                    severity: { type: string, enum: [warning, blocked] },
                    action_hint: { type: string },
                  }
            single_instance: { type: boolean, enum: [true] }
            sentinel_enabled: { type: boolean, enum: [false] }
            cluster_enabled: { type: boolean, enum: [false] }
            capacity_claim: { type: string, enum: [unverified] }
            observed_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    MySqlResilienceEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            [
              state,
              mode,
              durability,
              connections,
              storage,
              io,
              slow_queries,
              recovery,
              findings,
              single_primary,
              replica_enabled,
              backup_server_used,
              capacity_claim,
              observed_at,
            ]
          properties:
            state: { type: string, enum: [ready, warning, blocked] }
            mode: { type: string, enum: [single_primary] }
            durability:
              type: object
              additionalProperties: false
              required:
                [
                  log_bin_enabled,
                  binlog_format,
                  innodb_flush_log_at_trx_commit,
                  sync_binlog,
                ]
              properties:
                {
                  log_bin_enabled: { type: boolean },
                  binlog_format:
                    { type: string, enum: [ROW, MIXED, STATEMENT, unknown] },
                  innodb_flush_log_at_trx_commit: { type: integer },
                  sync_binlog: { type: integer },
                }
            connections:
              type: object
              additionalProperties: false
              required: [connected, running, maximum, usage_basis_points]
              properties:
                {
                  connected: { type: integer, minimum: 0 },
                  running: { type: integer, minimum: 0 },
                  maximum: { type: integer, minimum: 0 },
                  usage_basis_points:
                    { type: integer, minimum: 0, maximum: 10000 },
                }
            storage:
              type: object
              additionalProperties: false
              required: [used_bytes, total_bytes, usage_basis_points]
              properties:
                {
                  used_bytes: { type: integer, minimum: 0 },
                  total_bytes: { type: integer, minimum: 0 },
                  usage_basis_points:
                    { type: integer, minimum: 0, maximum: 10000 },
                }
            io:
              type: object
              additionalProperties: false
              required:
                [
                  buffer_pool_bytes,
                  buffer_pool_data_bytes,
                  buffer_pool_hit_rate_basis_points,
                  innodb_log_waits,
                  innodb_row_lock_waits,
                ]
              properties:
                {
                  buffer_pool_bytes: { type: integer, minimum: 0 },
                  buffer_pool_data_bytes: { type: integer, minimum: 0 },
                  buffer_pool_hit_rate_basis_points:
                    { type: integer, minimum: 0, maximum: 10000 },
                  innodb_log_waits: { type: integer, minimum: 0 },
                  innodb_row_lock_waits: { type: integer, minimum: 0 },
                }
            slow_queries:
              type: object
              additionalProperties: false
              required: [per_minute, long_query_time_seconds]
              properties:
                {
                  per_minute: { type: number, minimum: 0 },
                  long_query_time_seconds: { type: number, minimum: 0 },
                }
            recovery:
              type: object
              additionalProperties: false
              required:
                [status, actual_rpo_minutes, actual_rto_minutes, drill_age_days]
              properties:
                {
                  status:
                    { type: string, enum: [verified, stale, blocked, empty] },
                  actual_rpo_minutes: { type: [number, "null"] },
                  actual_rto_minutes: { type: [number, "null"] },
                  drill_age_days: { type: [number, "null"] },
                }
            findings:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [code, severity, action_hint]
                properties:
                  {
                    code: { type: string },
                    severity: { type: string, enum: [warning, blocked] },
                    action_hint: { type: string },
                  }
            single_primary: { type: boolean, enum: [true] }
            replica_enabled: { type: boolean, enum: [false] }
            backup_server_used: { type: boolean, enum: [false] }
            capacity_claim: { type: string, enum: [unverified] }
            observed_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    FileResilienceEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            [
              state,
              mode,
              directories,
              integrity,
              recovery,
              findings,
              organization_scoped,
              public_access_enabled,
              shared_storage_enabled,
              backup_server_used,
              capacity_claim,
              observed_at,
            ]
          properties:
            state: { type: string, enum: [ready, warning, blocked] }
            mode: { type: string, enum: [local_managed_directories] }
            directories:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: object
                additionalProperties: false
                required:
                  [
                    kind,
                    available,
                    writable,
                    used_bytes,
                    total_bytes,
                    usage_basis_points,
                    active_files,
                    indexed_bytes,
                  ]
                properties:
                  {
                    kind: { type: string, enum: [evidence, export] },
                    available: { type: boolean },
                    writable: { type: boolean },
                    used_bytes: { type: integer, minimum: 0 },
                    total_bytes: { type: integer, minimum: 0 },
                    usage_basis_points:
                      { type: integer, minimum: 0, maximum: 10000 },
                    active_files: { type: integer, minimum: 0 },
                    indexed_bytes: { type: integer, minimum: 0 },
                  }
            integrity:
              type: object
              additionalProperties: false
              required:
                [sampled_files, verified_files, mismatch_files, missing_files]
              properties:
                {
                  sampled_files: { type: integer, minimum: 0 },
                  verified_files: { type: integer, minimum: 0 },
                  mismatch_files: { type: integer, minimum: 0 },
                  missing_files: { type: integer, minimum: 0 },
                }
            recovery:
              type: object
              additionalProperties: false
              required:
                [
                  status,
                  encrypted_same_host_copy,
                  isolated_restore_verified,
                  drill_age_days,
                ]
              properties:
                {
                  status:
                    { type: string, enum: [verified, stale, blocked, empty] },
                  encrypted_same_host_copy: { type: boolean },
                  isolated_restore_verified: { type: boolean },
                  drill_age_days: { type: [number, "null"] },
                }
            findings:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [code, severity, action_hint]
                properties:
                  {
                    code: { type: string },
                    severity: { type: string, enum: [warning, blocked] },
                    action_hint: { type: string },
                  }
            organization_scoped: { type: boolean, enum: [true] }
            public_access_enabled: { type: boolean, enum: [false] }
            shared_storage_enabled: { type: boolean, enum: [false] }
            backup_server_used: { type: boolean, enum: [false] }
            capacity_claim: { type: string, enum: [unverified] }
            observed_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    CrawlerSchedulerEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            [
              state,
              topology,
              leases,
              active_leases,
              providers,
              profiles,
              resource,
              findings,
              observed_at,
              capacity_claim,
            ]
          properties:
            state: { type: string, enum: [ready, warning, blocked] }
            topology:
              type: object
              additionalProperties: false
              required:
                [
                  mode,
                  worker_instances,
                  crawler_instances,
                  maximum_workers,
                  maximum_crawlers,
                ]
              properties:
                {
                  mode: { type: string, enum: [single_host] },
                  worker_instances:
                    { type: integer, minimum: 0, description: Linux process count for the supervised Node Worker },
                  crawler_instances:
                    { type: integer, minimum: 0, description: Linux process count for the BaoTa-managed Python scoutops_crawler runtime },
                  maximum_workers: { type: integer, enum: [1] },
                  maximum_crawlers: { type: integer, enum: [1] },
                }
            leases:
              type: object
              additionalProperties: false
              required: [active_worker, active_crawler, duplicate_count]
              properties:
                {
                  active_worker: { type: integer, minimum: 0 },
                  active_crawler: { type: integer, minimum: 0 },
                  duplicate_count: { type: integer, minimum: 0 },
                }
            active_leases:
              type: array
              maxItems: 100
              description: Active scheduler slots linked to their logical process role and collection task; opaque identifiers are technical details only.
              items:
                type: object
                additionalProperties: false
                required:
                  [
                    slot_type,
                    provider_name,
                    task_id,
                    task_status,
                    run_id,
                    process_role,
                    process_ref,
                    heartbeat_at,
                    expires_at,
                  ]
                properties:
                  slot_type: { type: string, enum: [worker, crawler, provider] }
                  provider_name: { type: string, nullable: true }
                  task_id: { type: string, format: uuid, nullable: true }
                  task_status: { type: string, nullable: true }
                  run_id: { type: string, format: uuid, nullable: true }
                  process_role: { type: string, enum: [node_worker, python_crawler] }
                  process_ref: { type: string, maxLength: 160 }
                  heartbeat_at: { type: string, format: date-time }
                  expires_at: { type: string, format: date-time }
            providers:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  [
                    id,
                    code,
                    configured_concurrency,
                    effective_concurrency,
                    active_leases,
                    queued_tasks,
                    longest_queue_wait_seconds,
                  ]
                properties:
                  {
                    id: { type: string, format: uuid },
                    code: { type: string },
                    configured_concurrency: { type: integer, minimum: 1 },
                    effective_concurrency: { type: integer, enum: [1] },
                    active_leases: { type: integer, minimum: 0 },
                    queued_tasks: { type: integer, minimum: 0 },
                    longest_queue_wait_seconds:
                      { type: integer, minimum: 0 },
                  }
            profiles:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, active_leases]
                properties:
                  {
                    id: { type: string, format: uuid },
                    active_leases: { type: integer, minimum: 0, maximum: 1 },
                  }
            resource:
              type: object
              additionalProperties: false
              required:
                [
                  load_basis_points,
                  available_memory_mb,
                  free_disk_mb,
                  observed_at,
                ]
              properties:
                {
                  load_basis_points: { type: integer, minimum: 0 },
                  available_memory_mb: { type: integer, minimum: 0 },
                  free_disk_mb: { type: integer, minimum: 0 },
                  observed_at: { type: string, format: date-time },
                }
            findings:
              type: array
              items:
                {
                  type: object,
                  additionalProperties: false,
                  required: [code, severity, action_hint],
                  properties:
                    {
                      code: { type: string },
                      severity: { type: string, enum: [warning, blocked] },
                      action_hint: { type: string },
                    },
                }
            observed_at: { type: string, format: date-time }
            capacity_claim: { type: string, enum: [unverified] }
        request_id: { type: string }
        trace_id: { type: string }
    CapacityBoundaryEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            [
              state,
              boundary,
              performance,
              resource,
              resilience,
              degradation,
              findings,
              single_host,
              load_balancing_enabled,
              backup_server_used,
              multi_node_claim,
              observed_at,
            ]
          properties:
            state: { type: string, enum: [ready, warning, blocked] }
            boundary:
              type: object
              additionalProperties: false
              required:
                [
                  measured_concurrency,
                  planning_users,
                  planning_concurrency_min,
                  planning_concurrency_max,
                  capacity_claim,
                  stop_reason,
                  failed_next_concurrency,
                  failed_next_code,
                ]
              properties:
                measured_concurrency:
                  {
                    type: integer,
                    enum: [5, 10, 20],
                    description: Last continuously passing fixed stage only,
                  }
