          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /org/{organizationId}/resource-grants:
    get:
      summary: List organization resource grants
      description: Requires role:read, organization scope and the selected organization context.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrganizationId" }
        - { $ref: "#/components/parameters/Page" }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [active, revoked, expired] },
          }
      responses:
        "200":
          {
            description: Paginated organization grants,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        $ref: "#/components/schemas/ResourceGrantListEnvelope",
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
