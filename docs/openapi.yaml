          "400": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /open/v1/status:
    servers: [{ url: / }]
    get:
      summary: Open API status for the authenticated Client organization
      security: [{ OpenApiClient: [] }]
      parameters:
        - {
            name: X-ScoutOps-Timestamp,
            in: header,
            required: true,
            schema: { type: integer, format: int64 },
          }
        - {
            name: X-ScoutOps-Nonce,
            in: header,
            required: true,
            schema: { type: string, minLength: 16, maxLength: 128 },
          }
      responses:
        {
          "200": { description: Authenticated status with status:read scope },
          "401": { $ref: "#/components/responses/Error" },
          "403": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
          "429": { $ref: "#/components/responses/Error" },
        }
  /selection-journeys:
    post:
      summary: Start a member-scoped real selection journey
      description: POST /api/v1/selection-journeys selects the enabled and currently compliant google_news_search source server-side; an unapproved, incomplete or expired public-source review is rejected before any task, subquery, event or outbox row is written. Members never submit provider IDs, proxy settings or organization/workspace IDs. Repeated real inputs may reuse immutable evidence, but the server always records a tenant-scoped association to the newly accepted task. When only an unconsumed RSS wrapper changes, evidence.linked records content_changed plus existing_content_sha256 and observed_content_sha256; any canonical URL, parser, adapter, schema or normalized payload change still fails with an evidence dedupe conflict.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: task:create
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/SelectionJourneyCreateInput" } },
            },
        }
      responses:
        "202":
          {
            description: Real task accepted,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SelectionJourneyEnvelope" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /selection-journeys/{journeyId}:
    get:
      summary: Read resumable task progress, candidate results, decision and evidence state
      description: Up to 20 candidates are resolved through the current task's organization/workspace-scoped evidence associations, including safely deduplicated evidence captured by an earlier task.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: opportunity:read
      parameters:
        [{ name: journeyId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          {
            description: Scoped real selection journey,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SelectionJourneyEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /selection-journeys/{journeyId}/decisions:
    post:
      summary: Record the audited human decision after comparing candidate results
      description: selected_raw_evidence_id is required for adopt and must belong to the current journey; only adopt creates or reuses an opportunity from the selected candidate.
      security: [{ HttpOnlySession: [] }]
      x-required-capability: opportunity:decide
      parameters:
        - { name: journeyId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/SelectionJourneyDecisionInput" } },
            },
        }
      responses:
        "201":
          {
            description: Audited decision and optional evidence-linked opportunity,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SelectionJourneyEnvelope" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /platform/accounts:
    get:
      summary: Read novice-facing organization, user and platform-admin management data
      description: Requires platform:superadmin. Returns factual account metadata only and never returns password hashes, session tokens or credentials.
      security: [{ HttpOnlySession: [] }]
