      summary: Revoke one or all active sessions for a user
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/PlatformSessionRevokeInput" } },
            },
        }
      responses:
        "200":
          {
            description: Matching active sessions revoked and operation audited,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
    HttpOnlySession:
      type: apiKey
      in: cookie
      name: __Host-scoutops_session
    HttpOnlyMfaChallenge:
      type: apiKey
      in: cookie
      name: __Host-scoutops_mfa_challenge
    OpenApiClient:
      type: http
      scheme: bearer
      bearerFormat: scoutops-api-client
    CrawlerServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: crawler-service-token
    ReleaseProbeHmac:
      type: apiKey
      in: header
      name: X-Release-Probe-Signature
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GrantId:
      name: grantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuditAction: { name: action, in: query, schema: { type: string, maxLength: 128 } }
    AuditOutcome:
      { name: outcome, in: query, schema: { type: string, enum: [succeeded, failed, blocked] } }
    AuditResourceType: { name: resource_type, in: query, schema: { type: string, maxLength: 64 } }
    AuditRequestId: { name: request_id, in: query, schema: { type: string, maxLength: 128 } }
    AuditTraceId: { name: trace_id, in: query, schema: { type: string, maxLength: 128 } }
    AuditCursor: { name: cursor, in: query, schema: { type: string, format: uuid } }
    AuditLimit:
      { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    AuditOccurredFrom:
      { name: occurred_from, in: query, schema: { type: string, format: date-time } }
    AuditOccurredTo: { name: occurred_to, in: query, schema: { type: string, format: date-time } }
  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SuccessEnvelope" }
    PaginatedSuccess:
      description: Paginated successful response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PaginatedEnvelope" }
    Error:
      description: Stable sanitized error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    RuntimeNodesHealthEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [state, mode, active_api_instances, single_host, stale_node_count, observed_at]
          properties:
            state: { type: string, enum: [ready, empty, blocked, stale] }
            mode: { type: string, enum: [single_host] }
            active_api_instances: { type: integer, minimum: 0, maximum: 1 }
            single_host: { type: boolean, enum: [true] }
            stale_node_count: { type: integer, minimum: 0 }
            observed_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    RuntimeHealthProbeSnapshot:
      type: object
      additionalProperties: false
      required:
        [status, interval_ms, timeout_ms, window_minutes, retention_hours, endpoints, observed_at]
      properties:
        status: { type: string, enum: [ready, empty, unavailable] }
        interval_ms: { type: integer, minimum: 10000 }
        timeout_ms: { type: integer, minimum: 500 }
        window_minutes: { type: integer, minimum: 5 }
        retention_hours: { type: integer, minimum: 1 }
        endpoints:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required:
              [
                endpoint,
                sample_count,
                success_count,
                http_error_count,
                timeout_count,
                network_error_count,
                availability_basis_points,
                latency_p50_ms,
                latency_p95_ms,
                latency_p99_ms,
                latency_max_ms,
                last_status_code,
                last_outcome,
                last_observed_at,
              ]
            properties:
              endpoint: { type: string, enum: [live, ready, available] }
              sample_count: { type: integer, minimum: 0 }
              success_count: { type: integer, minimum: 0 }
              http_error_count: { type: integer, minimum: 0 }
              timeout_count: { type: integer, minimum: 0 }
              network_error_count: { type: integer, minimum: 0 }
              availability_basis_points: { type: integer, minimum: 0, maximum: 10000 }
              latency_p50_ms: { type: integer, minimum: 0, nullable: true }
              latency_p95_ms: { type: integer, minimum: 0, nullable: true }
              latency_p99_ms: { type: integer, minimum: 0, nullable: true }
              latency_max_ms: { type: integer, minimum: 0, nullable: true }
              last_status_code: { type: integer, minimum: 100, maximum: 599, nullable: true }
              last_outcome:
                type: string
                enum: [succeeded, http_error, timeout, network_error]
                nullable: true
              last_observed_at: { type: string, format: date-time, nullable: true }
        observed_at: { type: string, format: date-time }
    RuntimeTopologyEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            [
              state,
              mode,
              active_api_instances,
              single_host,
              stale_node_count,
              nodes,
              processes,
              restart_trend,
              health_probes,
              worker_scheduler,
              supervisor_pid,
              blockers,
              alerts,
              load_balancing_enabled,
              backup_server_used,
              multi_node_claim,
              capacity_claim,
              observed_at,
            ]
          properties:
            state: { type: string, enum: [ready, empty, blocked, stale] }
            mode: { type: string, enum: [single_host] }
            active_api_instances: { type: integer, minimum: 0, maximum: 1 }
            single_host: { type: boolean, enum: [true] }
            stale_node_count: { type: integer, minimum: 0 }
            nodes:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  [
                    node_id,
                    host_id,
                    role,
                    status,
                    region,
                    zone,
                    build_sha,
                    version,
                    last_heartbeat_at,
                  ]
                properties:
                  node_id: { type: string }
                  host_id: { type: string }
                  role: { type: string, enum: [api, worker, crawler] }
                  status: { type: string, enum: [starting, ready, degraded, draining, stopped] }
                  region: { type: string }
                  zone: { type: string }
                  build_sha: { type: string }
                  version: { type: string }
                  last_heartbeat_at: { type: string, format: date-time }
            processes:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  [name, status, pid, restart_count, ready_at, circuit_open_until, last_failure]
                properties:
                  name: { type: string, enum: [api, worker] }
                  status: { type: string }
                  pid: { type: integer, nullable: true }
                  restart_count: { type: integer, minimum: 0 }
                  ready_at: { type: string, format: date-time, nullable: true }
                  circuit_open_until: { type: string, format: date-time, nullable: true }
                  last_failure: { type: string, nullable: true }
            restart_trend:
              type: array
              maxItems: 602
              items:
                type: object
                additionalProperties: false
                required:
                  [process_name, status, restart_count, restart_delta, counter_reset, observed_at]
                properties:
                  process_name: { type: string, enum: [api, worker] }
                  status: { type: string }
                  restart_count: { type: integer, minimum: 0 }
                  restart_delta: { type: integer, minimum: 0 }
                  counter_reset: { type: boolean }
                  observed_at: { type: string, format: date-time }
            health_probes:
              nullable: true
              allOf: [{ $ref: "#/components/schemas/RuntimeHealthProbeSnapshot" }]
            worker_scheduler:
              nullable: true
              allOf: [{ $ref: "#/components/schemas/WorkerSchedulerSnapshot" }]
            supervisor_pid: { type: integer, nullable: true }
            blockers:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [code, actionHint]
                properties:
                  code: { type: string }
                  actionHint: { type: string }
            alerts:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  [
                    code,
                    severity,
                    actionHint,
                    root_cause_code,
                    queues,
                    business_objects,
                    occurred_at,
                  ]
                properties:
                  code: { type: string }
                  severity: { type: string, enum: [warning, critical] }
                  actionHint: { type: string }
                  root_cause_code: { type: string, nullable: true }
                  queues:
                    type: array
                    items: { type: string }
                  business_objects:
                    type: array
                    maxItems: 4
                    items: { $ref: "#/components/schemas/RuntimeBusinessObjectAssociation" }
                  occurred_at: { type: string, format: date-time, nullable: true }
            load_balancing_enabled: { type: boolean, enum: [false] }
            backup_server_used: { type: boolean, enum: [false] }
            multi_node_claim: { type: boolean, enum: [false] }
            capacity_claim: { type: string, enum: [unverified] }
            observed_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    RedisKeyspaceSample:
      type: object
      additionalProperties: false
      required:
        [
          status,
          basis,
          sample_limit,
          scanned_keys,
          measured_keys,
          ignored_keys,
          failed_measurements,
          total_sampled_bytes,
          truncated,
          access_frequency_available,
          unavailable_reason,
          hotspots,
        ]
      properties:
        status: { type: string, enum: [sampled, partial, empty, unavailable] }
        basis: { type: string, enum: [bounded_memory_usage] }
        sample_limit: { type: integer, enum: [128] }
        scanned_keys: { type: integer, minimum: 0, maximum: 128 }
        measured_keys: { type: integer, minimum: 0, maximum: 128 }
        ignored_keys: { type: integer, minimum: 0, maximum: 128 }
        failed_measurements: { type: integer, minimum: 0, maximum: 128 }
        total_sampled_bytes: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        access_frequency_available: { type: boolean, enum: [false] }
        unavailable_reason:
          type: string
          nullable: true
          enum: [command_unsupported, scan_failed]
        hotspots:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required: [purpose, resource, sampled_keys, sampled_bytes, sampled_share_basis_points]
            properties:
              purpose: { type: string, enum: [cache, queue, rate, sse] }
              resource: { type: string, enum: [collection_ready, collection_task, other] }
              sampled_keys: { type: integer, minimum: 1, maximum: 128 }
              sampled_bytes: { type: integer, minimum: 0 }
              sampled_share_basis_points: { type: integer, minimum: 0, maximum: 10000 }
    RedisResilienceEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            [
              state,
              mode,
              persistence,
              memory,
              connections,
              evicted_keys,
              max_memory_policy,
              uptime_seconds,
              keyspace_sample,
              findings,
              single_instance,
              sentinel_enabled,
              cluster_enabled,
              capacity_claim,
              observed_at,
            ]
          properties:
            state: { type: string, enum: [ready, warning, blocked] }
            mode: { type: string, enum: [single_instance] }
            persistence:
              type: object
              additionalProperties: false
              required: [aof_enabled, rdb_enabled, aof_last_write_status, rdb_last_save_status]
              properties:
                aof_enabled: { type: boolean }
                rdb_enabled: { type: boolean }
                aof_last_write_status: { type: string, enum: [ok, err, unknown] }
                rdb_last_save_status: { type: string, enum: [ok, err, unknown] }
            memory:
              type: object
              additionalProperties: false
              required: [used_bytes, max_bytes, usage_basis_points]
              properties:
                {
                  used_bytes: { type: integer, minimum: 0 },
                  max_bytes: { type: integer, minimum: 0 },
                  usage_basis_points: { type: integer, minimum: 0, maximum: 10000 },
                }
            connections:
              type: object
              additionalProperties: false
              required: [connected, maximum, usage_basis_points, rejected]
              properties:
                {
                  connected: { type: integer, minimum: 0 },
                  maximum: { type: integer, minimum: 0 },
                  usage_basis_points: { type: integer, minimum: 0, maximum: 10000 },
                  rejected: { type: integer, minimum: 0 },
                }
            evicted_keys: { type: integer, minimum: 0 }
            max_memory_policy: { type: string }
            uptime_seconds: { type: integer, minimum: 0 }
            keyspace_sample: { $ref: "#/components/schemas/RedisKeyspaceSample" }
            findings:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [code, severity, action_hint]
                properties:
                  {
                    code: { type: string },
                    severity: { type: string, enum: [warning, blocked] },
                    action_hint: { type: string },
                  }
            single_instance: { type: boolean, enum: [true] }
            sentinel_enabled: { type: boolean, enum: [false] }
            cluster_enabled: { type: boolean, enum: [false] }
            capacity_claim: { type: string, enum: [unverified] }
            observed_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    MySqlResilienceEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            [
              state,
              mode,
              durability,
              connections,
              storage,
              io,
              slow_queries,
              recovery,
              findings,
              single_primary,
              replica_enabled,
              backup_server_used,
              capacity_claim,
              observed_at,
            ]
          properties:
            state: { type: string, enum: [ready, warning, blocked] }
            mode: { type: string, enum: [single_primary] }
            durability:
              type: object
              additionalProperties: false
              required:
                [log_bin_enabled, binlog_format, innodb_flush_log_at_trx_commit, sync_binlog]
              properties:
                {
                  log_bin_enabled: { type: boolean },
                  binlog_format: { type: string, enum: [ROW, MIXED, STATEMENT, unknown] },
                  innodb_flush_log_at_trx_commit: { type: integer },
                  sync_binlog: { type: integer },
                }
            connections:
              type: object
              additionalProperties: false
              required: [connected, running, maximum, usage_basis_points]
              properties:
                {
                  connected: { type: integer, minimum: 0 },
                  running: { type: integer, minimum: 0 },
                  maximum: { type: integer, minimum: 0 },
                  usage_basis_points: { type: integer, minimum: 0, maximum: 10000 },
                }
            storage:
              type: object
              additionalProperties: false
              required: [used_bytes, total_bytes, usage_basis_points]
              properties:
                {
                  used_bytes: { type: integer, minimum: 0 },
                  total_bytes: { type: integer, minimum: 0 },
                  usage_basis_points: { type: integer, minimum: 0, maximum: 10000 },
                }
            io:
              type: object
              additionalProperties: false
              required:
                [
                  buffer_pool_bytes,
                  buffer_pool_data_bytes,
                  buffer_pool_hit_rate_basis_points,
                  innodb_log_waits,
                  innodb_row_lock_waits,
                ]
              properties:
                {
                  buffer_pool_bytes: { type: integer, minimum: 0 },
                  buffer_pool_data_bytes: { type: integer, minimum: 0 },
                  buffer_pool_hit_rate_basis_points: { type: integer, minimum: 0, maximum: 10000 },
                  innodb_log_waits: { type: integer, minimum: 0 },
                  innodb_row_lock_waits: { type: integer, minimum: 0 },
                }
            slow_queries:
              type: object
              additionalProperties: false
              required: [per_minute, long_query_time_seconds]
              properties:
                {
                  per_minute: { type: number, minimum: 0 },
                  long_query_time_seconds: { type: number, minimum: 0 },
                }
            recovery:
              type: object
              additionalProperties: false
              required: [status, actual_rpo_minutes, actual_rto_minutes, drill_age_days]
              properties:
                {
                  status: { type: string, enum: [verified, stale, blocked, empty] },
                  actual_rpo_minutes: { type: [number, "null"] },
                  actual_rto_minutes: { type: [number, "null"] },
                  drill_age_days: { type: [number, "null"] },
                }
            findings:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [code, severity, action_hint]
                properties:
                  {
                    code: { type: string },
                    severity: { type: string, enum: [warning, blocked] },
                    action_hint: { type: string },
                  }
            single_primary: { type: boolean, enum: [true] }
            replica_enabled: { type: boolean, enum: [false] }
            backup_server_used: { type: boolean, enum: [false] }
            capacity_claim: { type: string, enum: [unverified] }
            observed_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    FileResilienceEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            [
              state,
              mode,
              directories,
              integrity,
              recovery,
              findings,
              organization_scoped,
              public_access_enabled,
              shared_storage_enabled,
              backup_server_used,
              capacity_claim,
              observed_at,
            ]
          properties:
            state: { type: string, enum: [ready, warning, blocked] }
            mode: { type: string, enum: [local_managed_directories] }
            directories:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: object
                additionalProperties: false
                required:
                  [
                    kind,
                    available,
                    writable,
                    used_bytes,
                    total_bytes,
                    usage_basis_points,
                    active_files,
                    indexed_bytes,
                  ]
                properties:
                  {
                    kind: { type: string, enum: [evidence, export, temp] },
                    available: { type: boolean },
                    writable: { type: boolean },
                    used_bytes: { type: integer, minimum: 0 },
                    total_bytes: { type: integer, minimum: 0 },
                    usage_basis_points: { type: integer, minimum: 0, maximum: 10000 },
                    active_files: { type: integer, minimum: 0 },
                    indexed_bytes: { type: integer, minimum: 0 },
                  }
            integrity:
              type: object
              additionalProperties: false
              required: [sampled_files, verified_files, mismatch_files, missing_files]
              properties:
                {
                  sampled_files: { type: integer, minimum: 0 },
                  verified_files: { type: integer, minimum: 0 },
                  mismatch_files: { type: integer, minimum: 0 },
                  missing_files: { type: integer, minimum: 0 },
                }
            recovery:
              type: object
              additionalProperties: false
              required:
                [status, encrypted_same_host_copy, isolated_restore_verified, drill_age_days]
              properties:
                {
                  status: { type: string, enum: [verified, stale, blocked, empty] },
                  encrypted_same_host_copy: { type: boolean },
                  isolated_restore_verified: { type: boolean },
                  drill_age_days: { type: [number, "null"] },
                }
            findings:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [code, severity, action_hint]
                properties:
                  {
                    code: { type: string },
                    severity: { type: string, enum: [warning, blocked] },
                    action_hint: { type: string },
                  }
            organization_scoped: { type: boolean, enum: [true] }
            public_access_enabled: { type: boolean, enum: [false] }
            shared_storage_enabled: { type: boolean, enum: [false] }
            backup_server_used: { type: boolean, enum: [false] }
            capacity_claim: { type: string, enum: [unverified] }
            observed_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    CrawlerSchedulerEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            [
              state,
              topology,
              leases,
              expired_leases,
              active_leases,
              providers,
              profiles,
              trend,
              resource,
              receipt_spool,
              findings,
              observed_at,
              capacity_claim,
            ]
          properties:
            state: { type: string, enum: [ready, warning, blocked] }
            topology:
              type: object
              additionalProperties: false
              required:
                [mode, worker_instances, crawler_instances, maximum_workers, maximum_crawlers]
              properties:
                {
                  mode: { type: string, enum: [single_host] },
                  worker_instances:
                    {
                      type: integer,
                      minimum: 0,
                      description: Linux process count for the supervised Node Worker,
                    },
                  crawler_instances:
                    {
                      type: integer,
                      minimum: 0,
                      description: Linux process count for the BaoTa-managed Python scoutops_crawler runtime,
                    },
                  maximum_workers: { type: integer, enum: [1] },
                  maximum_crawlers: { type: integer, enum: [1] },
                }
            leases:
              type: object
              additionalProperties: false
              required: [active_worker, active_crawler, duplicate_count]
              properties:
                {
                  active_worker: { type: integer, minimum: 0 },
                  active_crawler: { type: integer, minimum: 0 },
                  duplicate_count: { type: integer, minimum: 0 },
                }
            expired_leases:
              type: object
              additionalProperties: false
              description: Read-time impact preview only; recovery independently rechecks expiry against its current server clock.
              required: [total, task_count, worker, crawler, provider, oldest_expired_at]
              properties:
                total: { type: integer, minimum: 0 }
                task_count: { type: integer, minimum: 0 }
                worker: { type: integer, minimum: 0 }
                crawler: { type: integer, minimum: 0 }
                provider: { type: integer, minimum: 0 }
                oldest_expired_at: { type: string, format: date-time, nullable: true }
            active_leases:
              type: array
              maxItems: 100
              description: Active scheduler slots linked to their logical process role and collection task; opaque identifiers are technical details only.
              items:
                type: object
                additionalProperties: false
                required:
                  [
                    slot_type,
                    provider_name,
                    task_id,
                    task_status,
                    run_id,
                    process_role,
                    process_ref,
                    heartbeat_at,
                    expires_at,
                  ]
                properties:
                  slot_type: { type: string, enum: [worker, crawler, provider] }
                  provider_name: { type: string, nullable: true }
                  task_id: { type: string, format: uuid, nullable: true }
                  task_status: { type: string, nullable: true }
                  run_id: { type: string, format: uuid, nullable: true }
                  process_role: { type: string, enum: [node_worker, python_crawler] }
                  process_ref: { type: string, maxLength: 160 }
                  heartbeat_at: { type: string, format: date-time }
                  expires_at: { type: string, format: date-time }
            providers:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  [
                    id,
                    code,
                    configured_concurrency,
                    effective_concurrency,
                    active_leases,
                    queued_tasks,
                    longest_queue_wait_seconds,
                    queue_wait_p50_seconds,
                    queue_wait_p95_seconds,
                    sample_count_24h,
                    success_rate_basis_points_24h,
                    duration_p95_ms_24h,
                    circuit_state,
                    circuit_failure_threshold,
                    consecutive_failures,
                    last_error_code,
                  ]
                properties:
                  {
                    id: { type: string, format: uuid },
                    code: { type: string },
                    configured_concurrency: { type: integer, minimum: 1 },
                    effective_concurrency: { type: integer, enum: [1] },
                    active_leases: { type: integer, minimum: 0 },
                    queued_tasks: { type: integer, minimum: 0 },
                    longest_queue_wait_seconds: { type: integer, minimum: 0 },
                    queue_wait_p50_seconds: { type: integer, minimum: 0 },
                    queue_wait_p95_seconds: { type: integer, minimum: 0 },
                    sample_count_24h: { type: integer, minimum: 0 },
                    success_rate_basis_points_24h:
                      { type: integer, minimum: 0, maximum: 10000, nullable: true },
                    duration_p95_ms_24h: { type: number, minimum: 0, nullable: true },
                    circuit_state: { type: string, enum: [closed, open] },
                    circuit_failure_threshold: { type: integer, minimum: 1 },
                    consecutive_failures: { type: integer, minimum: 0 },
                    last_error_code: { type: string, nullable: true },
                  }
            profiles:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, active_leases]
                properties:
                  {
                    id: { type: string, format: uuid },
                    active_leases: { type: integer, minimum: 0, maximum: 1 },
                  }
            trend:
              type: array
              maxItems: 24
              items:
                type: object
                additionalProperties: false
                required: [bucket_at, total, succeeded, failed, failure_rate_basis_points]
                properties:
                  bucket_at: { type: string, format: date-time }
                  total: { type: integer, minimum: 0 }
                  succeeded: { type: integer, minimum: 0 }
                  failed: { type: integer, minimum: 0 }
                  failure_rate_basis_points: { type: integer, minimum: 0, maximum: 10000 }
            resource:
              type: object
              additionalProperties: false
              required: [load_basis_points, available_memory_mb, free_disk_mb, observed_at]
              properties:
                {
                  load_basis_points: { type: integer, minimum: 0 },
                  available_memory_mb: { type: integer, minimum: 0 },
                  free_disk_mb: { type: integer, minimum: 0 },
                  observed_at: { type: string, format: date-time },
                }
            receipt_spool:
              type: object
              nullable: true
              additionalProperties: false
              required:
                [
                  pending_count,
                  pending_bytes,
                  quarantined_count,
                  quarantined_bytes,
                  oldest_pending_at,
                  retention_days,
                  max_bytes,
                  minimum_free_disk_mb,
                  free_disk_mb,
                  observed_at,
                ]
              properties:
                pending_count: { type: integer, minimum: 0 }
                pending_bytes: { type: integer, minimum: 0 }
                quarantined_count: { type: integer, minimum: 0 }
                quarantined_bytes: { type: integer, minimum: 0 }
                oldest_pending_at: { type: string, format: date-time, nullable: true }
                retention_days: { type: integer, minimum: 1, maximum: 3650 }
                max_bytes: { type: integer, minimum: 1048576 }
                minimum_free_disk_mb: { type: integer, minimum: 128 }
                free_disk_mb: { type: integer, minimum: 0 }
                observed_at: { type: string, format: date-time }
            findings:
              type: array
              items:
                {
                  type: object,
                  additionalProperties: false,
                  required: [code, severity, action_hint],
                  properties:
                    {
                      code: { type: string },
                      severity: { type: string, enum: [warning, blocked] },
                      action_hint: { type: string },
                    },
                }
            observed_at: { type: string, format: date-time }
            capacity_claim: { type: string, enum: [unverified] }
        request_id: { type: string }
        trace_id: { type: string }
    CapacityBoundaryEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            [
              state,
              boundary,
              performance,
              resource,
              resilience,
              degradation,
              findings,
              single_host,
              load_balancing_enabled,
              backup_server_used,
              multi_node_claim,
              observed_at,
            ]
          properties:
            state: { type: string, enum: [ready, warning, blocked] }
            boundary:
              type: object
              additionalProperties: false
              required:
                [
                  measured_concurrency,
                  planning_users,
                  planning_concurrency_min,
                  planning_concurrency_max,
                  capacity_claim,
                  stop_reason,
                  failed_next_concurrency,
                  failed_next_code,
                ]
              properties:
                measured_concurrency:
                  {
                    type: integer,
                    enum: [5, 10, 20],
                    description: Last continuously passing fixed stage only,
                  }
                planning_users: { type: integer, enum: [100] }
                planning_concurrency_min: { type: integer, enum: [5] }
                planning_concurrency_max: { type: integer, enum: [20] }
                capacity_claim: { type: string, enum: [unverified, measured_single_host_limited] }
                stop_reason:
                  {
                    type: string,
                    nullable: true,
                    enum: [next_stage_gate_failed, planning_ceiling_reached],
                  }
                failed_next_concurrency: { type: integer, nullable: true, enum: [10, 20] }
                failed_next_code:
                  {
                    type: string,
                    nullable: true,
                    description: Sanitized fixed-gate failure code for the attempted next stage,
                  }
            performance:
              type: object
              additionalProperties: false
              required: [read_p95_ms, write_p95_ms, error_rate_basis_points, async_lag_seconds]
              properties:
                {
                  read_p95_ms: { type: integer, minimum: 0 },
                  write_p95_ms: { type: integer, minimum: 0 },
                  error_rate_basis_points: { type: integer, minimum: 0 },
                  async_lag_seconds: { type: integer, minimum: 0 },
                }
            resource:
              type: object
              additionalProperties: false
              required: [load_basis_points, available_memory_mb, free_disk_mb]
              properties:
                {
                  load_basis_points: { type: integer, minimum: 0 },
                  available_memory_mb: { type: integer, minimum: 0 },
                  free_disk_mb: { type: integer, minimum: 0 },
                }
            resilience:
              type: object
              additionalProperties: false
              required: [archive_verified, recovery_verified]
              properties:
                { archive_verified: { type: boolean }, recovery_verified: { type: boolean } }
            degradation:
              type: object
              additionalProperties: false
              required: [mode, actions]
              properties:
                {
                  mode: { type: string, enum: [normal, shed_background, stop_new_work] },
                  actions: { type: array, items: { type: string } },
                }
            findings:
              type: array
              items:
                {
                  type: object,
                  additionalProperties: false,
                  required: [code, severity, reason, owner_role_code, owner_label, action_hint],
                  properties:
                    {
                      code: { type: string },
                      severity: { type: string, enum: [warning, blocked] },
                      reason: { type: string },
                      owner_role_code: { type: string, enum: [platform_operations_admin] },
                      owner_label: { type: string, enum: [平台运维管理员] },
                      action_hint: { type: string },
                    },
                }
            single_host: { type: boolean, enum: [true] }
            load_balancing_enabled: { type: boolean, enum: [false] }
            backup_server_used: { type: boolean, enum: [false] }
            multi_node_claim: { type: boolean, enum: [false] }
            observed_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    SelectionJourneyCreateInput:
      type: object
      additionalProperties: false
      required: [input_kind, input_value]
      properties:
        input_kind: { type: string, enum: [keyword, asin, product_url] }
        input_value: { type: string, minLength: 1, maxLength: 200 }
    SelectionJourneyDecisionInput:
      type: object
      additionalProperties: false
      required: [action, reason]
