    ScoreRuleEnvelope:
      type: object
      required: [data, request_id, trace_id]
      properties:
        {
          data: { $ref: "#/components/schemas/ScoreRule" },
          request_id: { type: string },
          trace_id: { type: string },
        }
    ScoreRuleListEnvelope:
      type: object
      required: [data, request_id, trace_id]
      properties:
        {
          data:
            { type: array, items: { $ref: "#/components/schemas/ScoreRule" } },
          request_id: { type: string },
          trace_id: { type: string },
        }
    FeeLine:
      type: object
      required: [type, mode, value, currency]
      properties:
        type:
          { type: string, enum: [platform_fee, payment_fee, tax, fulfillment] }
        mode: { type: string, enum: [percentage_of_sale, fixed_amount] }
        value: { type: number, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3, nullable: true }
    CostRuleCreateInput:
      type: object
      required:
        [market, platform, version_code, name, effective_from, fee_lines]
      properties:
        market: { type: string, minLength: 1, maxLength: 40 }
        platform: { type: string, minLength: 1, maxLength: 80 }
        version_code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 160 }
        effective_from: { type: string, format: date }
        fee_lines:
          {
            type: array,
            minItems: 4,
            maxItems: 4,
            items: { $ref: "#/components/schemas/FeeLine" },
          }
    CostRuleActionInput:
      type: object
      required: [action, reason, expected_revision]
      properties:
        action:
          { type: string, enum: [submit, approve, reject, publish, rollback] }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        expected_revision: { type: integer, minimum: 1 }
        approval_role:
          { type: string, enum: [selection_manager, organization_admin] }
        target_rule_id: { type: string, format: uuid }
    CostRule:
      allOf:
        - { $ref: "#/components/schemas/CostRuleCreateInput" }
        - type: object
          required: [id, status, revision, approvals, published_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            status:
              {
                type: string,
                enum:
                  [
                    draft,
                    pending_approval,
                    approved,
                    active,
                    retired,
                    rejected,
                    rolled_back,
                  ],
              }
            revision: { type: integer, minimum: 1 }
            approvals:
              {
                type: array,
                items:
                  {
                    type: string,
                    enum: [selection_manager, organization_admin],
                  },
              }
            published_at: { type: string, format: date-time, nullable: true }
            updated_at: { type: string, format: date-time }
    ExchangeRateInput:
      type: object
      required:
        [
          provider_id,
          base_currency,
          quote_currency,
          rate_value,
          quote_date,
          observed_at,
          source_ref_id,
          evidence_id,
        ]
      properties:
        provider_id: { type: string, format: uuid }
        base_currency: { type: string, minLength: 3, maxLength: 3 }
        quote_currency: { type: string, minLength: 3, maxLength: 3 }
        rate_value: { type: number, exclusiveMinimum: 0 }
        quote_date: { type: string, format: date }
        observed_at: { type: string, format: date-time }
        source_ref_id: { type: string, minLength: 1, maxLength: 255 }
        evidence_id: { type: string, format: uuid }
    OpportunityCostInput:
      type: object
      required:
        [
          platform,
          input_type,
          amount_value,
          currency,
          source_type,
          source_ref_id,
          evidence_id,
          observed_at,
          expected_version,
        ]
      properties:
        platform: { type: string, minLength: 1, maxLength: 80 }
        input_type:
          { type: string, enum: [sale_price, purchase_price, logistics] }
        amount_value: { type: number, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        source_type: { type: string, minLength: 1, maxLength: 80 }
        source_ref_id: { type: string, minLength: 1, maxLength: 255 }
        evidence_id: { type: string, format: uuid }
        observed_at: { type: string, format: date-time }
        expected_version: { type: integer, minimum: 1 }
    ProfitAnalysisEnvelope:
      type: object
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          required: [latest_run, current_inputs]
          properties:
            latest_run:
              { type: object, nullable: true, additionalProperties: true }
            current_inputs:
              {
                type: array,
                items: { type: object, additionalProperties: true },
              }
        request_id: { type: string }
        trace_id: { type: string }
    OpportunitySummary:
      type: object
      required:
        [
          id,
          name,
          market,
          source_type,
          lifecycle_status,
          recommendation_status,
          overall_score,
          trend_score,
          competition_score,
          profit_status,
          risk_level,
          confidence,
          evidence_count,
          source_count,
          competitor_count,
          supplier_candidate_count,
          coverage_status,
          blocking_reasons,
          decision_status,
          version,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        market: { type: string }
        category: { type: string, nullable: true }
        source_type: { type: string, enum: [manual, trend_topic] }
        source_ref_id: { type: string, format: uuid, nullable: true }
        owner_id: { type: string, format: uuid, nullable: true }
        lifecycle_status:
          {
            type: string,
            enum: [candidate, validating, ready, adopted, observing, rejected],
          }
        recommendation_status:
          {
            type: string,
            enum: [insufficient_data, recommend, observe, not_recommend],
          }
        overall_score:
          { type: number, minimum: 0, maximum: 100, nullable: true }
        trend_score: { type: number, minimum: 0, maximum: 100, nullable: true }
        competition_score:
          { type: number, minimum: 0, maximum: 100, nullable: true }
        profit_status: { type: string, enum: [insufficient_data, calculated] }
        risk_level: { type: string, enum: [unknown, low, medium, high] }
        confidence:
          {
            type: object,
            required: [status, score],
            properties:
              {
                status: { type: string, enum: [insufficient_data, measured] },
                score:
                  { type: number, minimum: 0, maximum: 100, nullable: true },
              },
          }
        evidence_count: { type: integer, minimum: 0 }
        source_count: { type: integer, minimum: 0 }
        coverage_status:
          { type: string, enum: [insufficient, partial, complete] }
        blocking_reasons:
          type: array
          items:
            {
              type: string,
              enum: [evidence_insufficient, recommendation_insufficient],
            }
        decision_status:
          { type: string, enum: [pending, adopted, observing, rejected] }
        version: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
    OpportunityEnvelope:
      type: object
      required: [data, request_id, trace_id]
      properties:
        {
          data: { $ref: "#/components/schemas/OpportunitySummary" },
          request_id: { type: string },
          trace_id: { type: string },
        }
    OpportunityPageEnvelope:
      type: object
      required: [data, meta, request_id, trace_id]
      properties:
        data:
          {
            type: array,
            items: { $ref: "#/components/schemas/OpportunitySummary" },
          }
        meta:
          {
            type: object,
            required: [page, page_size, total],
            properties:
              {
                page: { type: integer, minimum: 1 },
                page_size: { type: integer, minimum: 1, maximum: 100 },
                total: { type: integer, minimum: 0 },
              },
          }
        request_id: { type: string }
        trace_id: { type: string }
    OpportunityDetailEnvelope:
      type: object
      required: [data, request_id, trace_id]
      properties:
        data:
          allOf:
            - { $ref: "#/components/schemas/OpportunitySummary" }
            - type: object
              required:
                [
                  score_rule_version,
                  scored_at,
                  latest_score_run,
                  score_components,
                  evidence,
                  decisions,
                  section_status,
                ]
              properties:
                score_rule_version: { type: string, nullable: true }
                scored_at: { type: string, format: date-time, nullable: true }
                latest_score_run:
                  {
                    type: object,
                    nullable: true,
                    required:
                      [
                        id,
                        status,
                        coverage_percent,
                        confidence_score,
                        recommendation_status,
                        missing_fields,
                        scored_at,
                      ],
                    properties:
                      {
                        id: { type: string, format: uuid },
                        status:
                          {
                            type: string,
                            enum: [calculated, insufficient_data],
                          },
                        coverage_percent:
                          { type: number, minimum: 0, maximum: 100 },
                        confidence_score:
                          {
                            type: number,
                            minimum: 0,
                            maximum: 100,
                            nullable: true,
                          },
                        recommendation_status:
                          {
                            type: string,
                            enum:
                              [
                                insufficient_data,
                                recommend,
                                observe,
                                not_recommend,
                              ],
                          },
                        missing_fields:
                          { type: array, items: { type: string } },
                        scored_at: { type: string, format: date-time },
                      },
                  }
                score_components:
                  {
                    type: array,
                    items:
                      {
                        type: object,
                        required:
                          [
                            dimension_code,
                            weight_percent,
                            input_score,
                            weighted_score,
                            evidence_ids,
                            missing_fields,
                          ],
                        properties:
                          {
                            dimension_code: { type: string },
                            weight_percent: { type: number },
                            input_score: { type: number, nullable: true },
                            weighted_score: { type: number, nullable: true },
                            evidence_ids:
                              {
                                type: array,
                                items: { type: string, format: uuid },
                              },
                            missing_fields:
                              { type: array, items: { type: string } },
                          },
                      },
                  }
                evidence:
                  {
                    type: array,
                    items:
                      {
                        type: object,
                        required:
                          [
                            id,
                            title,
                            publisher,
                            canonical_url,
                            provider_id,
                            raw_evidence_id,
                            observed_at,
                          ],
                        properties:
                          {
                            id: { type: string, format: uuid },
                            title: { type: string },
                            publisher: { type: string },
                            canonical_url: { type: string, format: uri },
                            provider_id: { type: string, format: uuid },
                            raw_evidence_id: { type: string, format: uuid },
                            observed_at: { type: string, format: date-time },
                          },
                      },
                  }
                decisions:
                  {
                    type: array,
                    items:
                      {
                        type: object,
                        required:
                          [
                            id,
                            action,
                            reason,
                            actor_id,
                            created_at,
                            opportunity_version,
                          ],
                        properties:
                          {
                            id: { type: string, format: uuid },
                            action:
                              { type: string, enum: [adopt, observe, reject] },
                            reason: { type: string },
                            actor_id: { type: string, format: uuid },
                            created_at: { type: string, format: date-time },
                            opportunity_version: { type: integer, minimum: 2 },
                          },
                      },
                  }
                section_status:
                  {
                    type: object,
                    required: [market, competition, profit, risk, execution],
                    properties:
                      {
                        market:
                          { type: string, enum: [covered, insufficient_data] },
                        competition:
                          { type: string, enum: [covered, insufficient_data] },
                        profit:
                          {
                            type: string,
                            enum: [insufficient_data, calculated],
                          },
                        risk:
                          { type: string, enum: [covered, insufficient_data] },
                        execution: { type: string, enum: [not_available] },
                      },
                  }
    OrganizationAdminEnvelope:
      type: object
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          required:
            [
              organization,
              members,
              workspaces,
              teams,
              pending_approvals,
              active_tokens,
              recent_audit_events,
              observed_at,
            ]
          properties:
            organization: { type: object, additionalProperties: true }
            members:
              {
                type: object,
                required: [total, active],
                properties:
                  {
                    total: { type: integer, minimum: 0 },
                    active: { type: integer, minimum: 0 },
                  },
              }
            workspaces:
              {
                type: object,
                required: [total, active],
                properties:
                  {
                    total: { type: integer, minimum: 0 },
                    active: { type: integer, minimum: 0 },
                  },
              }
            teams:
              {
                type: object,
                required: [total, active],
                properties:
                  {
                    total: { type: integer, minimum: 0 },
                    active: { type: integer, minimum: 0 },
                  },
              }
            pending_approvals: { type: integer, minimum: 0 }
            active_tokens: { type: integer, minimum: 0 }
            recent_audit_events: { type: integer, minimum: 0 }
            observed_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
