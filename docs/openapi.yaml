        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /platform/accounts/users/{userId}/platform-role:
    post:
      summary: Grant or revoke a fixed platform administrator role
      description: Requires platform:superadmin. Self-revocation of platform_super_admin is rejected; all changes require a reason and are audited.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
