openapi: 3.0.3
info:
  title: ScoutOps Internal API
  version: 0.1.0
  description: P00 implementation contract. Non-public endpoints require organization-aware authorization.
servers:
  - url: /api/v1
x-scoutops-verification:
  runtimeApiExposed: false
  reason: Verification commands execute only in local, CI, or Baota-controlled release tasks.
  commands:
    module: npm run verify:module -- M00-01
    phase: npm run verify:phase -- P00
    all: npm run verify:all
x-scoutops-redis:
  runtimeApiExposed: false
  reason: M00-04 provides a backend-only scoped connection contract; M00-05 owns readiness routing and authorization middleware.
  keyScope: 'scoutops:v1:<purpose>:org:<organization_id>:ws:<workspace_id>:...'
  purposes: [cache, queue, rate, sse]
  secretFields: [REDIS_PASSWORD]
x-scoutops-mysql:
  runtimeApiExposed: false
  reason: M00-03 provides a backend-only MySQL 5.7 contract; M00-05 owns readiness routing and authorization middleware.
  requiredVersion: '5.7'
  requiredCharset: utf8mb4
  requiredDatabaseAndAccount: product_scout
x-scoutops-file-audit:
  runtimeApiExposed: false
  reason: M00-06 provides backend-only path, grant and audit contracts; authorized download routing is added with identity modules.
  pathScope: 'organizations/<organization_id>/workspaces/<workspace_id>/...'
  downloadGrantMaximumSeconds: 300
  sensitiveMetadataKeys: [password, secret, token, cookie, authorization, api_key, private_key]
x-scoutops-baota-s0:
  productionDeployed: false
  manifest: infra/baota/service-manifest.json
  livenessPath: /api/v1/health/live
  readinessPath: /api/v1/health/ready
  asyncRuntimeStatus: structured Worker and Crawler heartbeat logs in Baota
  capacityClaim: S0 single host only; no multi-node or 10000-user claim
paths:
  /health/live:
    get:
      summary: Process liveness
      security: []
      responses:
        '200':
          description: Process is alive; this check does not read MySQL, Redis or providers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthLiveEnvelope' }
  /health/ready:
    get:
      summary: API readiness
      security: []
      responses:
        '200':
          description: Required configuration, MySQL and Redis can serve synchronous traffic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReadyEnvelope' }
        '503':
          description: Sanitized dependency unavailable envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /health/version:
    get:
      summary: Sanitized build and configuration identity
      security: []
      responses:
        '200':
          description: Version data without configuration values or secrets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthVersionEnvelope' }
  /trends:
    get:
      summary: List trend topics
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
  /opportunities:
    get:
      summary: List opportunities
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
    post:
      summary: Create an opportunity candidate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /tasks:
    get:
      summary: List authorized tasks
      responses:
        '200':
          description: Authorized task list with collection coverage when applicable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListEnvelope' }
  /subscriptions:
    get:
      summary: List organization monitoring subscriptions
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
  /reviews/analysis:
    post:
      summary: Create an auditable review pain-point analysis run
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/Success' }
  /analysis/validate:
    post:
      summary: Validate uploaded business data with approved statistical methods
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/Success' }
  /reports:
    get:
      summary: List authorized generated reports and exports
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
  /realtime/events:
    get:
      summary: Organization-filtered SSE stream
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream: {}
  /platform/providers:
    get:
      summary: List providers for platform operators
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    PaginatedSuccess:
      description: Paginated successful response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaginatedEnvelope' }
  schemas:
    SuccessEnvelope:
      type: object
      required: [data, request_id, trace_id]
      properties:
        data: {}
        request_id: { type: string }
        trace_id: { type: string }
    ErrorEnvelope:
      type: object
      required: [error, request_id, trace_id]
      properties:
        error:
          type: object
          required: [code, message, action_hint]
          properties:
            code: { type: string }
            message: { type: string }
            action_hint: { type: string }
        request_id: { type: string }
        trace_id: { type: string }
    PaginatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            meta:
              type: object
              properties:
                page: { type: integer }
                page_size: { type: integer }
                total: { type: integer }
    TaskStatus:
      type: string
      enum: [draft, scheduled, queued, leased, running, parsing, validating, persisted, retry_scheduled, blocked_login, blocked_captcha, blocked_robots, rate_limited, succeeded, succeeded_empty, completed_with_warnings, failed_terminal, dead_letter, manually_replayed]
    CoverageStatus:
      type: string
      enum: [complete, partial, insufficient]
    TaskSummary:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        coverage_status: { $ref: '#/components/schemas/CoverageStatus' }
        successful_subquery_count: { type: integer, minimum: 0 }
        failed_subquery_count: { type: integer, minimum: 0 }
        blocked_subquery_count: { type: integer, minimum: 0 }
    TaskListEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TaskSummary' }
        request_id: { type: string }
        trace_id: { type: string }
        meta:
          type: object
          properties:
            page: { type: integer }
            page_size: { type: integer }
            total: { type: integer }
    HealthLiveData:
      type: object
      required: [status, service, version, build_sha]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, enum: [product-scout-api] }
        version: { type: string }
        build_sha: { type: string }
    HealthLiveEnvelope:
      type: object
      required: [data, meta, request_id, trace_id]
      properties:
        data: { $ref: '#/components/schemas/HealthLiveData' }
        meta:
          type: object
          required: [observed_at]
          properties:
            observed_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    HealthReadyEnvelope:
      type: object
      required: [data, meta, request_id, trace_id]
      properties:
        data:
          type: object
          required: [status, dependencies]
          properties:
            status: { type: string, enum: [ready] }
            dependencies:
              type: object
              required: [mysql, redis]
              properties:
                mysql: { type: string, enum: [available] }
                redis: { type: string, enum: [available] }
        meta:
          type: object
          properties:
            observed_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    VerificationRun:
      type: object
      required: [run_id, trace_id, scope, scope_id, status, started_at]
      properties:
        run_id: { type: string, format: uuid }
        trace_id: { type: string, format: uuid }
        scope: { type: string, enum: [module, phase, all] }
        scope_id: { type: string }
        status: { type: string, enum: [running, passed, failed, blocked] }
        failure_code: { type: string, nullable: true }
        report_path: { type: string, description: Baota-controlled local path; never a public URL }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    RedisDependencyStatus:
      type: object
      required: [status, latency_ms, checked_at, request_id, trace_id]
      properties:
        status: { type: string, enum: [available, unavailable] }
        latency_ms: { type: integer, minimum: 0 }
        checked_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    DatabaseDependencyStatus:
      type: object
      required: [status, latency_ms, migration_version, checked_at, request_id, trace_id]
      properties:
        status: { type: string, enum: [available, unavailable] }
        latency_ms: { type: integer, minimum: 0 }
        migration_version: { type: string }
        checked_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    FileAsset:
      type: object
      required: [id, organization_id, workspace_id, category, content_sha256, size_bytes, status]
      properties:
        id: { type: string }
        organization_id: { type: string }
        workspace_id: { type: string }
        category: { type: string, enum: [evidence, export, attachment] }
        content_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size_bytes: { type: integer, minimum: 0 }
        status: { type: string, enum: [active, quarantined, deleted] }
    AuditEvent:
      type: object
      required: [audit_id, organization_id, actor_id, action, resource_type, resource_id, request_id, trace_id, occurred_at, schema_version]
      properties:
        audit_id: { type: string }
        organization_id: { type: string }
        workspace_id: { type: string }
        actor_id: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        request_id: { type: string }
        trace_id: { type: string }
        occurred_at: { type: string, format: date-time }
        schema_version: { type: integer, enum: [1] }
    HealthVersionEnvelope:
      type: object
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          required: [version, build_sha, config_fingerprint]
          properties:
            version: { type: string }
            build_sha: { type: string }
            config_fingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
        request_id: { type: string }
        trace_id: { type: string }
