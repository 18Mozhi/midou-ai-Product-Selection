        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /platform/collection/tasks/{taskId}/replay:
    post:
      summary: Manually replay one dead-letter task while retaining all history
      description: Requires collection:replay, same-origin Origin, Idempotency-Key and a 2-500 character reason. Concurrent requests with the same actor, task route and Idempotency-Key return the same replay task after the task lock observes the committed operation; they do not create a second task or reject the duplicate as a state conflict. The operations console may compose at most 20 independently selected open dead letters as separate calls after an impact preview; every call remains independently authorized, idempotent and audited and retains its original task history.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties: { reason: { type: string, minLength: 2, maxLength: 500 } }
      responses:
        "200":
          {
            description: Newly scheduled replay task detail,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CollectionTaskDetailEnvelope" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
