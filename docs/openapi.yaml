      summary: Create a team with an optional same-organization lead and workflow key
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        {
          "201": { description: Audited team },
          "400": { $ref: "#/components/responses/Error" },
          "403": { $ref: "#/components/responses/Error" },
        }
  /org/admin/teams/{teamId}/members:
    post:
      summary: Assign or remove an active same-organization membership from a team
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          {
            name: teamId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      responses:
        {
          "200": { description: Audited team membership action },
          "403": { $ref: "#/components/responses/Error" },
          "404": { $ref: "#/components/responses/Error" },
        }
  /org/admin/approvals:
    get:
      summary: Read organization-wide approval facts
      description: Requires opportunity:approve; this endpoint does not bypass approval action permissions.
      security: [{ HttpOnlySession: [] }]
      responses:
        {
          "200": { description: Approval status summary and latest requests },
          "403": { $ref: "#/components/responses/Error" },
        }
  /org/admin/tokens:
    get:
      summary: List organization Token metadata without secret or hash
      security: [{ HttpOnlySession: [] }]
      responses:
        {
          "200":
            {
              description: Token prefix,
              read scopes,
              lifecycle and timestamps only,
            },
          "403": { $ref: "#/components/responses/Error" },
        }
    post:
      summary: Create an organization Token whose secret is returned once
      description: Requires organization_token:manage; only fixed read scopes are accepted and only SHA-256 hashes persist.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        {
          "201": { description: Token metadata plus one-time secret },
          "400": { $ref: "#/components/responses/Error" },
          "403": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
