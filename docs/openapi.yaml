        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /platform/accounts/users:
    post:
      summary: Create a local user or fixed platform administrator
      description: The temporary password is hashed with Argon2id and never returned. First login requires password change; platform administrators must also enroll MFA.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
