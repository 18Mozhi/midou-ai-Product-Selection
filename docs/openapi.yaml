openapi: 3.0.3
info:
  title: ScoutOps Internal API
  version: 0.1.0
  description: P00 foundation, P01 identity/tenancy/RBAC, and P02 scoped UI preference contracts. Organization-visible endpoints require server-side authorization.
servers:
  - url: /api/v1
x-scoutops-verification:
  runtimeApiExposed: false
  reason: Verification commands execute only in local, CI, or Baota-controlled release tasks.
  commands:
    module: npm run verify:module -- M00-01
    phase: npm run verify:phase -- P00
    all: npm run verify:all
x-scoutops-redis:
  runtimeApiExposed: false
  reason: M00-04 provides a backend-only scoped connection contract; M00-05 owns readiness routing and authorization middleware.
  keyScope: 'scoutops:v1:<purpose>:org:<organization_id>:ws:<workspace_id>:...'
  purposes: [cache, queue, rate, sse]
  secretFields: [REDIS_PASSWORD]
x-scoutops-mysql:
  runtimeApiExposed: false
  reason: M00-03 provides a backend-only MySQL 5.7 contract; M00-05 owns readiness routing and authorization middleware.
  requiredVersion: '5.7'
  requiredCharset: utf8mb4
  requiredDatabaseAndAccount: product_scout
x-scoutops-file-audit:
  runtimeApiExposed: false
  reason: M00-06 provides backend-only path, grant and audit contracts; authorized download routing is added with identity modules.
  pathScope: 'organizations/<organization_id>/workspaces/<workspace_id>/...'
  downloadGrantMaximumSeconds: 300
  sensitiveMetadataKeys: [password, secret, token, cookie, authorization, api_key, private_key]
x-scoutops-baota-s0:
  productionDeployed: false
  manifest: infra/baota/service-manifest.json
  livenessPath: /api/v1/health/live
  readinessPath: /api/v1/health/ready
  asyncRuntimeStatus: structured Worker and Crawler heartbeat logs in Baota
  capacityClaim: S0 single host only; no multi-node or 10000-user claim
x-scoutops-platform-seed:
  runtimeApiExposed: false
  command: node scripts/seed-platform-admin.mjs
  environment: [PLATFORM_ADMIN_SEED_EMAIL, PLATFORM_ADMIN_SEED_PASSWORD]
  lifecycle: inject in one Baota-controlled release task, run once, then delete both variables
  restrictedSessionError: security_setup_required
x-scoutops-design-themes:
  module: M02-01
  identifiers: [deep-ocean, aurora-purple, cloud-white]
  default: deep-ocean
  rule: Themes only change color, shadow, background and chart semantic colors; they never change authorization, data scope, feature visibility or business conclusions.
paths:
  /health/live:
    get:
      summary: Process liveness
      security: []
      responses:
        '200':
          description: Process is alive; this check does not read MySQL, Redis or providers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthLiveEnvelope' }
  /health/ready:
    get:
      summary: API readiness
      security: []
      responses:
        '200':
          description: Required configuration, MySQL and Redis can serve synchronous traffic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReadyEnvelope' }
        '503':
          description: Sanitized dependency unavailable envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /health/version:
    get:
      summary: Sanitized build and configuration identity
      security: []
      responses:
        '200':
          description: Version data without configuration values or secrets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthVersionEnvelope' }
  /auth/register:
    post:
      summary: Register a local email account and queue verification delivery
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LocalAccountRegistration' } } }
      responses:
        '201': { description: Pending-verification account without action or session token, content: { application/json: { schema: { $ref: '#/components/schemas/LocalAccountEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/email-verification/confirm:
    post:
      summary: Consume a single-use email verification token
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActionTokenConfirm' } } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      summary: Authenticate a verified local account and set an opaque HttpOnly session cookie
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocalLoginRequest' } } } }
      responses:
        '200':
          description: Authenticated; raw session token exists only in Set-Cookie
          headers: { Set-Cookie: { schema: { type: string }, description: '__Host-scoutops_session with Secure, HttpOnly, SameSite=Strict and Path=/' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LoginEnvelope' } } }
        '202':
          description: Password accepted; TOTP or one-time recovery code is still required
          headers: { Set-Cookie: { schema: { type: string }, description: '__Host-scoutops_mfa_challenge; Secure; HttpOnly; SameSite=Strict; short lived' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/MfaChallengeEnvelope' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /auth/mfa/totp/verify:
    post:
      summary: Complete a short-lived MFA login challenge and create a session
      security: [{ HttpOnlyMfaChallenge: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaCodeRequest' } } } }
      responses:
        '200':
          description: Challenge consumed once; challenge cookie cleared and session cookie set
          headers: { Set-Cookie: { schema: { type: array, items: { type: string } }, description: 'Session cookie plus expired MFA challenge cookie' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/LoginEnvelope' } } }
        '401': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      summary: Revoke the current local session and clear browser state
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Session revoked and cookie cleared }
        '401': { $ref: '#/components/responses/Error' }
  /auth/password-reset/request:
    post:
      summary: Queue a password reset if the account exists; response is enumeration-safe
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } } }
      responses:
        '202': { description: Always accepted for a syntactically valid email, content: { application/json: { schema: { $ref: '#/components/schemas/AcceptedEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/password-reset/confirm:
    post:
      summary: Consume a single-use reset token, change password and revoke sessions
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetConfirm' } } } }
      responses:
        '204': { description: Password changed; all sessions revoked }
        '400': { $ref: '#/components/responses/Error' }
  /me/password:
    post:
      summary: Change own password after current-password verification and revoke all sessions
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChangeRequest' } } } }
      responses:
        '204': { description: Password changed and session cookie cleared }
        '401': { $ref: '#/components/responses/Error' }
  /me/security-setup:
    get:
      summary: Read the authenticated seed administrator's forced security setup state
      description: A restricted seed session may call only password, MFA, security-setup and logout endpoints until both steps complete.
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Security setup posture without secrets, content: { application/json: { schema: { $ref: '#/components/schemas/SecuritySetupEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /me/sessions:
    get:
      summary: List only the authenticated user's device sessions
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Own sessions without token hashes, content: { application/json: { schema: { $ref: '#/components/schemas/SessionListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /me/mfa:
    get:
      summary: Read the authenticated user's MFA status and non-enabled enterprise identity capabilities
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Own MFA status without encrypted secret or recovery hashes, content: { application/json: { schema: { $ref: '#/components/schemas/MfaStatusEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /me/mfa/totp/enrollment:
    post:
      summary: Reauthenticate and create a pending encrypted TOTP factor
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaEnrollmentRequest' } } } }
      responses:
        '201': { description: Secret is displayed only for this enrollment response and must never be logged, content: { application/json: { schema: { $ref: '#/components/schemas/MfaEnrollmentEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /me/mfa/totp/confirm:
    post:
      summary: Verify the pending factor and return one-time recovery codes once
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaCodeRequest' } } } }
      responses:
        '200': { description: TOTP enabled and recovery codes shown once, content: { application/json: { schema: { $ref: '#/components/schemas/MfaEnrollmentConfirmEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /me/mfa/totp:
    delete:
      summary: Reauthenticate with password and current second factor, disable TOTP and revoke every session
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaDisableRequest' } } } }
      responses:
        '204': { description: TOTP disabled; all sessions and browser cookie revoked }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /me/sessions/{sessionId}:
    delete:
      summary: Revoke one session owned by the authenticated user
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Owned session revoked }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /org/memberships:
    get:
      summary: List organizations where the authenticated user has an active membership
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Membership-backed organization choices only, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationMembershipListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /org/{organizationId}/workspaces:
    get:
      summary: List workspaces in an organization after active-membership guard
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses:
        '200': { description: Organization-scoped workspace choices, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /org/{organizationId}/teams:
    get:
      summary: List organization-level teams after active-membership guard
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses:
        '200': { description: Organization-scoped team summaries without role or member details, content: { application/json: { schema: { $ref: '#/components/schemas/TeamListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/context:
    post:
      summary: Select an active organization and workspace for the current session
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TenancyContextSelection' } } } }
      responses:
        '200': { description: Audited session context selected idempotently, content: { application/json: { schema: { $ref: '#/components/schemas/SelectedTenancyContextEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /me/authorization:
    get:
      summary: Read the authenticated user's effective roles, capabilities and data scopes for the selected session context
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Server-computed effective authorization without internal assignment identifiers, content: { application/json: { schema: { $ref: '#/components/schemas/CurrentAuthorizationEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /me/navigation:
    get:
      summary: Guard and describe one authenticated navigation shell
      description: The server derives shell access from active organization membership or platform role and writes an authorization decision. Platform administrators do not require an organization context.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: shell, in: query, required: true, schema: { type: string, enum: [member, organization_admin, platform_admin] } }
      responses:
        '200': { description: Audited shell access and server-derived role context, content: { application/json: { schema: { $ref: '#/components/schemas/NavigationGuardEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /org/{organizationId}/roles:
    get:
      summary: List the fixed organization role and capability matrix
      description: Requires role:read, active membership, organization data scope and the same selected organization context.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses:
        '200': { description: Read-only organization role catalog, content: { application/json: { schema: { $ref: '#/components/schemas/RoleCapabilityListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /me/resource-grants:
    get:
      summary: List exact-resource grants for the authenticated membership in the selected organization
      security: [{ HttpOnlySession: [] }]
      responses:
        '200': { description: Current membership grants with derived active, expired or revoked status, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceGrantListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /org/{organizationId}/resource-grants:
    get:
      summary: List organization resource grants
      description: Requires role:read, organization scope and the selected organization context.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/Page' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { type: string, enum: [active, revoked, expired] } }
      responses:
        '200': { description: Paginated organization grants, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceGrantListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    post:
      summary: Grant minimal actions on one resource to an active membership in the same organization
      description: Requires role:manage. Evidence download, export, credential reference and replay actions are excluded. Expiry cannot exceed 30 days.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateResourceGrantRequest' } } } }
      responses:
        '201': { description: Audited resource grant, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceGrantEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /org/{organizationId}/resource-grant-targets:
    get:
      summary: List active same-organization memberships eligible for resource grants
      description: Requires membership:read and never returns members from another organization.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses:
        '200': { description: Eligible active members, content: { application/json: { schema: { $ref: '#/components/schemas/EligibleResourceGrantMemberListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /org/{organizationId}/resource-grants/{grantId}/expiry:
    patch:
      summary: Extend an active resource grant with optimistic version locking
      description: Requires role:manage. Expired or revoked grants cannot be reactivated; create a new grant instead.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/GrantId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExtendResourceGrantRequest' } } } }
      responses:
        '200': { description: Extended and audited resource grant, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceGrantEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /org/{organizationId}/resource-grants/{grantId}/revoke:
    post:
      summary: Revoke an active resource grant with optimistic version locking
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { $ref: '#/components/parameters/GrantId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RevokeResourceGrantRequest' } } } }
      responses:
        '200': { description: Revoked and audited resource grant, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceGrantEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /platform/audit-events:
    get:
      summary: Query platform-global security audit events
      description: Requires audit:read through a platform role. This surface is read-only and never returns seed passwords or credential material.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { $ref: '#/components/parameters/AuditAction' }
        - { $ref: '#/components/parameters/AuditOutcome' }
        - { $ref: '#/components/parameters/AuditResourceType' }
        - { $ref: '#/components/parameters/AuditCursor' }
        - { $ref: '#/components/parameters/AuditLimit' }
        - { $ref: '#/components/parameters/AuditOccurredFrom' }
        - { $ref: '#/components/parameters/AuditOccurredTo' }
      responses:
        '200': { description: Cursor-paginated platform audit page, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityAuditPageEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /organizations/{organizationId}/audit-events:
    get:
      summary: Query audit events restricted to one organization
      description: Requires audit:read plus a matching active organization scope; auditor remains read-only.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/AuditAction' }
        - { $ref: '#/components/parameters/AuditOutcome' }
        - { $ref: '#/components/parameters/AuditResourceType' }
        - { $ref: '#/components/parameters/AuditCursor' }
        - { $ref: '#/components/parameters/AuditLimit' }
        - { $ref: '#/components/parameters/AuditOccurredFrom' }
        - { $ref: '#/components/parameters/AuditOccurredTo' }
      responses:
        '200': { description: Cursor-paginated organization audit page, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityAuditPageEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /trends:
    get:
      summary: List trend topics
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
  /opportunities:
    get:
      summary: List opportunities
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
    post:
      summary: Create an opportunity candidate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /tasks:
    get:
      summary: List authorized tasks
      responses:
        '200':
          description: Authorized task list with collection coverage when applicable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListEnvelope' }
  /subscriptions:
    get:
      summary: List organization monitoring subscriptions
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
  /reviews/analysis:
    post:
      summary: Create an auditable review pain-point analysis run
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/Success' }
  /analysis/validate:
    post:
      summary: Validate uploaded business data with approved statistical methods
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/Success' }
  /reports:
    get:
      summary: List authorized generated reports and exports
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
  /realtime/events:
    get:
      summary: Organization-filtered SSE stream
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream: {}
  /platform/providers:
    get:
      summary: List providers for platform operators
      responses:
        '200': { $ref: '#/components/responses/PaginatedSuccess' }
  /me/ui-preferences:
    get:
      summary: Read the signed-in user's preference for the selected organization and workspace
      responses:
        '200': { description: Saved preference or deep-ocean default with version 0, content: { application/json: { schema: { $ref: '#/components/schemas/UiPreferenceEnvelope' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      summary: Save the signed-in user's theme for the selected organization and workspace
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UiPreferenceUpdate' } } }
      responses:
        '200': { description: Versioned saved preference, content: { application/json: { schema: { $ref: '#/components/schemas/UiPreferenceEnvelope' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
    HttpOnlySession:
      type: apiKey
      in: cookie
      name: __Host-scoutops_session
    HttpOnlyMfaChallenge:
      type: apiKey
      in: cookie
      name: __Host-scoutops_mfa_challenge
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GrantId:
      name: grantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuditAction: { name: action, in: query, schema: { type: string, maxLength: 128 } }
    AuditOutcome: { name: outcome, in: query, schema: { type: string, enum: [succeeded, failed, blocked] } }
    AuditResourceType: { name: resource_type, in: query, schema: { type: string, maxLength: 64 } }
    AuditCursor: { name: cursor, in: query, schema: { type: string, format: uuid } }
    AuditLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    AuditOccurredFrom: { name: occurred_from, in: query, schema: { type: string, format: date-time } }
    AuditOccurredTo: { name: occurred_to, in: query, schema: { type: string, format: date-time } }
  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    PaginatedSuccess:
      description: Paginated successful response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaginatedEnvelope' }
    Error:
      description: Stable sanitized error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    OrganizationMembershipSummary:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, timezone, default_workspace_id, membership_status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
        status: { type: string, enum: [active, archived] }
        timezone: { type: string, maxLength: 64 }
        default_workspace_id: { type: string, format: uuid, nullable: true }
        membership_status: { type: string, enum: [active, disabled] }
    WorkspaceSummary:
      type: object
      additionalProperties: false
      required: [id, organization_id, name, slug, status, version]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
        status: { type: string, enum: [active, archived] }
        version: { type: integer, minimum: 1 }
    TeamSummary:
      type: object
      additionalProperties: false
      required: [id, organization_id, name, status, version]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 120 }
        status: { type: string, enum: [active, archived] }
        version: { type: integer, minimum: 1 }
    TenancyContextSelection:
      type: object
      additionalProperties: false
      required: [organization_id, workspace_id]
      properties:
        organization_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
    SelectedTenancyContext:
      type: object
      additionalProperties: false
      required: [organization, workspace]
      properties:
        organization:
          type: object
          additionalProperties: false
          required: [id, name]
          properties: { id: { type: string, format: uuid }, name: { type: string } }
        workspace: { $ref: '#/components/schemas/WorkspaceSummary' }
    OrganizationMembershipListEnvelope:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/OrganizationMembershipSummary' } } } }]
    WorkspaceListEnvelope:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/WorkspaceSummary' } } } }]
    TeamListEnvelope:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/TeamSummary' } } } }]
    SelectedTenancyContextEnvelope:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/SelectedTenancyContext' } } }]
    AuthorizationScopeSummary:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope: { type: string, enum: [own, team, workspace, organization, platform] }
        workspace_id: { type: string, format: uuid, nullable: true }
        team_id: { type: string, format: uuid, nullable: true }
    CurrentAuthorizationSummary:
      type: object
      additionalProperties: false
      required: [organization_id, workspace_id, roles, capabilities, data_scopes]
      properties:
        organization_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        roles: { type: array, items: { type: string } }
        capabilities: { type: array, items: { type: string, pattern: '^[a-z_]+:[a-z_]+' } }
        data_scopes: { type: array, items: { $ref: '#/components/schemas/AuthorizationScopeSummary' } }
        platform_roles: { type: array, items: { type: string } }
        platform_capabilities: { type: array, items: { type: string, pattern: '^[a-z_]+:[a-z_]+' } }
    NavigationGuardSummary:
      type: object
      additionalProperties: false
      required: [shell, organization_id, workspace_id, roles, capabilities, platform_roles, platform_capabilities, guard_reason]
      properties:
        shell: { type: string, enum: [member, organization_admin, platform_admin] }
        organization_id: { type: string, format: uuid, nullable: true }
        workspace_id: { type: string, format: uuid, nullable: true }
        roles: { type: array, items: { type: string } }
        capabilities: { type: array, items: { type: string, pattern: '^[a-z_]+:[a-z_]+' } }
        platform_roles: { type: array, items: { type: string } }
        platform_capabilities: { type: array, items: { type: string, pattern: '^[a-z_]+:[a-z_]+' } }
        guard_reason: { type: string, enum: [navigation_member_allowed, navigation_organization_admin_allowed, navigation_platform_admin_allowed] }
    NavigationGuardEnvelope:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/NavigationGuardSummary' } } }]
    SecuritySetupStatus:
      type: object
      additionalProperties: false
      required: [required, must_change_password, must_enroll_mfa, completed_at]
      properties:
        required: { type: boolean }
        must_change_password: { type: boolean }
        must_enroll_mfa: { type: boolean }
        completed_at: { type: string, format: date-time, nullable: true }
    SecuritySetupEnvelope:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/SecuritySetupStatus' } } }]
    SecurityAuditEvent:
      type: object
      additionalProperties: false
      required: [id, organization_id, workspace_id, actor_id, action, resource_type, resource_id, outcome, request_id, trace_id, metadata, occurred_at, schema_version]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid, nullable: true }
        workspace_id: { type: string, format: uuid, nullable: true }
        actor_id: { type: string, format: uuid, nullable: true }
        action: { type: string, maxLength: 128 }
        resource_type: { type: string, maxLength: 64 }
        resource_id: { type: string, maxLength: 191, nullable: true }
        outcome: { type: string, enum: [succeeded, failed, blocked] }
        request_id: { type: string, maxLength: 128 }
        trace_id: { type: string, maxLength: 128 }
        metadata: { type: object, additionalProperties: true, description: Sanitized metadata only; secrets are forbidden }
        occurred_at: { type: string, format: date-time }
        schema_version: { type: integer, enum: [1] }
    SecurityAuditPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SecurityAuditEvent' } }
        nextCursor: { type: string, format: uuid, nullable: true }
    SecurityAuditPageEnvelope:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/SecurityAuditPage' } } }]
    RoleCapabilitySummary:
      type: object
      additionalProperties: false
      required: [code, name, category, description, capabilities]
      properties:
        code: { type: string }
        name: { type: string }
        category: { type: string, enum: [organization, platform] }
        description: { type: string }
        capabilities: { type: array, items: { type: string, pattern: '^[a-z_]+:[a-z_]+' } }
    CurrentAuthorizationEnvelope:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/CurrentAuthorizationSummary' } } }]
    RoleCapabilityListEnvelope:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/RoleCapabilitySummary' } } } }]
    ResourceGrantAction:
      type: string
      enum: [task:read, task:update, opportunity:read, opportunity:decide, competitor:read, sourcing:read, supplier_quote:manage, cost:confirm]
    ResourceGrantSummary:
      type: object
      additionalProperties: false
      required: [id, organization_id, workspace_id, resource_type, resource_id, grantee_membership_id, grantor_id, reason, status, effective_status, expires_at, revoked_at, revoked_by, revocation_reason, version, created_at, updated_at, actions]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        resource_type: { type: string, enum: [task, opportunity, competitor, sourcing] }
        resource_id: { type: string, format: uuid }
        grantee_membership_id: { type: string, format: uuid }
        grantor_id: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 500 }
        status: { type: string, enum: [active, revoked] }
        effective_status: { type: string, enum: [active, revoked, expired] }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        revoked_by: { type: string, format: uuid, nullable: true }
        revocation_reason: { type: string, maxLength: 500, nullable: true }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        actions: { type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: { $ref: '#/components/schemas/ResourceGrantAction' } }
    CreateResourceGrantRequest:
      type: object
      additionalProperties: false
      required: [workspace_id, resource_type, resource_id, grantee_membership_id, actions, reason, expires_at]
      properties:
        workspace_id: { type: string, format: uuid }
        resource_type: { type: string, enum: [task, opportunity, competitor, sourcing] }
        resource_id: { type: string, format: uuid }
        grantee_membership_id: { type: string, format: uuid }
        actions: { type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: { $ref: '#/components/schemas/ResourceGrantAction' } }
        reason: { type: string, minLength: 1, maxLength: 500 }
        expires_at: { type: string, format: date-time, description: Must be in the future and no more than 30 days from processing time }
    ExtendResourceGrantRequest:
      type: object
      additionalProperties: false
      required: [expected_version, reason, expires_at]
      properties:
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        expires_at: { type: string, format: date-time, description: Must extend the current expiry and remain within 30 days }
    RevokeResourceGrantRequest:
      type: object
      additionalProperties: false
      required: [expected_version, reason]
      properties:
        expected_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ResourceGrantEnvelope:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/ResourceGrantSummary' } } }]
    ResourceGrantListEnvelope:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ResourceGrantSummary' } }, meta: { type: object, properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer } } } } }]
    EligibleResourceGrantMember:
      type: object
      additionalProperties: false
      required: [id, user_id, email, status]
      properties:
        id: { type: string, format: uuid, description: Membership identifier used only by the grant management form }
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string, enum: [active] }
    EligibleResourceGrantMemberListEnvelope:
      allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/EligibleResourceGrantMember' } } } }]
    LocalAccountRegistration:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 1024, writeOnly: true }
    LocalLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, maxLength: 1024, writeOnly: true }
    ActionTokenConfirm:
      type: object
      additionalProperties: false
      required: [token]
      properties: { token: { type: string, minLength: 20, maxLength: 512, writeOnly: true } }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties: { email: { type: string, format: email, maxLength: 254 } }
    PasswordResetConfirm:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token: { type: string, minLength: 20, maxLength: 512, writeOnly: true }
        new_password: { type: string, minLength: 8, maxLength: 1024, writeOnly: true }
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, maxLength: 1024, writeOnly: true }
        new_password: { type: string, minLength: 8, maxLength: 1024, writeOnly: true }
    LocalAccountSummary:
      type: object
      required: [id, email, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string, enum: [pending_verification, active, locked, disabled] }
    SessionSummary:
      type: object
      required: [id, status, device_label, expires_at, last_seen_at, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, revoked, expired] }
        device_label: { type: string }
        expires_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    MfaCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties: { code: { type: string, minLength: 6, maxLength: 32, writeOnly: true } }
    MfaEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [current_password]
      properties: { current_password: { type: string, maxLength: 1024, writeOnly: true } }
    MfaDisableRequest:
      type: object
      additionalProperties: false
      required: [current_password, code]
      properties:
        current_password: { type: string, maxLength: 1024, writeOnly: true }
        code: { type: string, minLength: 6, maxLength: 32, writeOnly: true }
    MfaChallengeResponse:
      type: object
      required: [mfa_required, expires_at]
      properties:
        mfa_required: { type: boolean, enum: [true] }
        expires_at: { type: string, format: date-time }
    MfaEnrollmentStart:
      type: object
      required: [factor_id, secret, otpauth_uri]
      properties:
        factor_id: { type: string, format: uuid }
        secret: { type: string, description: Displayed once; never logged or persisted by the browser }
        otpauth_uri: { type: string, description: RFC 6238 authenticator enrollment URI displayed once }
    IdentityAdapterCapability:
      type: object
      required: [protocol, status, activation]
      properties:
        protocol: { type: string, enum: [oidc, saml2, scim2] }
        status: { type: string, enum: [adapter_ready, reserved_disabled] }
        activation: { type: string, enum: [requires_approved_provider_and_tenant_mapping] }
    MfaStatus:
      type: object
      required: [totp_enabled, factor_id, confirmed_at, identity_adapters]
      properties:
        totp_enabled: { type: boolean }
        factor_id: { type: string, format: uuid, nullable: true }
        confirmed_at: { type: string, format: date-time, nullable: true }
        identity_adapters: { type: array, items: { $ref: '#/components/schemas/IdentityAdapterCapability' } }
    LocalAccountEnvelope:
      allOf:
        - { $ref: '#/components/schemas/SuccessEnvelope' }
        - { type: object, properties: { data: { $ref: '#/components/schemas/LocalAccountSummary' } } }
    LoginEnvelope:
      allOf:
        - { $ref: '#/components/schemas/SuccessEnvelope' }
        - type: object
          properties:
            data:
              type: object
              required: [user, session]
              properties:
                user: { $ref: '#/components/schemas/LocalAccountSummary' }
                session: { $ref: '#/components/schemas/SessionSummary' }
                security_setup: { $ref: '#/components/schemas/SecuritySetupStatus' }
    MfaChallengeEnvelope:
      allOf:
        - { $ref: '#/components/schemas/SuccessEnvelope' }
        - { type: object, properties: { data: { $ref: '#/components/schemas/MfaChallengeResponse' } } }
    MfaEnrollmentEnvelope:
      allOf:
        - { $ref: '#/components/schemas/SuccessEnvelope' }
        - { type: object, properties: { data: { $ref: '#/components/schemas/MfaEnrollmentStart' } } }
    MfaEnrollmentConfirmEnvelope:
      allOf:
        - { $ref: '#/components/schemas/SuccessEnvelope' }
        - type: object
          properties:
            data:
              type: object
              required: [status, recovery_codes]
              properties:
                status: { type: string, enum: [enabled] }
                recovery_codes: { type: array, minItems: 4, items: { type: string } }
    MfaStatusEnvelope:
      allOf:
        - { $ref: '#/components/schemas/SuccessEnvelope' }
        - { type: object, properties: { data: { $ref: '#/components/schemas/MfaStatus' } } }
    AcceptedEnvelope:
      allOf:
        - { $ref: '#/components/schemas/SuccessEnvelope' }
        - { type: object, properties: { data: { type: object, required: [accepted], properties: { accepted: { type: boolean, enum: [true] } } } } }
    SessionListEnvelope:
      allOf:
        - { $ref: '#/components/schemas/SuccessEnvelope' }
        - { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/SessionSummary' } } } }
    ThemeId:
      type: string
      enum: [deep-ocean, aurora-purple, cloud-white]
    UiPreference:
      type: object
      required: [theme, source, organization_id, workspace_id, version, updated_at]
      properties:
        theme: { $ref: '#/components/schemas/ThemeId' }
        source: { type: string, enum: [default, saved] }
        organization_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time, nullable: true }
    UiPreferenceUpdate:
      type: object
      required: [theme, expected_version]
      additionalProperties: false
      properties:
        theme: { $ref: '#/components/schemas/ThemeId' }
        expected_version: { type: integer, minimum: 0 }
    UiPreferenceEnvelope:
      allOf:
        - { $ref: '#/components/schemas/SuccessEnvelope' }
        - { type: object, properties: { data: { $ref: '#/components/schemas/UiPreference' } } }
    SuccessEnvelope:
      type: object
      required: [data, request_id, trace_id]
      properties:
        data: {}
        request_id: { type: string }
        trace_id: { type: string }
    ErrorEnvelope:
      type: object
      required: [error, request_id, trace_id]
      properties:
        error:
          type: object
          required: [code, message, action_hint]
          properties:
            code: { type: string }
            message: { type: string }
            action_hint: { type: string }
        request_id: { type: string }
        trace_id: { type: string }
    PaginatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            meta:
              type: object
              properties:
                page: { type: integer }
                page_size: { type: integer }
                total: { type: integer }
    TaskStatus:
      type: string
      enum: [draft, scheduled, queued, leased, running, parsing, validating, persisted, retry_scheduled, blocked_login, blocked_captcha, blocked_robots, rate_limited, succeeded, succeeded_empty, completed_with_warnings, failed_terminal, dead_letter, manually_replayed]
    CoverageStatus:
      type: string
      enum: [complete, partial, insufficient]
    TaskSummary:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        coverage_status: { $ref: '#/components/schemas/CoverageStatus' }
        successful_subquery_count: { type: integer, minimum: 0 }
        failed_subquery_count: { type: integer, minimum: 0 }
        blocked_subquery_count: { type: integer, minimum: 0 }
    TaskListEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TaskSummary' }
        request_id: { type: string }
        trace_id: { type: string }
        meta:
          type: object
          properties:
            page: { type: integer }
            page_size: { type: integer }
            total: { type: integer }
    HealthLiveData:
      type: object
      required: [status, service, version, build_sha]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, enum: [product-scout-api] }
        version: { type: string }
        build_sha: { type: string }
    HealthLiveEnvelope:
      type: object
      required: [data, meta, request_id, trace_id]
      properties:
        data: { $ref: '#/components/schemas/HealthLiveData' }
        meta:
          type: object
          required: [observed_at]
          properties:
            observed_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    HealthReadyEnvelope:
      type: object
      required: [data, meta, request_id, trace_id]
      properties:
        data:
          type: object
          required: [status, dependencies]
          properties:
            status: { type: string, enum: [ready] }
            dependencies:
              type: object
              required: [mysql, redis]
              properties:
                mysql: { type: string, enum: [available] }
                redis: { type: string, enum: [available] }
        meta:
          type: object
          properties:
            observed_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    VerificationRun:
      type: object
      required: [run_id, trace_id, scope, scope_id, status, started_at]
      properties:
        run_id: { type: string, format: uuid }
        trace_id: { type: string, format: uuid }
        scope: { type: string, enum: [module, phase, all] }
        scope_id: { type: string }
        status: { type: string, enum: [running, passed, failed, blocked] }
        failure_code: { type: string, nullable: true }
        report_path: { type: string, description: Baota-controlled local path; never a public URL }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    RedisDependencyStatus:
      type: object
      required: [status, latency_ms, checked_at, request_id, trace_id]
      properties:
        status: { type: string, enum: [available, unavailable] }
        latency_ms: { type: integer, minimum: 0 }
        checked_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    DatabaseDependencyStatus:
      type: object
      required: [status, latency_ms, migration_version, checked_at, request_id, trace_id]
      properties:
        status: { type: string, enum: [available, unavailable] }
        latency_ms: { type: integer, minimum: 0 }
        migration_version: { type: string }
        checked_at: { type: string, format: date-time }
        request_id: { type: string }
        trace_id: { type: string }
    FileAsset:
      type: object
      required: [id, organization_id, workspace_id, category, content_sha256, size_bytes, status]
      properties:
        id: { type: string }
        organization_id: { type: string }
        workspace_id: { type: string }
        category: { type: string, enum: [evidence, export, attachment] }
        content_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size_bytes: { type: integer, minimum: 0 }
        status: { type: string, enum: [active, quarantined, deleted] }
    AuditEvent:
      type: object
      required: [audit_id, organization_id, actor_id, action, resource_type, resource_id, request_id, trace_id, occurred_at, schema_version]
      properties:
        audit_id: { type: string }
        organization_id: { type: string }
        workspace_id: { type: string }
        actor_id: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        request_id: { type: string }
        trace_id: { type: string }
        occurred_at: { type: string, format: date-time }
        schema_version: { type: integer, enum: [1] }
    HealthVersionEnvelope:
      type: object
      required: [data, request_id, trace_id]
      properties:
        data:
          type: object
          required: [version, build_sha, config_fingerprint]
          properties:
            version: { type: string }
            build_sha: { type: string }
            config_fingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
        request_id: { type: string }
        trace_id: { type: string }
