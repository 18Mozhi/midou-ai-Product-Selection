  /platform/management:
    get:
      summary: Read platform data, governance, content, notification, email, system-status, API-coverage or operational-log facts
      description: Requires platform:operate. Returns bounded cross-organization operational facts without credentials, message secrets or raw crawler payloads. The api_coverage domain joins the current OpenAPI operation catalog, six-role route source, declared data-source/UI/crawler-effect metadata and latest production acceptance report on every read. A report contributes to the coverage rate only when its schema, path/operation counts and SHA-256 catalog fingerprint match the current OpenAPI. The logs domain correlates up to 200 API audit, Worker task and crawler run events by request_id and trace_id; crawler events additionally return their exact persisted collection task and provider association plus the provider display name so exceptional rows can link to the existing task and source pages. API or Worker rows without an exact provider association keep it null. The response only returns normalized status and error codes, not raw event metadata. The status domain also summarizes the latest persisted BaoTa API topology, Redis, MySQL, file-storage and Worker/Crawler scheduler observations, marking observations older than five minutes as stale and linking to the dedicated operations views.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - {
            name: domain,
            in: query,
            required: true,
            schema:
              {
                type: string,
                enum: [content, notifications, email, status, logs, data, governance, api_coverage],
              },
          }
        - {
            name: entity,
            in: query,
            schema:
              {
                type: string,
                enum: [trends, opportunities, competitors, suppliers],
                default: trends,
              },
          }
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - {
            name: status,
            in: query,
            description: For domain=data, the accepted values are trends active/irrelevant/stale/archived; opportunities pending/adopted/observing/rejected; competitors active/paused; suppliers incomplete/ready/quarantined. Other domains keep their existing status contract.,
            schema: { type: string, maxLength: 40 },
          }
      responses:
        "200":
          description: Current management facts; api_coverage returns the current machine catalog joined to the latest matching production report
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ApiCoverageDashboardEnvelope" }
                  - { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/management/data/exports:
    post:
      summary: Export the current cross-organization platform data filter as an audited CSV
      description: Requires platform:operate and a same-origin request. Exports at most the 100 most recent rows from the same factual query used by the platform data page. The actor, entity, filter, reason and row count are written to platform audit; no raw evidence or credential secret is included.
