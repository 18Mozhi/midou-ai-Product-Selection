  /platform/operations/backup-recovery:
    get:
      summary: Read the audited backup and isolated recovery status
      description: Requires platform:operate. Returns sanitized Huizhou same-host recovery, RPO/RTO, encrypted asset aggregates and drill checks. It explicitly does not claim host or offsite disaster protection. This endpoint never starts backup or restore and never exposes paths, hosts, credentials or organization-level contents.
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          description: Truthful empty, blocked, stale or verified backup recovery state
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id, trace_id]
                properties:
                  data:
                    type: object
                    required:
                      [
                        state,
                        policy,
                        latest_backup,
                        latest_drill,
                        drill_age_days,
                        drill_expires_at,
                        days_until_drill_expiry,
                        recovery_copy_verified,
                        targets,
                        blockers,
                        observed_at,
                      ]
                    properties:
                      state: { type: string, enum: [empty, blocked, stale, verified] }
                      policy:
                        type: object
                        required:
                          [
                            primary_region,
                            recovery_region,
                            rpo_minutes,
                            rto_minutes,
                            maximum_drill_age_days,
                          ]
                        properties:
                          primary_region: { type: string, enum: [惠州] }
                          recovery_region: { type: string, enum: [惠州] }
                          rpo_minutes: { type: integer, minimum: 1, maximum: 15 }
                          rto_minutes: { type: integer, minimum: 1, maximum: 240 }
                          maximum_drill_age_days: { type: integer, minimum: 1, maximum: 90 }
                      latest_backup: { type: object, nullable: true }
                      latest_drill: { type: object, nullable: true }
                      drill_age_days: { type: integer, minimum: 0, nullable: true }
                      drill_expires_at: { type: string, format: date-time, nullable: true }
                      days_until_drill_expiry:
                        {
                          type: integer,
                          nullable: true,
                          description: Signed whole days until the configured drill evidence expiry,
                        }
                      recovery_copy_verified: { type: boolean }
                      targets: { type: array, items: { type: object } }
                      blockers:
                        { type: array, items: { type: object, required: [code, action_hint] } }
                      observed_at: { type: string, format: date-time }
                  request_id: { type: string }
                  trace_id: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/operations/releases:
    get:
      summary: Read the audited production release and rollback gates
      description: Requires platform:operate. Returns only the current S0 release identity, MySQL migration, 5/25/100 same-host candidate observations, automatic-stop and rollback facts recorded by the Baota release task. It never starts a deployment, exposes panel credentials, or claims a backup server, multi-node or 10000-user capacity.
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          description: Truthful empty, blocked, stale, verified, stopped or rolled-back release state
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id, trace_id]
                properties:
                  data:
                    type: object
                    required:
                      [
                        state,
                        policy,
                        latest_release,
                        latest_historical_release,
                        versions,
                        gates,
                        automatic_stop_verified,
                        rollback_verified,
                        blockers,
                        observed_at,
                      ]
                    properties:
                      state:
                        {
                          type: string,
                          enum: [empty, blocked, stale, verified, stopped, rolled_back],
                        }
                      policy:
                        type: object
                        required:
                          [
                            percentages,
                            minimum_observation_seconds,
                            maximum_evidence_age_minutes,
                            error_rate_stop_percent,
                            read_p95_stop_ms,
                            write_p95_stop_ms,
                            async_lag_stop_seconds,
                          ]
                        properties:
                          percentages:
                            {
                              type: array,
                              minItems: 3,
                              maxItems: 3,
                              items: { type: integer, enum: [5, 25, 100] },
                            }
                          minimum_observation_seconds: { type: integer, minimum: 1800 }
                          maximum_evidence_age_minutes: { type: integer, minimum: 1 }
                          error_rate_stop_percent: { type: number, exclusiveMinimum: 0, maximum: 1 }
                          read_p95_stop_ms: { type: integer, maximum: 300 }
                          write_p95_stop_ms: { type: integer, maximum: 600 }
                          async_lag_stop_seconds: { type: integer, maximum: 60 }
                      latest_release: { type: object, nullable: true, additionalProperties: true }
                      latest_historical_release:
                        { type: object, nullable: true, additionalProperties: true }
                      versions:
                        type: object
                        additionalProperties: false
                        required: [local, remote, production]
                        properties:
                          local:
                            type: object
                            required: [build_sha]
                            properties:
                              build_sha: { type: string }
                          remote:
                            type: object
                            required: [build_sha, branch, repository]
                            properties:
                              build_sha: { type: string }
                              branch: { type: string, nullable: true }
                              repository: { type: string, nullable: true }
                          production:
                            type: object
                            required:
                              [build_sha, app_version, config_fingerprint, migration_version]
                            properties:
                              build_sha: { type: string }
                              app_version: { type: string, nullable: true }
                              config_fingerprint: { type: string, nullable: true }
                              migration_version: { type: string, nullable: true }
                      gates: { type: array, items: { type: object, additionalProperties: true } }
                      automatic_stop_verified: { type: boolean }
                      rollback_verified: { type: boolean }
                      blockers:
                        { type: array, items: { type: object, required: [code, action_hint] } }
                      observed_at: { type: string, format: date-time }
                  request_id: { type: string }
                  trace_id: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/operations/releases/write-probe:
    post:
      summary: Record one signed durable release write sample
      description: Internal M07-05 Baota-task endpoint. The task signs timestamp, nonce, release ID and sample ID with the restricted RELEASE_PROBE_SIGNING_KEY. Request and trace IDs are deliberately excluded from the canonical signature because Baota Nginx owns and rewrites proxy audit headers; the API accepts UUID audit IDs or Nginx's restricted 32-hex request ID and stores the values it actually receives. A valid request performs exactly one idempotent MySQL autocommit insert into the compact MySQL 5.7 durability-sample table, using binary sample, build and nonce keys while preserving build, request and trace audit facts. Historical wide probe rows remain immutable and are not copied or deleted by this endpoint. It is not a browser or user-session API.
      security: [{ ReleaseProbeHmac: [] }]
      parameters:
        - {
            name: X-Release-Probe-Timestamp,
            in: header,
            required: true,
            schema: { type: integer, format: int64 },
          }
        - {
            name: X-Release-Probe-Nonce,
            in: header,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { name: X-Request-Id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: X-Trace-Id, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [release_id, sample_id]
              additionalProperties: false
              properties:
                release_id: { type: string, format: uuid }
                sample_id: { type: string, format: uuid }
      responses:
        "202": { description: Signed sample durably recorded or idempotently replayed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/collection/console:
    get:
      summary: Read the audited source and collection operations console
      description: Requires platform:operate. Optional organization_id, workspace_id, provider_id, window and exact error_code scope task, attempt, dead-letter and quality rows; attempt_page and dead_letter_page independently page the two detail collections using the server-configured page size and return exact totals. Root causes count exact collection_dead_letters.error_code facts only, excluding attempts that have not entered dead letter. Source definitions remain platform-global. Write and replay actions use their existing versioned idempotent endpoints.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: organization_id, in: query, schema: { type: string, format: uuid } }
        - { name: workspace_id, in: query, schema: { type: string, format: uuid } }
        - {
            name: provider_id,
            in: query,
            description: Filter task,
            attempt,
            dead-letter and quality facts by their real collection source,
            schema: { type: string, format: uuid },
          }
        - {
            name: window,
            in: query,
            description: Limit operational facts by their task update or event observation time,
            schema: { type: string, enum: [24h, 7d, 30d, all], default: 24h },
          }
        - {
            name: error_code,
            in: query,
            description: Drill recent attempts and dead letters by an exact returned error root,
            schema: { type: string, maxLength: 80 },
          }
        - {
            name: attempt_page,
            in: query,
            description: One-based page for task attempts,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: dead_letter_page,
            in: query,
            description: One-based page for dead-letter records,
            schema: { type: integer, minimum: 1, default: 1 },
          }
      responses:
        "200":
          {
            description: Source health,
            task states,
            recent attempts,
            dead letters grouped by exact failure root,
            quality summary,
            independent attempt and dead-letter pagination totals and controlled action links,
            content: { application/json: { schema: { type: object } } },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/security/operations:
    get:
      summary: Read the audited platform security operations view
      description: Requires platform:secure. Returns login outcomes, session metadata, credential lifecycle metadata, organization token metadata and platform audit rows; never returns token hashes, session tokens, credential ciphertext, nonces, auth tags, cookies or raw IP/user-agent values.
      security: [{ HttpOnlySession: [] }]
      parameters:
        [{ name: window, in: query, schema: { type: string, enum: [24h, 7d, 30d], default: 24h } }]
      responses:
        "200":
          {
            description: Sanitized security operations facts,
            content: { application/json: { schema: { type: object } } },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/open:
    get:
      summary: List sanitized API Clients, Webhooks and deliveries
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          {
            name: organization_id,
            in: query,
            required: false,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        {
          "200":
            {
              description: Sanitized open platform overview,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/OpenPlatformEnvelope" } },
                },
            },
          "401": { $ref: "#/components/responses/Error" },
          "403": { $ref: "#/components/responses/Error" },
        }
  /platform/open/clients:
    post:
      summary: Create an API Client and return its secret once
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [organization_id, name, scopes, reason],
                      properties:
                        {
                          organization_id: { type: string, format: uuid },
                          name: { type: string, maxLength: 120 },
                          scopes: { type: array, items: { type: string, enum: ["status:read"] } },
                          quota_per_minute: { type: integer, minimum: 1, maximum: 1000 },
                          reason: { type: string, maxLength: 500 },
                        },
                    },
                },
            },
        }
      responses:
        {
          "201":
            {
              description: Secret is present only in this non-replayed response,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/OneTimeSecretEnvelope" } },
                },
            },
          "400": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /platform/open/clients/{clientId}/actions:
    post:
      summary: Rotate or revoke an API Client
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          { name: clientId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      responses:
        {
          "200": { description: Versioned result; a rotation secret is returned once },
          "409": { $ref: "#/components/responses/Error" },
        }
  /platform/open/webhooks:
    post:
      summary: Create an HTTPS Webhook and return its signing secret once
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        {
          "201": { description: AES-256-GCM encrypted signing secret returned once },
          "400": { $ref: "#/components/responses/Error" },
        }
  /platform/open/webhooks/{endpointId}:
    patch:
      summary: Update a versioned Webhook endpoint
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          { name: endpointId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      responses:
        {
          "200": { description: Updated endpoint },
          "409": { $ref: "#/components/responses/Error" },
        }
  /platform/open/webhooks/{endpointId}/rotate:
    post:
      summary: Rotate a Webhook signing secret
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          { name: endpointId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      responses:
        {
          "200": { description: Signing secret returned once },
          "409": { $ref: "#/components/responses/Error" },
        }
  /platform/open/webhooks/{endpointId}/test:
    post:
      summary: Queue a signed test delivery
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          { name: endpointId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      responses:
        { "202": { description: Queued delivery }, "409": { $ref: "#/components/responses/Error" } }
  /platform/open/deliveries/{deliveryId}/replay:
    post:
      summary: Replay a succeeded or dead-letter delivery as a new delivery
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          { name: deliveryId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      responses:
        {
          "202": { description: New queued delivery with source evidence },
          "409": { $ref: "#/components/responses/Error" },
        }
  /platform/commercial:
    get:
      summary: Read quota-only commercial plans and optional organization usage
      description: Requires platform:operate. Each plan includes assignment_count for active or suspended organization assignments so clients can preview impact. With organization_id, aggregates the current assignment period from persisted collection task, open API usage and report export facts. Does not return price, payment, invoice or tax data.
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          {
            name: organization_id,
            in: query,
            required: false,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        {
          "200":
            { description: Plans and optional organization assignment usage and effective quotas },
          "400": { $ref: "#/components/responses/Error" },
          "401": { $ref: "#/components/responses/Error" },
          "403": { $ref: "#/components/responses/Error" },
        }
  /platform/commercial/plans:
    post:
      summary: Create a versioned quota plan draft
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [code, name, quotas, reason],
                      properties:
                        {
                          code: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,79}$" },
                          name: { type: string, maxLength: 120 },
                          description: { type: string, nullable: true, maxLength: 500 },
                          quotas:
                            {
                              type: object,
                              additionalProperties: false,
                              properties:
                                {
                                  collection_tasks:
                                    { type: integer, minimum: 0, maximum: 1000000000 },
                                  open_api_requests:
                                    { type: integer, minimum: 0, maximum: 1000000000 },
                                  report_exports:
                                    { type: integer, minimum: 0, maximum: 1000000000 },
                                },
                            },
                          reason: { type: string, maxLength: 500 },
                        },
                    },
                },
            },
        }
      responses:
        {
          "201": { description: Draft plan result },
          "400": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /platform/commercial/plans/{planId}:
    patch:
      summary: Update, activate or retire a versioned quota plan
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          { name: planId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      responses:
        {
          "200": { description: Updated plan version },
          "400": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /platform/commercial/assignments:
    post:
      summary: Assign, renew or change an active quota plan and explicit period for an organization
      description: Creates the current assignment when absent; otherwise updates the same versioned assignment with a new active plan and billing period. Every call requires a reason and writes audit and commercial events.
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        {
          "201": { description: Current organization assignment },
          "400": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /platform/commercial/assignments/{assignmentId}/actions:
    post:
      summary: Suspend, resume or end a versioned organization plan assignment
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      responses:
        {
          "200": { description: Updated assignment version },
          "400": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /platform/commercial/adjustments:
    post:
      summary: Create an audited nonzero quota adjustment
      security: [{ HttpOnlySession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        {
          "201": { description: Active quota adjustment },
          "400": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /platform/commercial/adjustments/{adjustmentId}/revoke:
    post:
      summary: Revoke a versioned quota adjustment with a reason
      security: [{ HttpOnlySession: [] }]
      parameters:
        [
          { name: adjustmentId, in: path, required: true, schema: { type: string, format: uuid } },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      responses:
        {
