      parameters:
        - {
            name: shell,
            in: query,
            required: true,
            schema:
              {
                type: string,
                enum: [member, organization_admin, platform_admin],
              },
          }
      responses:
        "200":
          {
            description: Navigation entries only; this endpoint performs no business mutation,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/QuickActionListEnvelope" },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/home-dashboard:
