            schema:
              type: object
              required: [entity, reason]
              properties:
                entity: { type: string, enum: [trends, opportunities, competitors, suppliers] }
                query: { type: string, maxLength: 120 }
                status:
                  {
                    type: string,
                    maxLength: 40,
                    description: Must match the selected entity status set documented on GET /platform/management.,
                  }
                reason: { type: string, minLength: 2, maxLength: 300 }
      responses:
        "200":
          {
            description: UTF-8 BOM CSV attachment containing the current filtered rows,
            content: { text/csv: { schema: { type: string } } },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /platform/management/logs/exports:
    post:
      summary: Export the current bounded operational log filter as an audited CSV
      description: Requires platform:operate and a same-origin request. Exports at most the same 200 normalized API audit, Worker task and Crawler run events returned by the logs page for the submitted query and source filter. The actor, exact filter, reason and row count are written to platform audit. CSV cells are formula-injection protected and contain no raw metadata, payload, stderr, credential or cookie.
