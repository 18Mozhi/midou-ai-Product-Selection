      responses:
        "200":
          {
            description: Audited shell access and server-derived role context,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/NavigationGuardEnvelope" },
                  },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/landing:
    get:
      summary: Resolve the authenticated user's preferred application landing
      description: Platform administrators land in the platform console without an organization context. Otherwise the active organization context selects the organization-admin or member workspace; users without an active context are sent to context selection. Every resolution writes an authorization decision.
      security: [{ HttpOnlySession: [] }]
      responses:
        "200":
          {
            description: Audited role-aware landing route,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/LandingEnvelope" } },
              },
          }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /me/global-search:
    get:
      summary: Search indexed resources in the selected organization and workspace
      description: Requires an active selected context and task:read. Results are additionally filtered by each document's required capability.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - {
            name: q,
            in: query,
            required: true,
            schema: { type: string, minLength: 2, maxLength: 100 },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 20, default: 10 },
          }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          {
            description: Capability-filtered workspace search results,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/GlobalSearchEnvelope" },
                  },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/quick-actions:
