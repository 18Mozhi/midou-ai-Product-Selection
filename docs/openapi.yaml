        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /platform/accounts/users/{userId}/status:
    post:
      summary: Stop or restore a user login
      description: Disabling a user also revokes all active sessions; a super administrator cannot disable the currently authenticated account.
      security: [{ HttpOnlySession: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        {
          required: true,
